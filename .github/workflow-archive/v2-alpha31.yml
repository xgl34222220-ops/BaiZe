name: BaiZe v2 Alpha 31

on:
  push:
    branches: [v2-alpha31]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha31.yml'
  pull_request:
    branches: [v2-alpha30]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha31.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha31
          fetch-depth: 0

      - name: Validate state machine and UI
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          test ! -f v2/scripts/apply-alpha31.py
          grep -q 'pendingSnapshotClean' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'pendingScanAfterConnect' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'runPendingActionsIfReady' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          ! grep -q 'pendingClean' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          ! grep -q 'animateScrollToItem(5)' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q '扫描结果已就绪' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q '快照就绪' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'version=v2.0.0-alpha31' v2/module/module.prop
          grep -q 'versionCode = 21100' v2/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha31-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha31'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -p "$ZIP" cleaner.sh | grep -q '^run_apk_packages()'
          unzip -p "$ZIP" config/default.conf | grep -q 'clean_apk_packages=1'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha31
          path: v2/dist/BaiZe-v2-Alpha31-Module.zip
