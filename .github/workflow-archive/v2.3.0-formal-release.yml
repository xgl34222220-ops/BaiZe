name: BaiZe v2.3.0 Formal Release

on:
  workflow_run:
    workflows: ["BaiZe v2.3.0 All-App Download Safe Builder"]
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: baize-v230-formal-release
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feat/v2.3.0-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "BaiZe-v2.3.0-All-App-Download-Safe-Test") | .id' | head -n 1)
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/baize-artifact.zip
          mkdir -p /tmp/baize-release
          unzip -q /tmp/baize-artifact.zip -d /tmp/baize-release

      - name: Prepare and verify purpose-only module metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-release
          SOURCE_MODULE=$(find "$ROOT" -type f -name 'BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip' -print -quit)
          SOURCE_APK=$(find "$ROOT" -type f -name 'BaiZe-v2.3.0-All-App-Download-Safe-Test.apk' -print -quit)
          test -s "$SOURCE_MODULE"
          test -s "$SOURCE_APK"
          cp "$SOURCE_MODULE" "$ROOT/BaiZe-v2.3.0-Module.zip"
          cp "$SOURCE_APK" "$ROOT/BaiZe-v2.3.0.apk"
          unzip -tq "$ROOT/BaiZe-v2.3.0-Module.zip"
          PROP=$(unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" module.prop)
          printf '%s\n' "$PROP" | grep -qx 'version=v2.3.0'
          printf '%s\n' "$PROP" | grep -qx 'description=用于清理应用缓存、安装包、卸载残留和深度垃圾，并整理应用下载、接收、附件与导出文件。'
          if printf '%s\n' "$PROP" | grep -Eq '测试版|稳定化版|后台任务|自恢复|Root Worker|更新|修复|优化'; then
            echo 'module.prop 仍包含更新日志式描述' >&2
            printf '%s\n' "$PROP" >&2
            exit 1
          fi
          CUSTOMIZE=$(unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh)
          printf '%s\n' "$CUSTOMIZE" | grep -q '白泽是 Android Root 垃圾清理与文件归类模块'
          if printf '%s\n' "$CUSTOMIZE" | grep -Eq '测试版|稳定化版|本次|新增|修复|优化'; then
            echo '刷入说明仍包含更新日志式文字' >&2
            exit 1
          fi
          sha256sum "$ROOT/BaiZe-v2.3.0-Module.zip" > "$ROOT/BaiZe-v2.3.0-Module.zip.sha256"
          sha256sum "$ROOT/BaiZe-v2.3.0.apk" > "$ROOT/BaiZe-v2.3.0.apk.sha256"

      - name: Replace v2.3.0 formal release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-release
          TAG=v2.3.0
          cat >/tmp/release-notes.md <<'EOF'
          # 白泽 v2.3.0

          白泽是 Android Root 垃圾清理与文件归类模块，用于清理应用缓存、安装包、卸载残留和深度垃圾，并整理应用下载、接收、附件与导出文件。配套 App 用于操作、白名单与定时任务设置。

          在 Magisk、KernelSU 或 APatch 中刷入 `BaiZe-v2.3.0-Module.zip` 并重启。App 未自动安装时，手动安装 `BaiZe-v2.3.0.apk`。
          EOF

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$HEAD_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" >/dev/null
          fi

          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null || true)
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r 'select(.id != null) | .id' 2>/dev/null || true)
          BODY=$(cat /tmp/release-notes.md)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name='白泽 v2.3.0' \
              -f body="$BODY" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null
          else
            RELEASE_ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name='白泽 v2.3.0' \
              -f body="$BODY" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true --jq '.id')
          fi

          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          for name in \
            BaiZe-v2.3.0-Module.zip \
            BaiZe-v2.3.0-Module.zip.sha256 \
            BaiZe-v2.3.0.apk \
            BaiZe-v2.3.0.apk.sha256; do
            OLD_ASSET_ID=$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' | head -n 1)
            if [ -n "$OLD_ASSET_ID" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ASSET_ID" >/dev/null
            fi
          done

          upload_asset() {
            file=$1
            content_type=$2
            name=${file##*/}
            gh api -X POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: $content_type" \
              --input "$file" >/dev/null
          }

          upload_asset "$ROOT/BaiZe-v2.3.0-Module.zip" application/zip
          upload_asset "$ROOT/BaiZe-v2.3.0-Module.zip.sha256" text/plain
          upload_asset "$ROOT/BaiZe-v2.3.0.apk" application/vnd.android.package-archive
          upload_asset "$ROOT/BaiZe-v2.3.0.apk.sha256" text/plain

      - name: Verify corrected formal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.3.0")
          test "$(printf '%s' "$RELEASE" | jq -r '.draft')" = false
          test "$(printf '%s' "$RELEASE" | jq -r '.prerelease')" = false
          ASSETS=$(printf '%s' "$RELEASE" | jq -r '.assets[].name')
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0-Module.zip'
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0-Module.zip.sha256'
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0.apk'
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0.apk.sha256'
