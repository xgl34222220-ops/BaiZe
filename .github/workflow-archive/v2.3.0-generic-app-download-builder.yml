name: BaiZe v2.3.0 All-App Download Safe Builder

on:
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: baize-v230-all-app-download-safe-builder
  cancel-in-progress: true

jobs:
  build-all-app-safe-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization')
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 全应用下载目录安全归类构建

          - 运行编号：\`$RUN_ID\`
          - 状态：**building**
          - 源码提交：\`$HEAD_SHA\`
          - 策略：扫描所有 App，但只归类高可信用户下载/接收/附件/导出目录
          EOF
          gh issue edit 96 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - uses: actions/checkout@v4
        with:
          ref: feat/v2.3.0-stabilization
          fetch-depth: 0

      - name: Materialize all-app safe source
        shell: bash
        run: |
          set -euo pipefail
          cp v2/module/task-worker.sh /tmp/baize-task-worker.detached.sh
          cp v2/scripts/package-module.sh /tmp/baize-package-module.detached.sh
          if [ -f tools/prepare-v230-materialization.py ]; then python3 tools/prepare-v230-materialization.py; fi
          if [ -f tools/bootstrap-v230.py.gz.b64 ]; then
            base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
            python3 -m py_compile /tmp/bootstrap-v230.py
            python3 /tmp/bootstrap-v230.py
          fi
          if [ -f tools/finalize-v230.py.gz.b64 ]; then
            base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
            python3 -m py_compile /tmp/finalize-v230.py
            python3 /tmp/finalize-v230.py
          fi
          if [ -f tools/fix-v230-android-lint.py ]; then python3 tools/fix-v230-android-lint.py; fi
          if [ -f tools/apply-v230-organizer-download-coverage.py ]; then python3 tools/apply-v230-organizer-download-coverage.py; fi
          cp /tmp/baize-task-worker.detached.sh v2/module/task-worker.sh
          cp /tmp/baize-package-module.detached.sh v2/scripts/package-module.sh
          python3 -m py_compile \
            tools/apply-v230-detached-organizer.py \
            tools/fix-v230-detached-organizer-kotlin.py \
            tools/apply-v230-generic-app-download-policy.py
          python3 tools/apply-v230-detached-organizer.py
          python3 tools/fix-v230-detached-organizer-kotlin.py
          python3 tools/apply-v230-generic-app-download-policy.py
          git diff --check

      - name: Verify generic path policy
        shell: bash
        run: |
          set -euo pipefail
          ORGANIZER=v2/module/organizer-worker.sh
          grep -q 'generic-user-file-dir-policy-v2.3' "$ORGANIZER"
          grep -q 'append_user_file_dirs' "$ORGANIZER"
          grep -q 'has_user_file_segment' "$ORGANIZER"
          grep -q 'is_suspicious_app_resource' "$ORGANIZER"
          grep -q 'is_game_package' "$ORGANIZER"
          grep -q 'Android/data/\*' "$ORGANIZER"
          grep -q 'Android/media/\*' "$ORGANIZER"
          grep -q 'runModuleTask("organize")' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerActivity.kt
          grep -q 'runModuleTask("organize")' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
          bash -n v2/module/storage-index.sh
          bash -n v2/module/task-worker.sh
          bash -n "$ORGANIZER"

      - name: Run hostile broad-index all-app regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-all-app-hostile
          MOD="$ROOT/module"
          MEDIA="$ROOT/media"
          STATE="$ROOT/state"
          rm -rf "$ROOT"
          mkdir -p "$MOD" \
            "$MEDIA/0/Download" \
            "$MEDIA/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv" \
            "$MEDIA/0/Android/data/com.example.chat/files/Download" \
            "$MEDIA/0/Android/data/com.example.cloud/private/received" \
            "$MEDIA/0/Android/data/com.example.notes/export" \
            "$MEDIA/0/Android/data/com.example.mail/data/attachments" \
            "$MEDIA/0/Android/data/com.example.chat/cache/Download" \
            "$MEDIA/0/Android/data/com.example.game/files/assets/textures" \
            "$MEDIA/0/Android/data/com.example.game/files/Download"
          cp v2/module/organizer-worker.sh "$MOD/organizer-worker.sh"
          chmod 0755 "$MOD/organizer-worker.sh"
          cat >"$MOD/storage-index.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          mkdir -p "$BAIZE_STATE_DIR/index"
          find "$BAIZE_MEDIA_ROOT" -type f -print0 >"$BAIZE_STATE_DIR/index/storage-files.nul"
          EOF
          chmod 0755 "$MOD/storage-index.sh"
          sed -i 's|/system/bin/sh "$INDEXER"|/bin/bash "$INDEXER"|' "$MOD/organizer-worker.sh"
          printf 'public-photo' >"$MEDIA/0/Download/user-photo.jpg"
          printf 'qq-module' >"$MEDIA/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu-Test.zip"
          printf 'chat-export' >"$MEDIA/0/Android/data/com.example.chat/files/Download/chat-export.zip"
          printf 'cloud-apk' >"$MEDIA/0/Android/data/com.example.cloud/private/received/cloud-client.apk"
          printf 'notes-pdf' >"$MEDIA/0/Android/data/com.example.notes/export/notes.pdf"
          printf 'mail-doc' >"$MEDIA/0/Android/data/com.example.mail/data/attachments/report.docx"
          printf 'cache-file' >"$MEDIA/0/Android/data/com.example.chat/cache/Download/must-not-move.zip"
          printf 'game-texture' >"$MEDIA/0/Android/data/com.example.game/files/assets/textures/character.webp"
          printf 'game-patch' >"$MEDIA/0/Android/data/com.example.game/files/Download/patch.png"
          BAIZE_GAME_PACKAGES=com.example.game BAIZE_MEDIA_ROOT="$MEDIA" BAIZE_STATE_DIR="$STATE" \
            bash "$MOD/organizer-worker.sh" organize ci all-app-hostile
          test -f "$MEDIA/0/BaiZe归类/图片/user-photo.jpg"
          test -f "$MEDIA/0/BaiZe归类/压缩包/LuoShu-Test.zip"
          test -f "$MEDIA/0/BaiZe归类/压缩包/chat-export.zip"
          test -f "$MEDIA/0/BaiZe归类/安装包/cloud-client.apk"
          test -f "$MEDIA/0/BaiZe归类/文档/notes.pdf"
          test -f "$MEDIA/0/BaiZe归类/文档/report.docx"
          test -f "$MEDIA/0/Android/data/com.example.chat/cache/Download/must-not-move.zip"
          test -f "$MEDIA/0/Android/data/com.example.game/files/assets/textures/character.webp"
          test -f "$MEDIA/0/Android/data/com.example.game/files/Download/patch.png"
          test ! -f "$MEDIA/0/BaiZe归类/图片/character.webp"
          test ! -f "$MEDIA/0/BaiZe归类/图片/patch.png"
          grep -qx 'requested=6' "$STATE/organizer-result.env"
          grep -qx 'moved=6' "$STATE/organizer-result.env"
          grep -qx 'failed=0' "$STATE/organizer-result.env"

      - name: Run generic fallback discovery regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-all-app-fallback
          MOD="$ROOT/module"
          MEDIA="$ROOT/media"
          STATE="$ROOT/state"
          rm -rf "$ROOT"
          mkdir -p "$MOD" \
            "$MEDIA/0/Download" \
            "$MEDIA/0/Android/data/com.unknown.chat/files/Downloads" \
            "$MEDIA/0/Android/data/com.unknown.notes/exports" \
            "$MEDIA/0/Android/data/com.example.game/files/Download"
          cp v2/module/organizer-worker.sh "$MOD/organizer-worker.sh"
          chmod 0755 "$MOD/organizer-worker.sh"
          cat >"$MOD/storage-index.sh" <<'EOF'
          #!/usr/bin/env bash
          mkdir -p "$BAIZE_STATE_DIR/index"
          : >"$BAIZE_STATE_DIR/index/storage-files.nul"
          EOF
          chmod 0755 "$MOD/storage-index.sh"
          sed -i 's|/system/bin/sh "$INDEXER"|/bin/bash "$INDEXER"|' "$MOD/organizer-worker.sh"
          printf 'public-doc' >"$MEDIA/0/Download/public-document.pdf"
          printf 'unknown-chat' >"$MEDIA/0/Android/data/com.unknown.chat/files/Downloads/conversation.zip"
          printf 'unknown-notes' >"$MEDIA/0/Android/data/com.unknown.notes/exports/notebook.pdf"
          printf 'game-file' >"$MEDIA/0/Android/data/com.example.game/files/Download/game-resource.png"
          BAIZE_GAME_PACKAGES=com.example.game BAIZE_MEDIA_ROOT="$MEDIA" BAIZE_STATE_DIR="$STATE" \
            bash "$MOD/organizer-worker.sh" organize ci all-app-fallback
          test -f "$MEDIA/0/BaiZe归类/文档/public-document.pdf"
          test -f "$MEDIA/0/BaiZe归类/压缩包/conversation.zip"
          test -f "$MEDIA/0/BaiZe归类/文档/notebook.pdf"
          test -f "$MEDIA/0/Android/data/com.example.game/files/Download/game-resource.png"
          test ! -f "$MEDIA/0/BaiZe归类/图片/game-resource.png"
          grep -qx 'requested=3' "$STATE/organizer-result.env"
          grep -qx 'moved=3' "$STATE/organizer-result.env"
          grep -qx 'failed=0' "$STATE/organizer-result.env"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build release APK
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee android-build.log

      - name: Package and verify all-app safe files
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh
          SOURCE_ZIP=dist/BaiZe-v2.3.0-Module.zip
          SOURCE_APK=app/build/outputs/apk/release/app-release.apk
          MODULE=dist/BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip
          APK=dist/BaiZe-v2.3.0-All-App-Download-Safe-Test.apk
          test -s "$SOURCE_ZIP"
          test -s "$SOURCE_APK"
          unzip -tq "$SOURCE_ZIP"
          unzip -p "$SOURCE_ZIP" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$SOURCE_ZIP" task-worker.sh | grep -q 'organizer-worker.sh'
          unzip -p "$SOURCE_ZIP" organizer-worker.sh | grep -q 'generic-user-file-dir-policy-v2.3'
          unzip -p "$SOURCE_ZIP" organizer-worker.sh | grep -q 'append_user_file_dirs'
          unzip -p "$SOURCE_ZIP" organizer-worker.sh | grep -q 'is_game_package'
          cp "$SOURCE_ZIP" "$MODULE"
          cp "$SOURCE_APK" "$APK"
          sha256sum "$MODULE" >"$MODULE.sha256"
          sha256sum "$APK" >"$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-All-App-Download-Safe-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip
            v2/dist/BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip.sha256
            v2/dist/BaiZe-v2.3.0-All-App-Download-Safe-Test.apk
            v2/dist/BaiZe-v2.3.0-All-App-Download-Safe-Test.apk.sha256
            v2/android-build.log

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.3.0-all-app-download-safe-test
          MODULE=v2/dist/BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip
          APK=v2/dist/BaiZe-v2.3.0-All-App-Download-Safe-Test.apk
          cat >/tmp/notes.md <<'EOF'
          # 白泽 v2.3.0 全应用下载目录安全归类测试版

          - 遍历所有应用包，但只发现 Download、received、attachments、export、saved、documents 等用户文件目录。
          - 不依赖固定包名白名单，陌生第三方应用同样生效。
          - 游戏类别应用、资源目录、缓存、数据库和临时目录强制排除。
          - 独立 Root Worker 继续支持切后台、划掉 App 后运行与重新进入恢复进度。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title '白泽 v2.3.0 全应用下载目录安全归类测试版' --notes-file /tmp/notes.md --prerelease
            gh release upload "$TAG" "$MODULE" "$MODULE.sha256" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$MODULE" "$MODULE.sha256" "$APK" "$APK.sha256" \
              --target feat/v2.3.0-stabilization \
              --title '白泽 v2.3.0 全应用下载目录安全归类测试版' \
              --notes-file /tmp/notes.md --prerelease
          fi

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 全应用下载目录安全归类构建

          - 运行编号：\`$RUN_ID\`
          - 构建结果：**$RESULT**
          - 源码提交：\`$HEAD_SHA\`
          - 预发行标签：\`v2.3.0-all-app-download-safe-test\`
          - 覆盖：未知第三方 App 下载/接收/附件/导出目录 + 游戏资源拦截
          EOF
          gh issue edit 96 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
