name: BaiZe v2.3.0 Run ID Reporter

on:
  pull_request_target:
    types: [synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  report-run-id:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Report run identifier
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "BAIZE_V230_RUN_REPORT run_id=$RUN_ID attempt=$RUN_ATTEMPT head=$HEAD_SHA"
