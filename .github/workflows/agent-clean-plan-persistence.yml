name: Apply clean plan persistence

on:
  push:
    branches: [agent/clean-plan-persistence]

permissions:
  contents: write

concurrency:
  group: agent-clean-plan-persistence
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/clean-plan-persistence

      - name: Apply focused source patch
        run: python3 tools/apply-clean-plan-persistence.py

      - name: Run clean plan regression checks
        run: python3 v2/tests/test-clean-plan-persistence.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android sources
        working-directory: v2
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'feat(clean): persist and restore immutable clean plans'
          git push origin HEAD:agent/clean-plan-persistence
