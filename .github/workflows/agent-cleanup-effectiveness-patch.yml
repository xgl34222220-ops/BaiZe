name: Agent Cleanup Effectiveness Patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleanup-effectiveness-score
          fetch-depth: 0
      - name: Integrate cleanup effectiveness scoring
        run: python3 .github/scripts/cleanup_effectiveness_patch.py
      - name: Verify integration markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'effectivenessAnalyzer.analyze(combined)' v2/app/src/main/java/io/github/xgl34222220/baize/root/AuditRepository.kt
          grep -Fq 'CleanupEffectivenessActivity::class.java' v2/app/src/main/java/io/github/xgl34222220/baize/AuditActivity.kt
          grep -Fq 'android:name=".CleanupEffectivenessActivity"' v2/app/src/main/AndroidManifest.xml
      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/AuditRepository.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/AuditActivity.kt \
                  v2/app/src/main/AndroidManifest.xml
          git commit -m 'feat: integrate cleanup effectiveness dashboard'
          git push origin HEAD:agent/cleanup-effectiveness-score
