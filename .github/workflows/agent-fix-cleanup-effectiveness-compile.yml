name: Agent Fix Cleanup Effectiveness Compile

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cleanup-effectiveness-score
          fetch-depth: 0
      - name: Fix Kotlin compile wiring
        run: python3 .github/scripts/fix_cleanup_effectiveness_compile.py
      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'onOpenPolicy = { startActivity(Intent(this, CleanupPolicyActivity::class.java)) },' v2/app/src/main/java/io/github/xgl34222220/baize/AuditActivity.kt
          grep -Fq 'onOpenPolicy: () -> Unit,' v2/app/src/main/java/io/github/xgl34222220/baize/AuditActivity.kt
          ! grep -Fq 'import androidx.compose.foundation.layout.weight' v2/app/src/main/java/io/github/xgl34222220/baize/CleanupEffectivenessActivity.kt
      - name: Commit compile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/app/src/main/java/io/github/xgl34222220/baize/AuditActivity.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/CleanupEffectivenessActivity.kt
          git commit -m 'fix: repair cleanup effectiveness UI wiring'
          git push origin HEAD:agent/cleanup-effectiveness-score
