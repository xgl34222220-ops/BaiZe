name: Agent Quarantine Final Fix

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quarantine-undo
          fetch-depth: 0
      - name: Apply targeted Kotlin fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt')
          engine = engine_path.read_text()
          old = '    private val quarantineRepository: QuarantineRepository\n) {'
          new = '    private val quarantineRepository: QuarantineRepository = QuarantineRepository()\n) {'
          if old not in engine:
              raise SystemExit('engine constructor field not found')
          engine_path.write_text(engine.replace(old, new, 1))

          repo_path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/root/QuarantineRepository.kt')
          repo = repo_path.read_text()
          repo = repo.replace('?: return error(', '?: return errorJson(')
          repo = repo.replace('return error(', 'return errorJson(')
          old_fun = '    private fun error(code: String, message: String): String = JSONObject()'
          new_fun = '    private fun errorJson(code: String, message: String): String = JSONObject()'
          if old_fun not in repo:
              raise SystemExit('quarantine JSON error function not found')
          repo_path.write_text(repo.replace(old_fun, new_fun, 1))
          PY
          git diff --check
          git diff --stat
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/root/QuarantineRepository.kt
          git commit -m 'fix: support persistent scanner and disambiguate quarantine errors'
          git push origin HEAD:agent/quarantine-undo
