name: Agent Quarantine Integration Patch

on:
  push:
    branches: [agent/quarantine-undo]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'integrate quarantine workbench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quarantine-undo
          fetch-depth: 0
      - name: Integrate quarantine engine and UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: pattern not found')
              return text.replace(old, new, 1)

          engine_path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt')
          engine = engine_path.read_text()
          engine = replace_once(
              engine,
              '''internal class NativeProfileEngine(
              private val context: Context,
              private val cancelled: AtomicBoolean
          ) {''',
              '''internal class NativeProfileEngine(
              private val context: Context,
              private val cancelled: AtomicBoolean,
              private val quarantineRepository: QuarantineRepository
          ) {''',
              'engine constructor',
          )
          safe_start = engine.index('    private fun scanSafe(')
          safe_end = engine.index('    fun page(', safe_start)
          safe = engine[safe_start:safe_end]
          count = safe.count(', options)')
          if count < 5:
              raise SystemExit(f'scanSafe expected at least 5 candidate additions, found {count}')
          safe = safe.replace(', options)', ', options, true)')
          engine = engine[:safe_start] + safe + engine[safe_end:]

          marker = '    private fun scanEmpty(\n'
          quarantine_method = '''    fun quarantine(
              snapshotId: String,
              selectionJson: String,
              optionsJson: String,
              progress: (Progress) -> Unit
          ): String {
              val snapshot = validSnapshot(snapshotId)
                  ?: return JSONObject().put("error", "snapshot_expired").put("message", "扫描快照不存在或已过期").toString()
              if (snapshot.profile == "deep") {
                  val current = sha256(deepRules())
                  if (snapshot.ruleSha.isBlank() || current != snapshot.ruleSha) {
                      snapshots.remove(snapshotId)
                      return JSONObject().put("error", "rules_changed").put("message", "深度规则已变化，请重新扫描").toString()
                  }
              }
              val selection = parseSelection(selectionJson)
              val selected = snapshot.candidates.filter { candidate ->
                  candidate.risk == "high" && (selection[candidate.id] == true || selection[candidate.path] == true)
              }
              if (selected.isEmpty()) {
                  return JSONObject().put("error", "empty_selection").put("message", "没有明确选择高风险隔离项目").toString()
              }

              val options = parseOptions(optionsJson).copy(allowHighRisk = true)
              val mounts = mountPoints()
              val details = JSONArray()
              var quarantined = 0
              var quarantinedBytes = 0L
              var quarantinedFiles = 0L
              var quarantinedDirectories = 0L
              var failures = 0
              val started = SystemClock.elapsedRealtime()
              val deadline = started + CLEAN_TOTAL_MS
              for ((index, candidate) in selected.withIndex()) {
                  if (cancelled.get() || SystemClock.elapsedRealtime() >= deadline) break
                  progress(Progress("正在隔离${candidate.label}", index, selected.size, candidate.path, quarantinedBytes, quarantinedFiles, failures))
                  val reason = validate(candidate, options, mounts)
                  if (reason != null) {
                      failures += 1
                      details.put(detail(candidate, "protected", reason, 0L, 0L, 0L))
                      continue
                  }
                  val result = quarantineRepository.quarantine(
                      snapshotId = snapshotId,
                      candidateId = candidate.id,
                      originalPath = candidate.path,
                      profile = candidate.profile,
                      category = candidate.category,
                      label = candidate.label,
                      risk = candidate.risk
                  )
                  if (result.success) {
                      quarantined += 1
                      quarantinedBytes += result.bytes
                      quarantinedFiles += result.files
                      quarantinedDirectories += result.directories
                  } else {
                      failures += 1
                  }
                  details.put(
                      result.json()
                          .put("candidateId", candidate.id)
                          .put("path", candidate.path)
                          .put("action", if (result.success) "quarantined" else "failed")
                  )
              }
              snapshots.remove(snapshotId)
              val wasCancelled = cancelled.get()
              val timedOut = SystemClock.elapsedRealtime() >= deadline
              progress(Progress(if (wasCancelled) "隔离已停止" else "隔离完成", selected.size, selected.size, bytes = quarantinedBytes, files = quarantinedFiles, failures = failures))
              return JSONObject()
                  .put("success", true)
                  .put("profile", snapshot.profile)
                  .put("selected", selected.size)
                  .put("quarantinedCandidates", quarantined)
                  .put("quarantinedBytes", quarantinedBytes)
                  .put("quarantinedFiles", quarantinedFiles)
                  .put("quarantinedDirectories", quarantinedDirectories)
                  .put("failures", failures)
                  .put("cancelled", wasCancelled)
                  .put("timedOut", timedOut)
                  .put("elapsedMs", SystemClock.elapsedRealtime() - started)
                  .put("message", "已隔离 $quarantined 个高风险项目，可在隔离区恢复")
                  .put("details", details)
                  .toString()
          }

          '''
          engine = replace_once(engine, marker, quarantine_method + marker, 'quarantine method insertion')
          engine = replace_once(
              engine,
              '".git", ".ssh", ".termux", ".config", ".local", ".obsidian", ".android", ".vscode", ".gnupg"',
              '".git", ".ssh", ".termux", ".config", ".local", ".obsidian", ".android", ".vscode", ".gnupg", ".baize-quarantine"',
              'quarantine scan protection',
          )
          engine_path.write_text(engine)

          workbench_path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/ScanWorkbenchActivity.kt')
          workbench = workbench_path.read_text()
          workbench = replace_once(workbench, 'import androidx.compose.material.icons.rounded.Folder\n', 'import androidx.compose.material.icons.rounded.Folder\nimport androidx.compose.material.icons.rounded.Inventory2\n', 'workbench icon import')
          workbench = replace_once(
              workbench,
              '''                            onClear = ::clearSelection,
                              onProtect = ::protectItem''',
              '''                            onClear = ::clearSelection,
                              onProtect = ::protectItem,
                              onQuarantine = ::quarantineItem''',
              'workbench actions binding',
          )
          workbench = replace_once(
              workbench,
              '''                            onToggle = { actions.onToggleItem(row.item.id) },
                                  onProtect = { actions.onProtect(row.item) }
                              )''',
              '''                            onToggle = { actions.onToggleItem(row.item.id) },
                                  onProtect = { actions.onProtect(row.item) },
                                  onQuarantine = { actions.onQuarantine(row.item) }
                              )''',
              'candidate action wiring',
          )
          quarantine_ui_method = '''    private fun quarantineItem(item: WorkbenchItem) {
              if (screenState.running || item.source != "profile" || item.risk != "high") return
              if (!screenState.scanReady || SystemClock.elapsedRealtime() >= snapshotExpiresAtRealtime) {
                  screenState = screenState.copy(scanReady = false, phase = "扫描快照已过期，请重新扫描")
                  return
              }
              val service = profileService ?: return
              screenState = screenState.copy(
                  running = true,
                  phase = "正在把 ${item.title} 移入隔离区…",
                  currentPath = item.path
              )
              startPolling()
              lifecycleScope.launch {
                  val result = runCatching {
                      withContext(Dispatchers.IO) {
                          val selection = JSONObject().put(item.id.removePrefix("profile:"), true)
                          JSONObject(service.quarantineProfileSelected(profileSnapshotId, selection.toString(), optionsJson(service)))
                      }
                  }
                  pollJob?.cancel()
                  result.onSuccess { json ->
                      if (json.optBoolean("success") && json.optInt("quarantinedCandidates") > 0) {
                          cacheSnapshotId = ""
                          profileSnapshotId = ""
                          snapshotExpiresAtRealtime = 0L
                          screenState = screenState.copy(
                              running = false,
                              scanReady = false,
                              items = emptyList(),
                              selectedIds = emptySet(),
                              phase = json.optString("message", "高风险项目已移入隔离区"),
                              resultText = "已隔离 ${json.optInt("quarantinedCandidates")} 项 · ${formatBytes(json.optLong("quarantinedBytes"))}"
                          )
                          Toast.makeText(this@ScanWorkbenchActivity, "已移入隔离区，可随时恢复", Toast.LENGTH_SHORT).show()
                          delay(180L)
                          runScan()
                      } else {
                          screenState = screenState.copy(
                              running = false,
                              phase = json.optString("message", json.optString("error", "隔离失败"))
                          )
                      }
                  }.onFailure {
                      screenState = screenState.copy(running = false, phase = "隔离失败：${it.message ?: it.javaClass.simpleName}")
                  }
              }
          }

          '''
          workbench = replace_once(workbench, '    private fun protectItem(item: WorkbenchItem) {\n', quarantine_ui_method + '    private fun protectItem(item: WorkbenchItem) {\n', 'workbench quarantine method')
          workbench = replace_once(
              workbench,
              '''    onToggle: () -> Unit,
              onProtect: () -> Unit
          ) {''',
              '''    onToggle: () -> Unit,
              onProtect: () -> Unit,
              onQuarantine: () -> Unit
          ) {''',
              'candidate signature',
          )
          workbench = replace_once(
              workbench,
              '''        IconButton(onClick = onProtect, modifier = Modifier.size(38.dp)) {
                  Icon(Icons.Rounded.Shield, contentDescription = "加入白名单", modifier = Modifier.size(19.dp), tint = MaterialTheme.colorScheme.primary)
              }''',
              '''        if (item.risk == "high") {
                  IconButton(onClick = onQuarantine, modifier = Modifier.size(38.dp)) {
                      Icon(Icons.Rounded.Inventory2, contentDescription = "移入隔离区", modifier = Modifier.size(19.dp), tint = MaterialTheme.colorScheme.error)
                  }
              } else {
                  IconButton(onClick = onProtect, modifier = Modifier.size(38.dp)) {
                      Icon(Icons.Rounded.Shield, contentDescription = "加入白名单", modifier = Modifier.size(19.dp), tint = MaterialTheme.colorScheme.primary)
                  }
              }''',
              'candidate action button',
          )
          workbench = replace_once(
              workbench,
              '''    val onSelectAll: () -> Unit,
              val onClear: () -> Unit,
              val onProtect: (WorkbenchItem) -> Unit
          )''',
              '''    val onSelectAll: () -> Unit,
              val onClear: () -> Unit,
              val onProtect: (WorkbenchItem) -> Unit,
              val onQuarantine: (WorkbenchItem) -> Unit
          )''',
              'workbench action model',
          )
          workbench = replace_once(workbench, '"high" -> "$label · 默认只审计，不自动勾选"', '"high" -> "$label · 不会直接删除，可单独移入隔离区"', 'risk explanation')
          workbench_path.write_text(workbench)

          center_path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt')
          center = center_path.read_text()
          center = replace_once(center, 'import androidx.compose.material.icons.rounded.FolderOff\n', 'import androidx.compose.material.icons.rounded.FolderOff\nimport androidx.compose.material.icons.rounded.Inventory2\n', 'clean center icon')
          center = replace_once(
              center,
              '''                            onOpenCache = { startActivity(Intent(this, CacheActivity::class.java)) },
                              onOpenProfile = ::openProfile''',
              '''                            onOpenCache = { startActivity(Intent(this, CacheActivity::class.java)) },
                              onOpenQuarantine = { startActivity(Intent(this, QuarantineActivity::class.java)) },
                              onOpenProfile = ::openProfile''',
              'clean center action binding',
          )
          center = replace_once(
              center,
              '''    val onQuickClean: () -> Unit,
              val onOpenCache: () -> Unit,
              val onOpenProfile: (String) -> Unit''',
              '''    val onQuickClean: () -> Unit,
              val onOpenCache: () -> Unit,
              val onOpenQuarantine: () -> Unit,
              val onOpenProfile: (String) -> Unit''',
              'clean center action model',
          )
          center = replace_once(
              center,
              '''    val advanced = listOf(
                  CleanCenterItem(Icons.Rounded.DeleteForever, "卸载残留",''',
              '''    val advanced = listOf(
                  CleanCenterItem(Icons.Rounded.Inventory2, "隔离区", "恢复或永久删除已隔离的高风险内容", "可撤销", directAction = actions.onOpenQuarantine),
                  CleanCenterItem(Icons.Rounded.DeleteForever, "卸载残留",''',
              'material quarantine entry',
          )
          center = replace_once(
              center,
              '''    val advanced = listOf(
                  CleanCenterItem(Icons.Rounded.DeleteForever, "卸载残留", "核对无主应用目录",''',
              '''    val advanced = listOf(
                  CleanCenterItem(Icons.Rounded.Inventory2, "隔离区", "恢复或永久删除高风险内容", "可撤销", directAction = actions.onOpenQuarantine),
                  CleanCenterItem(Icons.Rounded.DeleteForever, "卸载残留", "核对无主应用目录",''',
              'miuix quarantine entry',
          )
          center_path.write_text(center)

          manifest_path = Path('v2/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          manifest = replace_once(
              manifest,
              '        <activity android:name=".CleanCenterActivity" android:exported="false" />\n',
              '        <activity android:name=".CleanCenterActivity" android:exported="false" />\n        <activity android:name=".QuarantineActivity" android:exported="false" />\n',
              'quarantine manifest entry',
          )
          manifest_path.write_text(manifest)
          PY
          git diff --check
          git diff --stat
      - name: Commit quarantine integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/ScanWorkbenchActivity.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt \
                  v2/app/src/main/AndroidManifest.xml
          git commit -m 'feat: integrate quarantine workbench and restore center'
          git push origin HEAD:agent/quarantine-undo
