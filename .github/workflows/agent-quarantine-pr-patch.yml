name: Agent Quarantine PR Patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quarantine-undo
          fetch-depth: 0
      - name: Extract and apply quarantine integration
        shell: bash
        run: |
          awk '
            /python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/agent-quarantine-patch.yml > /tmp/quarantine-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/quarantine-patch.py')
          lines = path.read_text().splitlines()
          exact = {
              "onProtect = ::protectItem''',": 28,
              "onProtect = ::protectItem,": 28,
              "onQuarantine = ::quarantineItem''',": 28,
              "onProtect = { actions.onProtect(row.item) }": 28,
              "onProtect = { actions.onProtect(row.item) },": 28,
              "onQuarantine = { actions.onQuarantine(row.item) }": 28,
              ")''',": 24,
              "onOpenProfile = ::openProfile''',": 28,
              "onOpenQuarantine = { startActivity(Intent(this, QuarantineActivity::class.java)) },": 28,
          }
          output = []
          in_action_button = False
          for line in lines:
              stripped = line.lstrip(' ')
              indent = len(line) - len(stripped)
              if stripped.startswith("'''        IconButton(onClick = onProtect"):
                  in_action_button = True
              if stripped.startswith("'" * 3 + '        if (item.risk == "high")'):
                  in_action_button = True
              if stripped in exact and indent in {20, 24}:
                  line = ' ' * exact[stripped] + stripped
              elif in_action_button and stripped.startswith('Icon('):
                  line = ' ' * (12 if indent == 8 else 16) + stripped
              elif in_action_button and stripped == 'IconButton(onClick = onQuarantine, modifier = Modifier.size(38.dp)) {':
                  line = ' ' * 12 + stripped
              elif in_action_button and stripped == 'IconButton(onClick = onProtect, modifier = Modifier.size(38.dp)) {':
                  line = ' ' * 12 + stripped
              elif in_action_button and stripped == '} else {':
                  line = ' ' * 8 + stripped
              elif in_action_button and stripped == '}':
                  line = ' ' * 12 + stripped
              elif in_action_button and stripped == "}''',":
                  line = ' ' * 8 + stripped
                  in_action_button = False
              output.append(line)
          path.write_text('\n'.join(output) + '\n')
          PY
          set +e
          python3 /tmp/quarantine-patch.py > /tmp/quarantine-patch.log 2>&1
          code=$?
          cat /tmp/quarantine-patch.log
          [ "$code" -eq 0 ] || exit "$code"
          git diff --check
          git diff --stat
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-patch-diagnostics
          path: |
            /tmp/quarantine-patch.log
            /tmp/quarantine-patch.py
          if-no-files-found: warn
      - name: Commit quarantine integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/ScanWorkbenchActivity.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt \
                  v2/app/src/main/AndroidManifest.xml
          git commit -m 'feat: integrate quarantine workbench and restore center'
          git push origin HEAD:agent/quarantine-undo
