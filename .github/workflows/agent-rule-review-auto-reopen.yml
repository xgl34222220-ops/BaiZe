name: Agent Rule Review Auto Reopen Integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rule-review-auto-reopen
          fetch-depth: 0
      - name: Integrate rule review auto reopen
        run: python3 .github/scripts/rule_review_auto_reopen_patch.py
      - name: Verify integration markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ruleQualityReviewRepository.reconcile' v2/app/src/main/java/io/github/xgl34222220/baize/root/AuditRepository.kt
          grep -Fq '审核已自动重新打开' v2/app/src/main/java/io/github/xgl34222220/baize/RuleQualityActivity.kt
          grep -Fq 'test-rule-review-auto-reopen-contract.sh' .github/workflows/v2.5-concurrent-scheduler-ci.yml
      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/AuditRepository.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/RuleQualityActivity.kt \
                  v2/tests/test-rule-review-closed-loop-contract.sh \
                  .github/workflows/v2.5-concurrent-scheduler-ci.yml
          if git diff --cached --quiet; then
            echo 'integration already present'
            exit 0
          fi
          git commit -m 'feat: integrate rule review auto reopen'
          git pull --rebase origin agent/rule-review-auto-reopen
          git push origin HEAD:agent/rule-review-auto-reopen
