name: Agent Rule Review Closed Loop Integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rule-review-closed-loop
          fetch-depth: 0
      - name: Integrate rule review closed loop
        run: python3 .github/scripts/rule_review_closed_loop_patch.py
      - name: Verify integration markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'updateRuleQualityReviewJson' v2/app/src/main/java/io/github/xgl34222220/baize/root/AuditRepository.kt
          grep -Fq 'override fun updateRuleQualityReview' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -Fq 'test-rule-review-closed-loop-contract.sh' .github/workflows/v2.5-concurrent-scheduler-ci.yml
      - name: Commit product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/root/AuditRepository.kt \
                  .github/workflows/v2.5-concurrent-scheduler-ci.yml
          git commit -m 'feat: integrate rule review closed loop'
          git push origin HEAD:agent/rule-review-closed-loop
