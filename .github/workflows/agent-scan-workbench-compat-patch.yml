name: Agent Scan Workbench Compat Patch

on:
  push:
    branches: [agent/scan-result-workbench]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'support app labels on Android 8')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scan-result-workbench
          fetch-depth: 0
      - name: Apply API 26 package manager compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/ScanWorkbenchActivity.kt')
          text = path.read_text()
          text = text.replace(
              'import android.os.Bundle\n',
              'import android.os.Build\nimport android.os.Bundle\n',
              1,
          )
          old = '''    private fun applicationLabel(packageName: String): String = runCatching {
                  val info = packageManager.getApplicationInfo(packageName, PackageManagerFlags.applicationInfo())
                  packageManager.getApplicationLabel(info).toString().takeIf { it.isNotBlank() }
              }.getOrNull() ?: packageName.substringAfterLast('.').replaceFirstChar { it.uppercase() }
          
              private fun stableId'''
          new = '''    private fun applicationLabel(packageName: String): String = runCatching {
                  val info = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      packageManager.getApplicationInfo(
                          packageName,
                          android.content.pm.PackageManager.ApplicationInfoFlags.of(0)
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      packageManager.getApplicationInfo(packageName, 0)
                  }
                  packageManager.getApplicationLabel(info).toString().takeIf { it.isNotBlank() }
              }.getOrNull() ?: packageName.substringAfterLast('.').replaceFirstChar { it.uppercase() }
          
              private fun stableId'''
          if old not in text:
              raise SystemExit('applicationLabel block not found')
          text = text.replace(old, new, 1)
          old_object = '''
          private object PackageManagerFlags {
              fun applicationInfo(): android.content.pm.PackageManager.ApplicationInfoFlags =
                  android.content.pm.PackageManager.ApplicationInfoFlags.of(0)
          }
          
          private data class CleanAggregate'''
          if old_object not in text:
              raise SystemExit('PackageManagerFlags block not found')
          text = text.replace(old_object, '\nprivate data class CleanAggregate', 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- v2/app/src/main/java/io/github/xgl34222220/baize/ScanWorkbenchActivity.kt
      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/app/src/main/java/io/github/xgl34222220/baize/ScanWorkbenchActivity.kt
          git commit -m 'fix: support app labels on Android 8'
          git push origin HEAD:agent/scan-result-workbench
