name: Alpha 8 source patch and build

on:
  push:
    branches: [v2-alpha8]
    paths:
      - '.github/workflows/alpha8-source-patch.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 8
        uses: actions/checkout@v4
        with:
          ref: v2-alpha8
          fetch-depth: 0

      - name: Apply Alpha 8 product fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=-1):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              file.write_text(text)

          dashboard = 'v2/app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt'
          replace(dashboard, 'binding.versionText.text = "Alpha 6"', 'binding.versionText.text = "Alpha 8"')
          replace(
              dashboard,
              '''        binding.fragmentDaysSlider.addOnChangeListener { _, value, _ ->
              binding.fragmentDaysText.text = "碎片至少保留 ${value.toInt()} 天"
          }''',
              '''        binding.fragmentDaysSlider.addOnChangeListener { _, value, _ ->
              binding.fragmentDaysText.text = fragmentRetentionLabel(value.toInt())
          }'''
          )
          replace(dashboard, 'json.optInt("fragment_days", 7).coerceIn(1, 30).toFloat()', 'json.optInt("fragment_days", 7).coerceIn(0, 30).toFloat()')
          replace(
              dashboard,
              'binding.fragmentDaysText.text = "碎片至少保留 ${binding.fragmentDaysSlider.value.toInt()} 天"',
              'binding.fragmentDaysText.text = fragmentRetentionLabel(binding.fragmentDaysSlider.value.toInt())'
          )
          replace(
              dashboard,
              'binding.lastFreedText.text = if (bytes > 0L) "最近释放 ${Formatter.formatFileSize(this, bytes)}" else "最近释放 --"',
              'binding.lastFreedText.text = if (bytes > 0L) Formatter.formatFileSize(this, bytes) else "--"'
          )
          replace(
              dashboard,
              '        preferences.edit().putString("last_report_text", summary).apply()',
              '''        val latestBytes = json.optJSONObject("latest")?.optLong("bytes", 0L) ?: 0L
          preferences.edit().apply {
              putString("last_report_text", summary)
              if (latestBytes > 0L) putLong("last_clean_bytes", latestBytes)
          }.apply()
          if (latestBytes > 0L) binding.lastFreedText.text = Formatter.formatFileSize(this, latestBytes)'''
          )
          replace(
              dashboard,
              '''            val json = runCatching { JSONObject(raw) }.getOrNull() ?: return@launch
              val scheduler = json.optJSONObject("scheduler") ?: JSONObject()''',
              '''            val json = runCatching { JSONObject(raw) }.getOrNull() ?: return@launch
              val latestBytes = json.optJSONObject("latest")?.optLong("bytes", 0L) ?: 0L
              if (latestBytes > 0L) {
                  preferences.edit().putLong("last_clean_bytes", latestBytes).apply()
                  binding.lastFreedText.text = Formatter.formatFileSize(this@DashboardActivity, latestBytes)
              }
              val scheduler = json.optJSONObject("scheduler") ?: JSONObject()'''
          )
          replace(
              dashboard,
              '    private fun flag(value: Boolean): Int = if (value) 1 else 0',
              '''    private fun fragmentRetentionLabel(days: Int): String =
          if (days <= 0) "碎片立即清理" else "碎片保留 $days 天"

          private fun flag(value: Boolean): Int = if (value) 1 else 0'''
          )

          root_service = 'v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt'
          replace(root_service, 'module-auto-cleaner-v6+native-audit', 'module-auto-cleaner-v8+native-audit')
          replace(
              root_service,
              '''        val totals = readEnv(File(stateDir, "totals.env"))
          val latestReport = File(stateDir, "reports/latest.tsv")''',
              '''        val totals = readEnv(File(stateDir, "totals.env"))
          val latest = readEnv(File(stateDir, "latest.env"))
          val latestReport = File(stateDir, "reports/latest.tsv")'''
          )
          replace(root_service, '.put("totals", totals)\n            .put("latestReport"', '.put("totals", totals)\n            .put("latest", latest)\n            .put("latestReport"')
          replace(
              root_service,
              '''        val totals = readEnv(File(stateDir, "totals.env"))
          val running = readEnv(File(stateDir, "running.env"))''',
              '''        val totals = readEnv(File(stateDir, "totals.env"))
          val latest = readEnv(File(stateDir, "latest.env"))
          val running = readEnv(File(stateDir, "running.env"))'''
          )
          replace(root_service, '.put("totals", totals)\n            .put("running", running)', '.put("totals", totals)\n            .put("latest", latest)\n            .put("running", running)')
          replace(root_service, '"fragment_days" to 1..365', '"fragment_days" to 0..365')

          cleaner = Path('cleaner.sh')
          text = cleaner.read_text()
          text = text.replace('FRAGMENT_DAYS=$(get_uint fragment_days 7 1 365)', 'FRAGMENT_DAYS=$(get_uint fragment_days 7 0 365)\nif [ "$FRAGMENT_DAYS" -eq 0 ]; then FRAGMENT_POLICY="立即清理"; else FRAGMENT_POLICY="保留 ${FRAGMENT_DAYS} 天"; fi')
          text = text.replace('保留 ${FRAGMENT_DAYS} 天', '${FRAGMENT_POLICY}')

          old_public = '''    # 非媒体公共区域：日志、崩溃转储与临时文件，至少保留指定天数。
          find "$userdir" -mindepth 1 -maxdepth 4 \\
            \\( -path "$userdir/Android" -o -path "$userdir/DCIM" -o -path "$userdir/Pictures" \\
               -o -path "$userdir/Movies" -o -path "$userdir/Music" -o -path "$userdir/Documents" \\
               -o -path "$userdir/Download" -o -path "$userdir/Podcasts" -o -path "$userdir/Audiobooks" \\
               -o -path "$userdir/Recordings" -o -path "$userdir/Fonts" -o -path "$userdir/Ringtones" \\
               -o -path "$userdir/Alarms" -o -path "$userdir/Notifications" \\) -prune -o \\
            -type f -size "-${MAX_FILE_BYTES}c" -mtime "+$FRAGMENT_DAYS" \\
            \\( -iname '*.tmp' -o -iname '*.temp' -o -iname '*.tmf' \\
               -o -iname '*.log' -o -iname '*.xlog' -o -iname '*.tlog' -o -iname '*.ulog' -o -iname '*.plog' \\
               -o -iname '*.hprof' -o -iname '*.dmp' -o -iname '*.dump' -o -iname '*.trace' \\
               -o -iname '*.traces' -o -iname '*.stacktrace' -o -iname 'hs_err_pid*.log' \\) \\
            -print0 2>/dev/null >>"$list"
          '''
          new_public = '''    # 非媒体公共区域：日志、崩溃转储与临时文件。0 天表示不增加时间门槛。
          if [ "$FRAGMENT_DAYS" -eq 0 ]; then
            find "$userdir" -mindepth 1 -maxdepth 4 \\
              \\( -path "$userdir/Android" -o -path "$userdir/DCIM" -o -path "$userdir/Pictures" \\
                 -o -path "$userdir/Movies" -o -path "$userdir/Music" -o -path "$userdir/Documents" \\
                 -o -path "$userdir/Download" -o -path "$userdir/Podcasts" -o -path "$userdir/Audiobooks" \\
                 -o -path "$userdir/Recordings" -o -path "$userdir/Fonts" -o -path "$userdir/Ringtones" \\
                 -o -path "$userdir/Alarms" -o -path "$userdir/Notifications" \\) -prune -o \\
              -type f -size "-${MAX_FILE_BYTES}c" \\
              \\( -iname '*.tmp' -o -iname '*.temp' -o -iname '*.tmf' \\
                 -o -iname '*.log' -o -iname '*.xlog' -o -iname '*.tlog' -o -iname '*.ulog' -o -iname '*.plog' \\
                 -o -iname '*.hprof' -o -iname '*.dmp' -o -iname '*.dump' -o -iname '*.trace' \\
                 -o -iname '*.traces' -o -iname '*.stacktrace' -o -iname 'hs_err_pid*.log' \\) \\
              -print0 2>/dev/null >>"$list"
          else
            find "$userdir" -mindepth 1 -maxdepth 4 \\
              \\( -path "$userdir/Android" -o -path "$userdir/DCIM" -o -path "$userdir/Pictures" \\
                 -o -path "$userdir/Movies" -o -path "$userdir/Music" -o -path "$userdir/Documents" \\
                 -o -path "$userdir/Download" -o -path "$userdir/Podcasts" -o -path "$userdir/Audiobooks" \\
                 -o -path "$userdir/Recordings" -o -path "$userdir/Fonts" -o -path "$userdir/Ringtones" \\
                 -o -path "$userdir/Alarms" -o -path "$userdir/Notifications" \\) -prune -o \\
              -type f -size "-${MAX_FILE_BYTES}c" -mtime "+$FRAGMENT_DAYS" \\
              \\( -iname '*.tmp' -o -iname '*.temp' -o -iname '*.tmf' \\
                 -o -iname '*.log' -o -iname '*.xlog' -o -iname '*.tlog' -o -iname '*.ulog' -o -iname '*.plog' \\
                 -o -iname '*.hprof' -o -iname '*.dmp' -o -iname '*.dump' -o -iname '*.trace' \\
                 -o -iname '*.traces' -o -iname '*.stacktrace' -o -iname 'hs_err_pid*.log' \\) \\
              -print0 2>/dev/null >>"$list"
          fi
          '''
          if old_public not in text:
              raise SystemExit('fragment public-area find block not found')
          text = text.replace(old_public, new_public)

          old_download = '''    # 下载目录只匹配明确的中断下载后缀，避免把普通日志或用户临时文档误删。
          if [ -d "$userdir/Download" ]; then
            find "$userdir/Download" -mindepth 1 -maxdepth 4 -type f \\
              -size "-${MAX_FILE_BYTES}c" -mtime "+$FRAGMENT_DAYS" \\
              \\( -iname '*.part' -o -iname '*.partial' -o -iname '*.crdownload' \\
                 -o -iname '*.filepart' -o -iname '*.download' -o -iname '*.opdownload' \\) \\
              -print0 2>/dev/null >>"$list"
          fi
          '''
          new_download = '''    # 下载目录只匹配明确的中断下载后缀，避免把普通日志或用户临时文档误删。
          if [ -d "$userdir/Download" ]; then
            if [ "$FRAGMENT_DAYS" -eq 0 ]; then
              find "$userdir/Download" -mindepth 1 -maxdepth 4 -type f \\
                -size "-${MAX_FILE_BYTES}c" \\
                \\( -iname '*.part' -o -iname '*.partial' -o -iname '*.crdownload' \\
                   -o -iname '*.filepart' -o -iname '*.download' -o -iname '*.opdownload' \\) \\
                -print0 2>/dev/null >>"$list"
            else
              find "$userdir/Download" -mindepth 1 -maxdepth 4 -type f \\
                -size "-${MAX_FILE_BYTES}c" -mtime "+$FRAGMENT_DAYS" \\
                \\( -iname '*.part' -o -iname '*.partial' -o -iname '*.crdownload' \\
                   -o -iname '*.filepart' -o -iname '*.download' -o -iname '*.opdownload' \\) \\
                -print0 2>/dev/null >>"$list"
            fi
          fi
          '''
          if old_download not in text:
              raise SystemExit('fragment download find block not found')
          text = text.replace(old_download, new_download)
          cleaner.write_text(text)

          replace('v2/app/build.gradle.kts', 'versionCode = 20007', 'versionCode = 20008')
          replace('v2/app/build.gradle.kts', 'versionName = "2.0.0-alpha07"', 'versionName = "2.0.0-alpha08"')
          replace('v2/module/module.prop', 'version=v2.0.0-alpha07', 'version=v2.0.0-alpha08')
          replace('v2/module/module.prop', 'versionCode=20007', 'versionCode=20008')
          replace('v2/module/module.prop', '白泽 v2 Alpha 7', '白泽 v2 Alpha 8')
          replace('v2/module/customize.sh', '白泽 v2 Alpha 6', '白泽 v2 Alpha 8')
          replace('v2/module/service.sh', 'module_version=2.0.0-alpha06', 'module_version=2.0.0-alpha08')
          replace('v2/scripts/package-module.sh', 'BaiZe-v2-Alpha7-Module.zip', 'BaiZe-v2-Alpha8-Module.zip')

          workflow = Path('.github/workflows/v2-alpha.yml')
          w = workflow.read_text()
          w = w.replace('branches: [v2-alpha7]', 'branches: [v2-alpha8]')
          w = w.replace('build-alpha7.log', 'build-alpha8.log')
          w = w.replace('BaiZe-v2-Alpha7-Module.zip', 'BaiZe-v2-Alpha8-Module.zip')
          w = w.replace('BaiZe-v2-Alpha7', 'BaiZe-v2-Alpha8')
          workflow.write_text(w)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Alpha 8 App
        working-directory: v2
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-alpha8.log

      - name: Package Alpha 8 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify theme engine, cleaner, scheduler and rules
        working-directory: v2
        run: |
          ZIP=dist/BaiZe-v2-Alpha8-Module.zip
          unzip -tq "$ZIP"
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'
          grep -q 'Theme.BaiZe.Monet' app/src/main/res/values/themes.xml
          grep -q 'Monet 动态取色' app/src/main/java/io/github/xgl34222220/baize/ThemeManager.kt
          grep -q 'fragment_days" to 0..365' app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q 'FRAGMENT_DAYS.*0 365' ../cleaner.sh
          test "$(unzip -p "$ZIP" config/deep.rules | sha256sum | awk '{print $1}')" = '73d4c898630a292753adca33298c8aabbf6146debf414b2cabbe6b87d1d5c31c'

      - name: Commit verified Alpha 8 sources
        run: |
          rm -f .github/workflows/alpha8-source-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Alpha 8 premium themed UI and cleaning policies'
          git push origin HEAD:v2-alpha8

      - name: Upload Alpha 8 integrated module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha8
          path: |
            v2/build-alpha8.log
            v2/dist/BaiZe-v2-Alpha8-Module.zip
