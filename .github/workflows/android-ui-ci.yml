name: BaiZe Android UI CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/app/**'
      - 'v2/third_party/libsu-service/**'
      - 'v2/macrobenchmark/**'
      - 'v2/build.gradle.kts'
      - 'v2/gradle.properties'
      - 'v2/tests/**'
      - '.github/workflows/android-ui-ci.yml'

permissions:
  contents: read

concurrency:
  group: baize-android-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach matching UI review sources
        uses: actions/upload-artifact@v4
        with:
          name: baize-ui-review-sources
          retention-days: 3
          path: |
            v2/app/src/main/java/
            v2/app/src/testDebug/
            v2/app/src/test/
            v2/app/src/main/res/values/
            v2/app/src/main/AndroidManifest.xml
            v2/app/build.gradle.kts
            v2/build.gradle.kts
            v2/settings.gradle.kts
            v2/gradle.properties
          if-no-files-found: error
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      # AGP resolves the compile SDK, as in LuoShu's proven Android UI smoke workflow.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify scheduler and audit contracts
        run: |
          bash v2/tests/test-audit-center-contract.sh
          bash v2/tests/test-schedule-modes-contract.sh
      - name: Compile and lint UI
        working-directory: v2
        shell: bash
        run: |
          set +e
          gradle --no-daemon --continue :app:testDebugUnitTest :app:compileDebugKotlin :app:lintDebug :macrobenchmark:assemble > /tmp/baize-android-ui.log 2>&1
          code=$?
          tail -n 200 /tmp/baize-android-ui.log
          exit "$code"
      - name: Upload actual UI renderings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baize-ui-visual-review
          path: v2/app/build/reports/ui-screenshots/*.png
          if-no-files-found: warn
      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-diagnostics
          path: |
            /tmp/baize-android-ui.log
            v2/app/build/reports/lint-results-debug.html
            v2/app/build/reports/lint-results-debug.txt
            v2/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
