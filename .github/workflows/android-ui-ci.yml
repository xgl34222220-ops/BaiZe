name: BaiZe Android UI CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/app/**'
      - 'v2/macrobenchmark/**'
      - 'v2/build.gradle.kts'
      - 'v2/gradle.properties'
      - '.github/workflows/android-ui-ci.yml'

permissions:
  contents: read

concurrency:
  group: baize-android-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Compile and lint UI
        working-directory: v2
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:compileDebugKotlin :app:lintDebug :macrobenchmark:assemble > /tmp/baize-android-ui.log 2>&1
          code=$?
          tail -n 240 /tmp/baize-android-ui.log
          exit "$code"

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-diagnostics
          path: |
            /tmp/baize-android-ui.log
            v2/app/build/reports/lint-results-debug.html
            v2/app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
