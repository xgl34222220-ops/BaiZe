name: BaiZe APK Permission Diagnostic
on:
  push:
    branches: [codex/baize-safety-scan-20260930]
permissions:
  contents: read
jobs:
  inspect-api36:
    if: contains(github.event.head_commit.message, '[apk-permission-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile production code and debug-only isolated probes
        working-directory: v2
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Enable the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe indexed deletion results and Root persisted plans
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/probe-indexed-outcomes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaiZe-APK-Permission-Diagnostic
          path: |
            ${{ runner.temp }}/baize-apk-permission-probe/
            ${{ runner.temp }}/baize-apk-deletion-probe/
            ${{ runner.temp }}/baize-storage-deletion-probe/
            ${{ runner.temp }}/baize-root-cache-probe/
            ${{ runner.temp }}/baize-indexed-repeated/
          retention-days: 7
