name: Apply Exact Scheduler And Liquid UI

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign

permissions:
  contents: write

concurrency:
  group: apply-exact-scheduler-liquid-ui
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dual-theme-ui-redesign
          fetch-depth: 0

      - name: Apply product fix
        run: python3 .github/scripts/apply-exact-scheduler-liquid-ui.py

      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sh -n service.sh
          busybox ash -n service.sh || true
          grep -q 'BAIZE_MIN_SLEEP_SECONDS:-1' service.sh
          grep -q 'BAIZE_CONDITION_RETRY_SECONDS:-5' service.sh
          grep -q 'delay(1_000L)' v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/HomeTaskPresentation.kt
          grep -q 'miuixLiquidIndicator' v2/app/src/main/java/io/github/xgl34222220/baize/ui/miuix/MiuixLiquidComponents.kt
          grep -q 'blurRadius = 28.dp' v2/app/src/main/java/io/github/xgl34222220/baize/ui/miuix/MiuixLiquidComponents.kt
          grep -q 'shadow(if (floating) 18.dp' v2/app/src/main/java/io/github/xgl34222220/baize/ui/miuix/MiuixLiquidComponents.kt
          grep -q 'fontSize = 19.sp' v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt
          bash v2/tests/test-scheduler-fairness.sh

      - name: Commit product changes and remove temporary files
        run: |
          rm -f .github/scripts/apply-exact-scheduler-liquid-ui.py
          rm -f .github/workflows/apply-exact-scheduler-liquid-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): exact scheduling and restore liquid dock'
          git push origin HEAD:agent/dual-theme-ui-redesign
