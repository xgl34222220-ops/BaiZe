name: Apply explicit schedule modes

on:
  push:
    branches: [agent/explicit-schedule-modes]
    paths:
      - 'v2/patches/schedule-mode-*.patch'
      - '.github/workflows/apply-explicit-schedule-modes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/patches/schedule-mode-*.patch'
      - '.github/workflows/apply-explicit-schedule-modes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/explicit-schedule-modes
          fetch-depth: 1
          show-progress: false
      - name: Apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in v2/patches/schedule-mode-*.patch; do
            echo "checking $patch"
            git apply --recount --check "$patch"
          done
          for patch in v2/patches/schedule-mode-*.patch; do
            echo "applying $patch"
            git apply --recount "$patch"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/v2.5-concurrent-scheduler-ci.yml \
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/root/SchedulerRepository.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt \
            v2/module/autopilot-controller.sh \
            v2/module/scheduler-v2.5.sh
          git commit -m 'feat: add explicit schedule modes'
          git push origin HEAD:agent/explicit-schedule-modes
