name: Apply legacy schedule mode recursion fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-schedule-mode-recursion-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fix recursion and verify legacy config
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch agent/bugfix-scheduler-hardening \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          scheduler = "v2/module/scheduler-v2.5.sh"
          replace_once(
              scheduler,
              '      if [ "$(daily_mode_enabled)" = 1 ]; then echo 2',
              '      if [ "$(bool_value daily_schedule_enabled)" = 1 ]; then echo 2',
          )

          contract = "v2/tests/test-schedule-modes-contract.sh"
          replace_once(
              contract,
              'cp "$AUTOPILOT" "$TMP/module/autopilot-controller.sh"',
              'cp "$AUTOPILOT" "$TMP/module/autopilot-controller.sh"\ncp "$SCHEDULER" "$TMP/module/scheduler.sh"',
          )
          replace_once(
              contract,
              'bash "$ROOT/v2/tests/test-scheduler-thermal-contract.sh"',
              '''legacy="$TMP/legacy-daily"
          mkdir -p "$legacy"
          cat >"$legacy/config.conf" <<'EOF_LEGACY'
          enabled=1
          autopilot_enabled=1
          daily_schedule_enabled=1
          schedule_cache_enabled=0
          schedule_empty_enabled=0
          schedule_rules_enabled=0
          schedule_fragment_enabled=0
          schedule_deep_enabled=0
          schedule_organize_enabled=0
          EOF_LEGACY
          BAIZE_SKIP_BOOT_WAIT=1 BAIZE_SCHEDULER_ONCE=1 \\
            BAIZE_MODULE_DIR="$TMP/module" BAIZE_STATE_DIR="$legacy" BAIZE_CONFIG_PATH="$legacy/config.conf" \\
            sh "$TMP/module/scheduler.sh"
          grep -q '^state=waiting$' "$legacy/scheduler.env"

          bash "$ROOT/v2/tests/test-scheduler-thermal-contract.sh"''',
          )
          PY
          sh -n v2/module/scheduler-v2.5.sh
          bash v2/tests/test-schedule-modes-contract.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/module/scheduler-v2.5.sh v2/tests/test-schedule-modes-contract.sh
          git commit -m 'fix: preserve legacy schedule mode fallback'
          git push origin HEAD:agent/bugfix-scheduler-hardening
