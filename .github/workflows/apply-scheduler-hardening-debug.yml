name: Apply scheduler hardening concise

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-scheduler-hardening-debug.yml'
      - '.github/workflows/apply-scheduler-hardening.yml'
      - 'v2/scripts/apply-scheduler-hardening.py'

permissions:
  contents: write

jobs:
  apply-concise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply focused scheduler fixes
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch agent/bugfix-scheduler-hardening \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 v2/scripts/apply-scheduler-hardening.py
          sh -n v2/module/scheduler-v2.5.sh
          bash v2/tests/test-schedule-modes-contract.sh
          bash v2/tests/test-scheduler-thermal-contract.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: harden scheduler defaults and thermal guards'
          git push origin HEAD:agent/bugfix-scheduler-hardening
