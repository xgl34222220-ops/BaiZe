name: Apply BaiZe v2.2.1 Hotfix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/v2.2.1-logs-icons'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.2.1-logs-icons
          fetch-depth: 0
      - name: Apply hotfix sources
        run: python3 tools/apply-v221-hotfix.py
      - name: Export modified sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v221-hotfix
          git diff --binary > /tmp/v221-hotfix/v2.2.1.patch
          for file in \
            v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/common/AppPackageIcon.kt \
            v2/app/build.gradle.kts v2/module/module.prop v2/module/customize.sh \
            v2/scripts/package-module.sh .github/workflows/v2.2.0-core-rework.yml \
            RELEASE_NOTES_V2.2.1.md; do
            mkdir -p "/tmp/v221-hotfix/$(dirname "$file")"
            cp "$file" "/tmp/v221-hotfix/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.1-generated-sources
          if-no-files-found: error
          path: /tmp/v221-hotfix
