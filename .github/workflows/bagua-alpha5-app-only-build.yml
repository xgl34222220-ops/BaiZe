name: Build BaGua Alpha 5.1 Root Fix

on:
  push:
    branches: [bagua-alpha5-app-only]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bagua-alpha51-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct, patch and expand BaGua source
        run: |
          set -e
          cat ci/bagua-src.b64.part* | tr -d '\n\r' | base64 -d > bagua-alpha5-source.zip
          echo "ef766b71e62939064643ae66f1b7beeca82cd83d072e6fbd41762425c0e1408e  bagua-alpha5-source.zip" | sha256sum -c -
          unzip -tq bagua-alpha5-source.zip
          unzip -q bagua-alpha5-source.zip -d work
          sed -i 's/fun setSkin(/fun applySkin(/; s/fun setThemeMode(/fun applyThemeMode(/; s/fun setAmoled(/fun applyAmoled(/; s/fun setMonet(/fun applyMonet(/' work/app/src/main/java/io/github/xgl34222220/bagua/BaguaController.kt
          sed -i 's/controller::setSkin/controller::applySkin/g; s/controller::setThemeMode/controller::applyThemeMode/g; s/controller::setAmoled/controller::applyAmoled/g; s/controller::setMonet/controller::applyMonet/g' work/app/src/main/java/io/github/xgl34222220/bagua/Screens.kt
          python3 ci/patch-bagua-alpha51.py work

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Root fix and App-only source
        run: |
          set -e
          cd work
          test ! -d module-src/webroot
          test ! -d module-src/webui
          test ! -d module-src/www
          grep -q 'accessIssue = "root_required"' app/src/main/java/io/github/xgl34222220/bagua/BaguaController.kt
          grep -q 'Shell.FLAG_MOUNT_MASTER' app/src/main/java/io/github/xgl34222220/bagua/BaguaController.kt
          grep -q '重新请求 Root 并检测' app/src/main/java/io/github/xgl34222220/bagua/Screens.kt
          grep -q 'versionName = "0.5.1-alpha.5.1"' app/build.gradle.kts
          for f in module-src/customize.sh module-src/post-fs-data.sh module-src/service.sh module-src/action.sh module-src/uninstall.sh module-src/scripts/*.sh; do
            bash -n "$f"
          done

      - name: Build native App
        id: app_build
        continue-on-error: true
        working-directory: work
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-alpha51.log

      - name: Print compiler diagnostics
        if: steps.app_build.outcome != 'success'
        working-directory: work
        run: |
          echo '===== COMPILER DIAGNOSTICS ====='
          grep -E '(^e: | error: |FAILURE:|What went wrong|Compilation error|Unresolved reference|Cannot infer|No parameter)' build-alpha51.log | tail -n 180 || tail -n 220 build-alpha51.log

      - name: Package integrated module
        if: steps.app_build.outcome == 'success'
        working-directory: work
        run: bash scripts/package-module.sh

      - name: Verify integrated artifacts
        if: steps.app_build.outcome == 'success'
        working-directory: work
        run: |
          set -e
          ZIP=dist/BaGua-v0.5.1-alpha.5.1-AppOnly-Module.zip
          APK=module-src/app/bagua.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          unzip -tq "$ZIP"
          unzip -l "$ZIP" | grep -q 'app/bagua.apk'
          unzip -l "$ZIP" | grep -q 'scripts/install-app.sh'
          unzip -l "$ZIP" | grep -q 'scripts/bagua.sh'
          ! unzip -l "$ZIP" | grep -Ei 'webroot|webui|/www/'
          unzip -p "$ZIP" module.prop | grep -q '^version=0.5.1-alpha.5.1$'
          unzip -p "$ZIP" module.prop | grep -q '^versionCode=106$'
          "$AAPT" dump badging "$APK" | grep -q "package: name='io.github.xgl34222220.bagua'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='106'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='0.5.1-alpha.5.1'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'八卦'"
          test -s dist/BaGua-v0.5.1-alpha.5.1-SHA256.txt

      - name: Split deliverables for reliable retrieval
        if: steps.app_build.outcome == 'success'
        working-directory: work
        run: |
          set -e
          mkdir -p split
          split -b 4M -d -a 2 dist/BaGua-v0.5.1-alpha.5.1-AppOnly-Module.zip split/module.part.
          test -f split/module.part.00
          test -f split/module.part.01
          test -f split/module.part.02
          test -f split/module.part.03
          test -f split/module.part.04
          cp dist/BaGua-v0.5.1-alpha.5.1-AppOnly-Source.zip split/
          cp dist/BaGua-v0.5.1-alpha.5.1-SHA256.txt split/

      - name: Upload module part 00
        if: steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-module-part-00
          path: work/split/module.part.00
          if-no-files-found: error

      - name: Upload module part 01
        if: steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-module-part-01
          path: work/split/module.part.01
          if-no-files-found: error

      - name: Upload module part 02
        if: steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-module-part-02
          path: work/split/module.part.02
          if-no-files-found: error

      - name: Upload module part 03
        if: steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-module-part-03
          path: work/split/module.part.03
          if-no-files-found: error

      - name: Upload module part 04
        if: steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-module-part-04
          path: work/split/module.part.04
          if-no-files-found: error

      - name: Upload source and checksums
        if: steps.app_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-metadata
          path: |
            work/split/BaGua-v0.5.1-alpha.5.1-AppOnly-Source.zip
            work/split/BaGua-v0.5.1-alpha.5.1-SHA256.txt
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaGua51-diagnostics
          path: work/build-alpha51.log
          if-no-files-found: warn

      - name: Fail when native App build failed
        if: steps.app_build.outcome != 'success'
        run: exit 1
