name: BaiZe 30021 Feature Device Validation

on:
  push:
    branches: [codex/baize-safety-scan-20260930]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: baize-30021-features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shizuku-shell-device:
    if: contains(github.event.head_commit.message, '[30021-features]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical application source
        run: |
          git diff --exit-code 8860bc4f0482030da022cc0d85a203a0836038b1 HEAD -- . \
            ':(exclude).github/**' ':(exclude)v2/app/src/test/**' ':(exclude)v2/app/src/testDebug/**'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: BaiZe-functional-test+8860bc4f-Paired-Test
          run-id: 37124986343
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact signed APK and prepare disposable packages
        run: |
          echo 'c29ca696bce4e5cc96f253359078d846c25d5535162b02b09430b627beb924ea  candidate/BaiZe-functional-test+8860bc4f.apk' | sha256sum -c -
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs candidate/*.apk | tee "$RUNNER_TEMP/baize-30021-certificate.txt"
          rg -q 'SHA-256 digest: 9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f' "$RUNNER_TEMP/baize-30021-certificate.txt"
          python3 .github/scripts/create-cache-only-fixtures.py "$RUNNER_TEMP/baize-cache-fixtures"
          curl --fail --location --retry 3 'https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk' -o "$RUNNER_TEMP/shizuku.apk"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Shizuku UID 2000 permission and cache-only cleanup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            python3 .github/scripts/smoke-shizuku-cache.py candidate/*.apk "$RUNNER_TEMP/shizuku.apk" "$RUNNER_TEMP/baize-cache-fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaiZe-30021-Shizuku-Device
          path: ${{ runner.temp }}/baize-shizuku-device/
          if-no-files-found: warn
          retention-days: 7
