name: BaiZe 30021 Full Unit Validation

on:
  push:
    branches: [codex/baize-safety-scan-20260930]

permissions:
  contents: read

concurrency:
  group: baize-30021-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-android-tests:
    if: contains(github.event.head_commit.message, '[30021-unit-validation]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the identical signed application source
        run: |
          git diff --exit-code bb5c82249878d8f6cb0c3f96c931084abb22cf50 HEAD -- . \
            ':(exclude).github/**' ':(exclude)v2/app/src/test/**' ':(exclude)v2/app/src/testDebug/**'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify all Android logic and lint
        working-directory: v2
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaiZe-30021-Full-Unit-Verification
          path: |
            v2/app/build/test-results/testDebugUnitTest/
            v2/app/build/reports/lint-results-debug.html
          retention-days: 7
