name: Bootstrap perf organizer safe

on:
  pull_request:
    branches:
      - ci/perf-organizer-bootstrap-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-post3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap head branch
        uses: actions/checkout@v4
        with:
          ref: fix/perf-organizer-safe-v2.6.2
          fetch-depth: 0

      - name: Reconstruct verified series and publish post-3 tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/patch.gz.b64.00 \
            .bootstrap/patch.gz.b64.01 \
            .bootstrap/patch.gz.b64.02 \
            .bootstrap/patch.gz.b64.03 \
            .bootstrap/patch.gz.b64.04.0 \
            .bootstrap/patch.gz.b64.04.1 \
            .bootstrap/patch.gz.b64.04.2 \
            .bootstrap/patch.gz.b64.04.3 \
            .bootstrap/patch.gz.b64.05 \
            | base64 -d | gzip -d > /tmp/baize-safe.patch
          echo 'ae22f24c2fe1a6f081bb787880ee4734a1a3c0a255e990660096948224238b1a  /tmp/baize-safe.patch' | sha256sum -c -
          rm -rf /tmp/mails && mkdir -p /tmp/mails
          git mailsplit -d4 -o/tmp/mails /tmp/baize-safe.patch
          git config user.name '惜故里丶'
          git config user.email 'xgl34222220@gmail.com'
          git fetch origin main
          git reset --hard origin/main
          git am /tmp/mails/0001 /tmp/mails/0002 /tmp/mails/0003
          git --no-pager log --oneline -4
          git push --force origin HEAD:refs/heads/tmp/perf-safe-post3
