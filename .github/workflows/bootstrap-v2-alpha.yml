name: Bootstrap BaiZe v2 Alpha 1

on:
  push:
    branches: [v2-alpha1]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-v2-alpha.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/v2-source.b64.part00 \
            .bootstrap/v2-source.b64.part01 \
            .bootstrap/v2-source.b64.part02 \
            .bootstrap/v2-source.b64.part03 \
            .bootstrap/v2-source.b64.part04 \
            .bootstrap/v2-source.b64.part05a \
            .bootstrap/v2-source.b64.part05b \
            .bootstrap/v2-source.b64.part06 \
            | base64 --decode > /tmp/BaiZe-v2-Alpha1-Source.zip
          echo '1769511e896b8cff6450b1ead138637652eb841ddd9308d0f67cf141b7f0d460  /tmp/BaiZe-v2-Alpha1-Source.zip' | sha256sum -c -
          rm -rf /tmp/baize-v2 v2
          mkdir -p /tmp/baize-v2 v2
          unzip -q /tmp/BaiZe-v2-Alpha1-Source.zip -d /tmp/baize-v2
          rsync -a --exclude='.github/' /tmp/baize-v2/BaiZe-v2-Alpha1/ v2/
          chmod 0755 v2/module/*.sh v2/scripts/*.sh

      - name: Build native app
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package root bridge
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Upload Alpha artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha1
          path: |
            v2/app/build/outputs/apk/debug/app-debug.apk
            v2/dist/BaiZe-v2-Alpha1-Bridge.zip

      - name: Publish source to alpha branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2
          git commit -m 'Add BaiZe v2 Alpha 1 native app scaffold'
          git push origin HEAD:v2-alpha1
