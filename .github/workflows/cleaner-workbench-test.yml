name: BaiZe Cleaner Workbench Test

on:
  push:
    branches: [codex/baize-safety-scan-20260930]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: baize-cleaner-workbench-${{ github.ref }}
  cancel-in-progress: true

env:
  BAIZE_CERT_SHA256: 9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f

jobs:
  build-paired-test:
    if: ${{ !contains(github.event.head_commit.message, '[device-validation-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Identify paired test build
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          echo "BAIZE_TEST_LABEL=cleaner-workbench-test+$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BAIZE_VERSION=$(sed -n 's/^version=//p' module.prop | head -n1)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android and native toolchains
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          sudo apt-get update
          sudo apt-get install -y busybox-static toybox mksh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Prepare formal signing certificate
        env:
          BAIZE_KEYSTORE_BASE64: ${{ secrets.BAIZE_KEYSTORE_BASE64 }}
          BAIZE_KEYSTORE_PASSWORD: ${{ secrets.BAIZE_KEYSTORE_PASSWORD }}
          BAIZE_KEY_ALIAS: ${{ secrets.BAIZE_KEY_ALIAS }}
          BAIZE_KEY_PASSWORD: ${{ secrets.BAIZE_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare-formal-signing.py

      - name: Verify shell and full cleaner regression
        shell: bash
        run: |
          set -euo pipefail
          for script in v2/module/*.sh v2/module/scripts/*.sh v2/scripts/*.sh; do
            [ -f "$script" ] || continue
            sh -n "$script"
            busybox ash -n "$script"
          done
          bash v2/tests/run-all.sh

      - name: Test Android logic and render UI
        working-directory: v2
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug-only Root flow probe
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-Root-Flow-Probe
          path: v2/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Build native engines
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build signed App
        working-directory: v2
        run: ./gradlew --no-daemon --max-workers=2 :app:compileReleaseKotlin :app:assembleRelease

      - name: Package matching Magisk module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify paired artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=v2/app/build/outputs/apk/release/app-release.apk
          ZIP="v2/dist/BaiZe-$BAIZE_VERSION-Module.zip"
          OUT=v2/dist/cleaner-workbench-test
          mkdir -p "$OUT"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$OUT/signing-certificate.txt"
          APK_CERT=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' "$OUT/signing-certificate.txt" | tr -d ':[:space:]')
          test "$APK_CERT" = "$BAIZE_CERT_SHA256"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" app/baize.apk > "$RUNNER_TEMP/embedded.apk"
          cmp "$APK" "$RUNNER_TEMP/embedded.apk"
          cp "$APK" "$OUT/BaiZe-$BAIZE_TEST_LABEL.apk"
          cp "$ZIP" "$OUT/BaiZe-$BAIZE_TEST_LABEL-Module.zip"
          cd "$OUT"
          sha256sum "BaiZe-$BAIZE_TEST_LABEL.apk" "BaiZe-$BAIZE_TEST_LABEL-Module.zip" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload paired test bundle
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-${{ env.BAIZE_TEST_LABEL }}-Paired-Test
          path: v2/dist/cleaner-workbench-test/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-Workbench-Verification
          path: |
            v2/app/build/reports/ui-screenshots/
            v2/app/build/reports/batch-cleanup-ui/
            v2/app/app/build/reports/batch-cleanup-ui/
            v2/app/build/test-results/testDebugUnitTest/
            v2/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/baize-formal.jks" "$RUNNER_TEMP/baize-formal.der"

  apk-installation-smoke:
    needs: build-paired-test
    if: ${{ always() && !cancelled() && (needs.build-paired-test.result == 'success' || contains(github.event.head_commit.message, '[device-validation-only]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact production source before reusing a verified build
        if: contains(github.event.head_commit.message, '[device-validation-only]')
        run: |
          git diff --exit-code 23a3de1b3fa293ccceff61ffab814f80acc5456b HEAD -- . \
            ':(exclude).github/scripts/smoke-workbench-apk.py' \
            ':(exclude).github/workflows/cleaner-workbench-test.yml'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: BaiZe-*-Paired-Test
          merge-multiple: true
          path: candidate
          run-id: ${{ contains(github.event.head_commit.message, '[device-validation-only]') && 36787354759 || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: BaiZe-Root-Flow-Probe
          path: root-probe
          run-id: ${{ contains(github.event.head_commit.message, '[device-validation-only]') && 36787354759 || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the reused signed APK bytes
        if: contains(github.event.head_commit.message, '[device-validation-only]')
        run: |
          test "$(sha256sum candidate/*.apk | awk '{print $1}')" = '2bf86de59a6b1273aa7d6e28b67412b71155c8a630b434a5caafdfed8207c07b'
      - name: Download exact 30006 test baseline
        uses: actions/download-artifact@v4
        with:
          name: BaiZe-cleaner-workbench-test+ea8f0290-Paired-Test
          run-id: 36744532279
          github-token: ${{ github.token }}
          path: baseline-30006
      - name: Download exact 30007 test baseline
        uses: actions/download-artifact@v4
        with:
          name: BaiZe-cleaner-workbench-test+0150dfdf-Paired-Test
          run-id: 36752722567
          github-token: ${{ github.token }}
          path: baseline-30007
      - name: Download exact delivered 30008 test baseline
        uses: actions/download-artifact@v4
        with:
          name: BaiZe-cleaner-workbench-test+bd6a70e5-Paired-Test
          run-id: 36776344960
          github-token: ${{ github.token }}
          path: baseline-30008
      - name: Prepare verified upgrade baseline and emulator
        run: |
          curl --fail --location --retry 3 'https://github.com/xgl34222220-ops/BaiZe/releases/download/refactor-v2.0.0/BaiZe-v2.0.0.apk' -o "$RUNNER_TEMP/baize-baseline.apk"
          echo "BAIZE_BASELINE_APK=$RUNNER_TEMP/baize-baseline.apk" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build same-package archive resource fixtures
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 .github/scripts/create-apk-artwork-fixtures.py root-probe/app-debug.apk "$RUNNER_TEMP/baize-apk-fixtures"
      - name: Verify Root cleanup then final minified APK installation and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb install root-probe/app-debug.apk
            bash .github/scripts/probe-root-cache.sh root-probe/app-debug.apk
            bash .github/scripts/probe-apk-artwork.sh
            adb uninstall io.github.xgl34222220.baize
            python3 .github/scripts/smoke-workbench-apk.py candidate/*.apk 30009 baseline-30006/*.apk baseline-30007/*.apk baseline-30008/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaiZe-APK-Installation-Smoke
          path: |
            ${{ runner.temp }}/baize-apk-startup/
            ${{ runner.temp }}/baize-root-cache-probe/
            ${{ runner.temp }}/baize-apk-artwork-probe/
          if-no-files-found: warn
          retention-days: 7
