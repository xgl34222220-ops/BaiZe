name: Diagnose Immediate Scheduler Regression

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dual-theme-ui-redesign
          fetch-depth: 0
      - name: Capture root regression commands and matching assertions
        shell: bash
        run: |
          set -e
          {
            echo '=== workflow step ==='
            grep -R -n -A 80 -B 5 'Verify Root scripts and regressions' .github/workflows || true
            echo '=== old boot delay assertions ==='
            grep -R -n -E 'sleep 120|BOOT_WAIT|max_battery_temp|等待电池降温|screen_off_only=1|CONDITION_RETRY_SECONDS.*60' . --exclude-dir=.git --exclude='*.apk' --exclude='*.zip' || true
          } > .immediate-scheduler-regression.txt
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .immediate-scheduler-regression.txt
          git commit -m 'ci: capture scheduler regression contracts'
          git push origin HEAD:agent/dual-theme-ui-redesign
