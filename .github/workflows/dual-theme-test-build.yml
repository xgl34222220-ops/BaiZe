name: BaiZe Dual Theme Test Build

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign

permissions:
  contents: read

concurrency:
  group: baize-dual-theme-test
  cancel-in-progress: true

env:
  BAIZE_CERT_SHA256: 9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesigned UI
        uses: actions/checkout@v4

      - name: Verify repository diff and Root scripts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for script in v2/module/*.sh v2/scripts/*.sh service.sh cleaner.sh; do
            sh -n "$script"
          done
          bash v2/tests/test-scheduler-fairness.sh
          bash v2/tests/test-incremental-index.sh
          bash v2/tests/test-organizer-transactions.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare formal signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BAIZE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.BAIZE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BAIZE_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.BAIZE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          normalize_secret() {
            secret_name=$1
            raw_value=$2
            value=$(printf '%s' "$raw_value" | tr -d '\r\n')
            value=$(printf '%s' "$value" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            case "$value" in "$secret_name="*) value=${value#*=} ;; esac
            case "$value" in
              \"*\") value=${value#\"}; value=${value%\"} ;;
              \'*\') value=${value#\'}; value=${value%\'} ;;
            esac
            printf '%s' "$value"
          }
          KEYSTORE_BASE64=$(normalize_secret BAIZE_KEYSTORE_BASE64 "$KEYSTORE_BASE64_RAW" | tr -d '[:space:]')
          KEYSTORE_PASSWORD=$(normalize_secret BAIZE_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD_RAW")
          KEY_ALIAS=$(normalize_secret BAIZE_KEY_ALIAS "$KEY_ALIAS_RAW")
          KEY_PASSWORD=$(normalize_secret BAIZE_KEY_PASSWORD "$KEY_PASSWORD_RAW")
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/baize-dual-theme.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_CERT=$(keytool -exportcert -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -rfc \
            | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$BAIZE_CERT_SHA256"
          {
            echo "BAIZE_KEYSTORE_PATH=$KEYSTORE"
            echo "BAIZE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BAIZE_KEY_ALIAS=$KEY_ALIAS"
            echo "BAIZE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Compile both themes, lint and macrobenchmark
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:lintRelease :macrobenchmark:assemble 2>&1 | tee dual-theme-android-build.log

      - name: Package redesigned module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh 2>&1 | tee dual-theme-package.log

      - name: Verify and name test artifacts
        shell: bash
        run: |
          set -euo pipefail
          SRC_APK='v2/app/build/outputs/apk/release/app-release.apk'
          SRC_ZIP='v2/dist/BaiZe-v2.4.0-Module.zip'
          OUT='v2/dist/dual-theme-test'
          APK="$OUT/BaiZe-v2.4.0-Dual-Theme-Test.apk"
          ZIP="$OUT/BaiZe-v2.4.0-Dual-Theme-Test-Module.zip"
          CERT="$OUT/BaiZe-v2.4.0-Dual-Theme-Test-signing-certificate.txt"
          mkdir -p "$OUT"
          test -s "$SRC_APK"
          test -s "$SRC_ZIP"
          unzip -tq "$SRC_ZIP"
          cp "$SRC_APK" "$APK"
          cp "$SRC_ZIP" "$ZIP"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$CERT"
          APK_CERT=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' "$CERT" | tr -d ':[:space:]')
          test "$APK_CERT" = "$BAIZE_CERT_SHA256"
          MODULE_APK_SHA=$(unzip -p "$ZIP" app/baize.apk | sha256sum | awk '{print $1}')
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          test "$MODULE_APK_SHA" = "$APK_SHA"
          sha256sum "$ZIP" > "$ZIP.sha256"
          sha256sum "$APK" > "$APK.sha256"
          cp v2/dual-theme-android-build.log "$OUT/"
          cp v2/dual-theme-package.log "$OUT/"

      - name: Upload dual-theme test package
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-Dual-Theme-Test
          if-no-files-found: error
          retention-days: 14
          path: v2/dist/dual-theme-test/
