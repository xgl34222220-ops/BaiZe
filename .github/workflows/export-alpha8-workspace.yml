name: Export BaiZe Alpha 8 workspace

on:
  pull_request:
    branches: [feat/v2.1.0-alpha7-system-cache]
    paths:
      - '.github/workflows/export-alpha8-workspace.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.1.0-alpha8-file-organizer
          fetch-depth: 0
      - name: Pack workspace and patch diagnostics
        run: |
          set -euo pipefail
          mkdir -p alpha8-diagnostics
          cp -a .github/alpha8-direct alpha8-diagnostics/
          find .github/alpha8-direct -maxdepth 1 -type f -name 'part-*.patch' ! -name 'part-13-*' -print | sort | xargs cat > alpha8-diagnostics/alpha8-main.patch
          cat .github/alpha8-direct/part-13-*.patch > alpha8-diagnostics/alpha8-ownership.patch
          sha256sum .github/alpha8-direct/part-*.patch alpha8-diagnostics/*.patch > alpha8-diagnostics/sha256.txt
          tar -czf BaiZe-alpha8-workspace.tar.gz v2 config cleaner.sh notify.sh service.sh RELEASE_NOTES_V2.md alpha8-diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-alpha8-workspace
          path: BaiZe-alpha8-workspace.tar.gz
