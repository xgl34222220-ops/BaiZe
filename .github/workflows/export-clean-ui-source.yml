name: Export active Clean UI source

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/export-clean-ui-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
      - name: Export active native App sources
        shell: bash
        run: |
          set -euo pipefail
          {
            find v2/app/src/main/java/io/github/xgl34222220/baize -type f -name '*.kt' -print
            find v2/module -maxdepth 2 -type f \( -name '*.sh' -o -name '*.conf' -o -name 'module.prop' \) -print
            printf '%s\n' v2/app/src/main/AndroidManifest.xml v2/app/build.gradle.kts
          } | sort -u > /tmp/active-source-files.txt
          tar -czf /tmp/active-clean-ui-source.tar.gz -T /tmp/active-source-files.txt
          cp /tmp/active-clean-ui-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: active-clean-ui-source
          path: active-clean-ui-source.tar.gz
