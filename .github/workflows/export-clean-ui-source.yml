name: Export active Clean UI source

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/export-clean-ui-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
      - name: Export active native App sources
        run: |
          set -euo pipefail
          tar -czf active-clean-ui-source.tar.gz \
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui \
            v2/module/scheduler.sh \
            v2/module/action.sh \
            v2/module/customize.sh \
            v2/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: active-clean-ui-source
          path: active-clean-ui-source.tar.gz
