name: Export BaiZe v2.1.0 Alpha 2 source

on:
  push:
    branches: [perf/v2.1.0-alpha2-external-one-pass]
    paths:
      - '.github/workflows/export-v210-alpha2-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-alpha2-external-one-pass
          fetch-depth: 0
      - name: Pack source workspace
        shell: bash
        run: |
          set -euo pipefail
          tar -czf BaiZe-v2.1.0-alpha2-source.tar.gz v2 RELEASE_NOTES_V2.md service.sh cleaner.sh notify.sh config
      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha2-source
          path: BaiZe-v2.1.0-alpha2-source.tar.gz
