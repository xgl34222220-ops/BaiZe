name: Export Alpha 4
on:
  pull_request:
    branches: [perf/v2.1.0-alpha3-path-pruning]
    paths: ['.github/workflows/export-v210-alpha4.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Alpha 4 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v2.1.0-alpha4-bounded-parallel.yml --ref perf/v2.1.0-alpha4-limited-parallel
