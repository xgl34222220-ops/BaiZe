name: Export Alpha 6 baseline

on:
  pull_request:
    branches: [perf/v2.1.0-alpha5-adaptive-workers]
    paths:
      - '.github/workflows/export-v210-alpha6.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-alpha6-performance-panel
          fetch-depth: 0
      - name: Pack source
        run: tar -czf alpha6-baseline.tar.gz v2 config cleaner.sh notify.sh service.sh RELEASE_NOTES_V2.md
      - uses: actions/upload-artifact@v4
        with:
          name: alpha6-baseline
          path: alpha6-baseline.tar.gz
