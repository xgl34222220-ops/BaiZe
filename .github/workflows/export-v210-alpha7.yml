name: Export Alpha 7 baseline

on:
  pull_request:
    branches: [perf/v2.1.0-alpha6-performance-panel]
    paths:
      - '.github/workflows/export-v210-alpha7.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.1.0-alpha7-system-cache
          fetch-depth: 0
      - name: Pack source
        run: tar -czf alpha7-baseline.tar.gz v2 config cleaner.sh notify.sh service.sh RELEASE_NOTES_V2.md
      - uses: actions/upload-artifact@v4
        with:
          name: alpha7-baseline
          path: alpha7-baseline.tar.gz
