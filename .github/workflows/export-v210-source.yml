name: Export BaiZe v2.1.0 source

on:
  pull_request:
    branches: [fix/v2.0.5-reliable-snapshots]
    paths:
      - '.github/workflows/export-v210-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-one-pass-scanner
          fetch-depth: 0
      - name: Pack performance workspace
        shell: bash
        run: |
          set -euo pipefail
          tar -czf BaiZe-v2.1.0-source.tar.gz \
            v2 config cleaner.sh notify.sh service.sh RELEASE_NOTES_V2.md
      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-source
          path: BaiZe-v2.1.0-source.tar.gz
