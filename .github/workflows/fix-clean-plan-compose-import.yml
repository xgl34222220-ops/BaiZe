name: Fix clean plan Compose import

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-clean-plan-compose-import.yml']

permissions:
  contents: write

concurrency:
  group: fix-clean-plan-compose-import
  cancel-in-progress: false

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Patch feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-plan-persistence
          fetch-depth: 0

      - name: Remove internal Compose import
        run: |
          set -euo pipefail
          FILE=v2/app/src/main/java/io/github/xgl34222220/baize/PersistentSmartScanActivity.kt
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$FILE"
          ! grep -qx 'import androidx.compose.foundation.layout.weight' "$FILE"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FILE"
          git commit -m 'fix(clean): use scoped Compose weight extension'
          git push origin HEAD:agent/clean-plan-persistence

      - name: Remove bootstrap workflow
        if: always()
        run: |
          set -euo pipefail
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-clean-plan-compose-import.yml
          git commit -m 'chore: remove clean plan import fixer'
          git push origin main
