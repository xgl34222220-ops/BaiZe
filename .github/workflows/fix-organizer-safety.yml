name: Apply Organizer Safety Hotfix

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign

permissions:
  contents: write

concurrency:
  group: organizer-safety-hotfix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dual-theme-ui-redesign
          fetch-depth: 0

      - name: Verify expected source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object v2/module/organizer-worker.sh)" = "797b0e65abdbf7365adff1a29a92cdabef704d7b"
          test "$(git hash-object v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt)" = "1f9b0fcf39e30de5d75fee25b54b23730a973331"
          test "$(git hash-object v2/app/src/main/java/io/github/xgl34222220/baize/root/SchedulerRepository.kt)" = "ab5f43f28d8995c2257830133193b45ffb31aae5"
          test "$(git hash-object v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/SchedulerText.kt)" = "f34793336c0b3b272980929a44ac38c5eebc4dc0"
          test "$(git hash-object v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/HomeTaskPresentation.kt)" = "3a73eff18c684dcd5cecb67c69fff5b2405e6c8d"

      - name: Apply wording and organizer safety fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old[:80]!r}, got {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          home = "v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/HomeTaskPresentation.kt"
          replace_once(
              home,
              '    if (task.nextEpoch <= 0L || remaining <= 30L) return "待执行"\n',
              '    if (task.nextEpoch <= 0L) return "正在计算执行时间"\n'
              '    if (remaining <= 30L) return "已到期，等待自动执行"\n'
          )

          scheduler_text = "v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/SchedulerText.kt"
          replace_once(
              scheduler_text,
              '    else -> "待执行"\n}\n',
              '    else -> "等待自动执行"\n}\n'
          )
          replace_once(
              scheduler_text,
              'fun schedulerReasonLabel(raw: String): String = if (raw.trim().equals("执行中", ignoreCase = true)) {\n'
              '    "执行中"\n'
              '} else {\n'
              '    "待执行"\n'
              '}\n',
              'fun schedulerReasonLabel(raw: String): String {\n'
              '    val value = raw.trim()\n'
              '    return when {\n'
              '        value.equals("执行中", ignoreCase = true) -> "执行中"\n'
              '        value.contains("息屏") -> "等待息屏后执行"\n'
              '        value.contains("充电") -> "等待充电后执行"\n'
              '        value.contains("电量") -> "等待电量满足条件"\n'
              '        value.contains("空闲") -> "等待系统空闲后执行"\n'
              '        value.contains("当前任务") || value.contains("已有") -> "等待当前任务完成"\n'
              '        value.contains("下次") || value.contains("没有到期") -> "等待下次执行"\n'
              '        else -> "等待自动执行"\n'
              '    }\n'
              '}\n'
          )
          replace_once(
              scheduler_text,
              '    if (nextEpoch <= 0L || remaining <= 30L) return "待执行"\n',
              '    if (nextEpoch <= 0L) return "正在计算执行时间"\n'
              '    if (remaining <= 30L) return "已到期，等待自动执行"\n'
          )

          scheduler_repo = "v2/app/src/main/java/io/github/xgl34222220/baize/root/SchedulerRepository.kt"
          replace_once(
              scheduler_repo,
              '            .put("reason", if (publicState == "running") "执行中" else "待执行")\n',
              '            .put("reason", publicSchedulerReason(publicState, scheduler.optString("reason")))\n'
          )
          replace_once(
              scheduler_repo,
              '\n\n    private fun nextRunsJsonObject(config: JSONObject, now: Long): JSONObject {\n',
              '\n\n    private fun publicSchedulerReason(state: String, raw: String): String = when {\n'
              '        state == "disabled" -> "自动任务已关闭"\n'
              '        state == "running" -> "执行中"\n'
              '        raw.contains("息屏") -> "等待息屏后执行"\n'
              '        raw.contains("充电") -> "等待充电后执行"\n'
              '        raw.contains("电量") -> "等待电量满足条件"\n'
              '        raw.contains("空闲") -> "等待系统空闲后执行"\n'
              '        raw.contains("已有") || raw.contains("当前任务") -> "等待当前任务完成"\n'
              '        raw.contains("没有到期") || raw.contains("下次") -> "等待下次执行"\n'
              '        else -> "等待自动执行"\n'
              '    }\n\n'
              '    private fun nextRunsJsonObject(config: JSONObject, now: Long): JSONObject {\n'
          )

          worker = "v2/module/organizer-worker.sh"
          replace_once(
              worker,
              '    pdf|doc|docx|xls|xlsx|ppt|pptx|txt|rtf|csv|md|odt|ods|odp|log|json|xml|yaml|yml|conf|ini) echo 文档 ;;\n',
              '    pdf|doc|docx|xls|xlsx|ppt|pptx|txt|rtf|csv|md|odt|ods|odp) echo 文档 ;;\n'
          )
          replace_once(worker, '    *) echo 其他 ;;\n', '    *) echo "" ;;\n')
          replace_once(
              worker,
              'is_public_user_path() {\n'
              '  case "$1" in\n'
              '    Download/*|Downloads/*|Documents/*|DCIM/*|Pictures/*|Movies/*|Music/*|Podcasts/*|Audiobooks/*|Recordings/*|Bluetooth/*|Tencent/QQfile_recv/*|Tencent/TIMfile_recv/*|Telegram/*|Nagram/*|NagramX/*) return 0 ;;\n'
              '  esac\n'
              '  return 1\n'
              '}\n',
              'is_public_user_path() {\n'
              '  case "$1" in\n'
              '    Download/*|Downloads/*|Documents/*|Bluetooth/*|Tencent/QQfile_recv/*|Tencent/TIMfile_recv/*) return 0 ;;\n'
              '    Telegram/Telegram\\ Documents/*|Telegram/Telegram\\ Images/*|Telegram/Telegram\\ Video/*|Telegram/Telegram\\ Audio/*|Telegram/Telegram\\ Files/*) return 0 ;;\n'
              '    Nagram/Nagram\\ Documents/*|Nagram/Nagram\\ Images/*|Nagram/Nagram\\ Video/*|Nagram/Nagram\\ Audio/*) return 0 ;;\n'
              '    NagramX/NagramX\\ Documents/*|NagramX/NagramX\\ Images/*|NagramX/NagramX\\ Video/*|NagramX/NagramX\\ Audio/*) return 0 ;;\n'
              '  esac\n'
              '  return 1\n'
              '}\n'
          )
          replace_once(
              worker,
              '    *.lock|*.lck|*.db|*.sqlite|*.sqlite3|*-wal|*-shm|*.journal|*.part|*.partial|*.crdownload|*.download|*.tmp|*.temp) return 0 ;;\n'
              '  esac\n'
              '  return 1\n',
              '    *.lock|*.lck|*.db|*.sqlite|*.sqlite3|*-wal|*-shm|*.journal|*.part|*.partial|*.crdownload|*.download|*.tmp|*.temp) return 0 ;;\n'
              '    *.bytes|*.vfs|*.blob|*.bin|*.dat|*.pak|*.obb|*.bundle|*.asset|*.cache|*.idx|*.index|*.dex|*.odex|*.vdex|*.so) return 0 ;;\n'
              '  esac\n'
              '  stem=${name%.*}\n'
              '  case "$stem" in\n'
              '    *[!0-9a-f]*) ;;\n'
              '    *) [ "${#stem}" -ge 24 ] && return 0 ;;\n'
              '  esac\n'
              '  return 1\n'
          )
          replace_once(
              worker,
              '  CATEGORY=$(category_for "$FILE_PATH")\n'
              '  allowed_source "$FILE_PATH" "$CATEGORY" || continue\n',
              '  CATEGORY=$(category_for "$FILE_PATH")\n'
              '  [ -n "$CATEGORY" ] || { SKIPPED=$((SKIPPED + 1)); continue; }\n'
              '  allowed_source "$FILE_PATH" "$CATEGORY" || continue\n'
          )

          engine = "v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt"
          replace_once(
              engine,
              '        val root = File(mediaRoot, parts.first())\n'
              '        return SourceRoot(root, sourceGroup(root.path), SourcePolicy.FULL_DOWNLOAD_TREE)\n',
              '        if (!allowedIndexedPublicPath(relative)) return null\n'
              '        val root = File(mediaRoot, parts.first())\n'
              '        return SourceRoot(root, sourceGroup(root.path), SourcePolicy.FULL_DOWNLOAD_TREE)\n'
          )
          replace_once(
              engine,
              '    private fun forEachNulPath(file: File, block: (String) -> Boolean) {\n',
              '    private fun allowedIndexedPublicPath(relative: String): Boolean {\n'
              '        val normalized = relative.replace(\'\\\\\', \'/\').lowercase()\n'
              '        return when {\n'
              '            normalized.startsWith("download/") || normalized.startsWith("downloads/") -> true\n'
              '            normalized.startsWith("documents/") || normalized.startsWith("bluetooth/") -> true\n'
              '            normalized.startsWith("tencent/qqfile_recv/") || normalized.startsWith("tencent/timfile_recv/") -> true\n'
              '            normalized.startsWith("telegram/telegram documents/") ||\n'
              '                normalized.startsWith("telegram/telegram images/") ||\n'
              '                normalized.startsWith("telegram/telegram video/") ||\n'
              '                normalized.startsWith("telegram/telegram audio/") ||\n'
              '                normalized.startsWith("telegram/telegram files/") -> true\n'
              '            normalized.startsWith("nagram/nagram documents/") ||\n'
              '                normalized.startsWith("nagram/nagram images/") ||\n'
              '                normalized.startsWith("nagram/nagram video/") ||\n'
              '                normalized.startsWith("nagram/nagram audio/") -> true\n'
              '            normalized.startsWith("nagramx/nagramx documents/") ||\n'
              '                normalized.startsWith("nagramx/nagramx images/") ||\n'
              '                normalized.startsWith("nagramx/nagramx video/") ||\n'
              '                normalized.startsWith("nagramx/nagram audio/") -> true\n'
              '            else -> false\n'
              '        }\n'
              '    }\n\n'
              '    private fun forEachNulPath(file: File, block: (String) -> Boolean) {\n'
          )
          replace_once(
              engine,
              '        val category = category(file.name)\n'
              '        val destination = File(File("/data/media/$userId/BaiZe归类"), "$category/${file.name}")\n',
              '        val category = category(file.name)\n'
              '        if (category.isBlank()) return\n'
              '        val destination = File(File("/data/media/$userId/BaiZe归类"), "$category/${file.name}")\n'
          )
          replace_once(
              engine,
              '    private fun isAppUserFile(file: File, path: String): Boolean {\n'
              '        if (category(file.name) != "其他") return true\n'
              '        if (file.extension.isBlank()) return false\n'
              '        return path.split(\'/\').any { segment ->\n'
              '            normalizeDirectoryName(segment) in USER_DIRECTORY_NAMES\n'
              '        }\n'
              '    }\n',
              '    private fun isAppUserFile(file: File, path: String): Boolean {\n'
              '        if (category(file.name).isBlank()) return false\n'
              '        return path.split(\'/\').any { segment ->\n'
              '            normalizeDirectoryName(segment) in APP_USER_DIRECTORY_NAMES\n'
              '        }\n'
              '    }\n'
          )
          replace_once(
              engine,
              '            name.endsWith(".download") || name.endsWith(".tmp") || name.endsWith(".temp")\n'
              '    }\n\n'
              '    private fun category(name: String): String {\n',
              '            name.endsWith(".download") || name.endsWith(".tmp") || name.endsWith(".temp") ||\n'
              '            name.endsWith(".bytes") || name.endsWith(".vfs") || name.endsWith(".blob") ||\n'
              '            name.endsWith(".bin") || name.endsWith(".dat") || name.endsWith(".pak") ||\n'
              '            name.endsWith(".obb") || name.endsWith(".bundle") || name.endsWith(".asset") ||\n'
              '            name.endsWith(".cache") || name.endsWith(".idx") || name.endsWith(".index") ||\n'
              '            name.endsWith(".dex") || name.endsWith(".odex") || name.endsWith(".vdex") ||\n'
              '            name.endsWith(".so") || opaqueResourceName(name)\n'
              '    }\n\n'
              '    private fun opaqueResourceName(name: String): Boolean {\n'
              '        val stem = name.substringBeforeLast(\'.\', name)\n'
              '        return stem.length >= 24 && stem.all { it in \'0\'..\'9\' || it in \'a\'..\'f\' }\n'
              '    }\n\n'
              '    private fun category(name: String): String {\n'
          )
          replace_once(
              engine,
              '            "odt", "ods", "odp", "log", "json", "xml", "yaml", "yml", "conf", "ini" -> "文档"\n',
              '            "odt", "ods", "odp" -> "文档"\n'
          )
          replace_once(engine, '            else -> "其他"\n', '            else -> ""\n')
          replace_once(
              engine,
              '        private val USER_DIRECTORY_NAMES = setOf(\n'
              '            "download", "downloads", "downloaded", "下载",\n'
              '            "document", "documents", "file", "files",\n'
              '            "received", "receive", "recv", "export", "exports",\n'
              '            "attachment", "attachments", "transfer", "transfers", "offline",\n'
              '            "telegram", "telegram_documents", "telegram_files",\n'
              '            "nagram", "nagramx", "saved", "shared"\n'
              '        )\n',
              '        private val APP_USER_DIRECTORY_NAMES = setOf(\n'
              '            "download", "downloads", "downloaded", "下载",\n'
              '            "document", "documents", "received", "receive", "recv", "file_recv",\n'
              '            "qqfile_recv", "qqmy_file_recv", "timfile_recv", "tim_file_recv",\n'
              '            "export", "exports", "attachment", "attachments",\n'
              '            "transfer", "transfers", "offline", "saved", "shared",\n'
              '            "telegram_documents", "telegram_images", "telegram_video", "telegram_audio", "telegram_files",\n'
              '            "nagram_documents", "nagram_images", "nagram_video", "nagram_audio", "nagram_files",\n'
              '            "nagramx_documents", "nagramx_images", "nagramx_video", "nagramx_audio", "nagramx_files"\n'
              '        )\n'
          )
          PY

      - name: Run organizer safety regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n v2/module/organizer-worker.sh
          bash -n v2/module/organizer-worker.sh
          awk '/^category_for\(\)/,/^}/ {print} /^is_public_user_path\(\)/,/^}/ {print} /^skip_file\(\)/,/^}/ {print}' v2/module/organizer-worker.sh > /tmp/organizer-functions.sh
          cat >> /tmp/organizer-functions.sh <<'EOF'
          assert_eq() { [ "$1" = "$2" ] || { echo "expected [$2], got [$1]" >&2; exit 1; }; }
          assert_true() { "$@" || { echo "expected true: $*" >&2; exit 1; }; }
          assert_false() { if "$@"; then echo "expected false: $*" >&2; exit 1; fi; }
          assert_eq "$(category_for /x/photo.jpg)" "图片"
          assert_eq "$(category_for /x/report.pdf)" "文档"
          assert_eq "$(category_for /x/0013b21d38fdb6885de31fcd262fddcc.bytes)" ""
          assert_eq "$(category_for /x/010ab74b2dcdd906a7099c2ffeabeee.vfs)" ""
          assert_eq "$(category_for /x/config.json)" ""
          assert_true skip_file /x/0013b21d38fdb6885de31fcd262fddcc.bytes
          assert_true skip_file /x/010ab74b2dcdd906a7099c2ffeabeee.vfs
          assert_true skip_file /x/0013b21d38fdb6885de31fcd262fddcc.jpg
          assert_false skip_file /x/holiday-photo.jpg
          assert_true is_public_user_path 'Download/holiday-photo.jpg'
          assert_true is_public_user_path 'Telegram/Telegram Documents/file.pdf'
          assert_false is_public_user_path 'DCIM/Camera/photo.jpg'
          assert_false is_public_user_path 'Pictures/app-cache/0013.jpg'
          assert_false is_public_user_path 'Telegram/cache/blob.bin'
          EOF
          sed -i 's/^          //' /tmp/organizer-functions.sh
          sh /tmp/organizer-functions.sh
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin and lint
        shell: bash
        working-directory: v2
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:lintDebug --stacktrace

      - name: Commit verified product fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-organizer-safety.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: clarify due tasks and protect organizer sources'
          git push origin HEAD:agent/dual-theme-ui-redesign
