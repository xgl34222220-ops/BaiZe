name: Fix Settings Imports Once

on:
  push:
    branches:
      - agent/automatic-task-status

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip import fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-task-status
          fetch-depth: 0
      - name: Restore shared settings icons
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/material/SettingsScreenMaterial.kt'),
              Path('v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/miuix/SettingsScreenMiuix.kt'),
          ]
          for path in paths:
              text = path.read_text()
              anchor = 'import androidx.compose.material.icons.Icons\n'
              additions = (
                  'import androidx.compose.material.icons.rounded.BugReport\n'
                  'import androidx.compose.material.icons.rounded.Refresh\n'
              )
              if 'import androidx.compose.material.icons.rounded.BugReport\n' not in text:
                  text = text.replace(anchor, anchor + additions, 1)
              elif 'import androidx.compose.material.icons.rounded.Refresh\n' not in text:
                  text = text.replace(
                      'import androidx.compose.material.icons.rounded.BugReport\n',
                      'import androidx.compose.material.icons.rounded.BugReport\n'
                      'import androidx.compose.material.icons.rounded.Refresh\n',
                      1,
                  )
              path.write_text(text)
      - name: Commit import fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'icons.rounded.BugReport' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/material/SettingsScreenMaterial.kt
          grep -q 'icons.rounded.Refresh' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/material/SettingsScreenMaterial.kt
          grep -q 'icons.rounded.BugReport' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/miuix/SettingsScreenMiuix.kt
          grep -q 'icons.rounded.Refresh' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/miuix/SettingsScreenMiuix.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/material/SettingsScreenMaterial.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/miuix/SettingsScreenMiuix.kt
          git commit -m 'fix: restore shared settings icon imports [skip import fix]'
          git push origin HEAD:agent/automatic-task-status
