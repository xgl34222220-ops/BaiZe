name: Correct BaiZe v2.5.4 Release Template

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fix-v2.5.4-release-template.yml'
      - 'v2/scripts/fix-v2.5.4-release-template.py'

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Correct template
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch release/v2.5.4 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 v2/scripts/fix-v2.5.4-release-template.py
          grep -q 'BAIZE_VERSION_NAME: 2.5.4' v2/release/v2.5.4-release.yml.template
          grep -q 'versionName = "2.5.4"' v2/release/v2.5.4-release.yml.template
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/release/v2.5.4-release.yml.template
          git commit -m 'fix: correct v2.5.4 release template'
          git push origin HEAD:release/v2.5.4
