name: Inspect Dual Theme Build

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for matching formal build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            JSON=$(gh run list \
              --repo "$REPO" \
              --workflow dual-theme-test-build.yml \
              --branch agent/dual-theme-ui-redesign \
              --limit 10 \
              --json databaseId,headSha,status,conclusion,url,createdAt)
            MATCH=$(printf '%s' "$JSON" | jq -c --arg sha "$HEAD_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | reverse | .[0] // empty')
            if [ -n "$MATCH" ]; then
              printf '%s\n' "$MATCH" | tee dual-theme-build-status.json
              STATUS=$(printf '%s' "$MATCH" | jq -r '.status')
              if [ "$STATUS" = completed ]; then
                CONCLUSION=$(printf '%s' "$MATCH" | jq -r '.conclusion')
                test "$CONCLUSION" = success
                exit 0
              fi
            fi
            sleep 30
          done
          echo 'Timed out waiting for dual-theme formal build' >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-theme-build-status
          path: dual-theme-build-status.json
          if-no-files-found: warn
