name: Inspect Dual Theme Parts

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record repair checksums
        shell: bash
        run: |
          set -u
          : > checksums.txt
          for f in .github/repair/* .github/dual-theme-patch.part.02 .github/dual-theme-patch.part.04; do
            [ -f "$f" ] || continue
            printf 'PART %s bytes=' "$f" >> checksums.txt
            wc -c < "$f" | tr -d ' ' >> checksums.txt
            sha256sum "$f" >> checksums.txt
          done
          cat \
            .github/repair/00.a .github/repair/00.b \
            .github/repair/01.a1 .github/repair/01.a2 .github/repair/01.b \
            .github/dual-theme-patch.part.02 \
            .github/repair/03.a .github/repair/03.b \
            .github/dual-theme-patch.part.04 > /tmp/all.b64
          printf 'ALL bytes=' >> checksums.txt
          wc -c < /tmp/all.b64 | tr -d ' ' >> checksums.txt
          sha256sum /tmp/all.b64 >> checksums.txt
          base64 --decode /tmp/all.b64 > /tmp/all.gz 2>decode.err || true
          printf 'GZ bytes=' >> checksums.txt
          wc -c < /tmp/all.gz | tr -d ' ' >> checksums.txt
          sha256sum /tmp/all.gz >> checksums.txt
          cat decode.err >> checksums.txt || true
          gzip --test /tmp/all.gz >> checksums.txt 2>&1 || true
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dual-theme-repair-checksums
          path: checksums.txt
          if-no-files-found: error
