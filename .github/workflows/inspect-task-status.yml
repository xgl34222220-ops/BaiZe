name: Inspect BaiZe task status

on:
  push:
    branches:
      - agent/automatic-task-status
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inspection report
        shell: bash
        run: |
          {
            echo '=== TREE ==='
            find . -maxdepth 8 -type f | sort
            echo '=== MATCHES ==='
            grep -RInE '垃圾扫描|安全扫描|连续失败|熔断|暂停 6 小时|max_run_minutes|超时|timeout|schedule_organize|organize.*hours|scheduler_reason|scheduler_state|next_check_epoch|last_.*_run.epoch' . \
              --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jar' --exclude='*.apk' || true
          } > inspect.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baize-task-status-inspection
          path: inspect.txt
