name: Inspect BaiZe task status

on:
  push:
    branches:
      - agent/automatic-task-status
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source snapshot
        shell: bash
        run: |
          tar -czf /tmp/baize-source.tar.gz \
            service.sh status.sh cleaner.sh config webroot \
            v2/app/src/main v2/module v2/scripts v2/tests \
            .github/workflows/v2.4.0-release.yml
      - uses: actions/upload-artifact@v4
        with:
          name: baize-v240-source-snapshot
          path: /tmp/baize-source.tar.gz
