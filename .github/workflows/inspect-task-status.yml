name: Apply Automatic Task Status Fix

on:
  push:
    branches:
      - agent/automatic-task-status

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-task-status
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/automatic-task-status.part* | tr -d '\r\n' > /tmp/automatic-task-status.patch.gz.b64
          test "$(wc -c < /tmp/automatic-task-status.patch.gz.b64)" -eq 20240
          echo '4cc8da7262fecbad4754ceac84dba10c2f68b1e289db662fe01e58d7f3e40d5d  /tmp/automatic-task-status.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/automatic-task-status.patch.gz.b64 | gzip -d > /tmp/automatic-task-status.patch
          echo 'a1009c0c5dedec3a7194f049db0209b56359e1fe7a9e867b9612432d206e8028  /tmp/automatic-task-status.patch' | sha256sum -c -
          git apply --check /tmp/automatic-task-status.patch
          git apply /tmp/automatic-task-status.patch

      - name: Validate Root scheduler and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n service.sh
          sh -n service.sh
          bash -n cleaner.sh
          sh -n cleaner.sh
          bash -n status.sh
          sh -n status.sh
          bash -n v2/module/task-worker.sh
          sh -n v2/module/task-worker.sh
          bash v2/tests/test-scheduler-fairness.sh
          node --check webroot/app.js
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('v2/app/src/main/AndroidManifest.xml')
          print('manifest: ok')
          PY
          if grep -RInE '垃圾扫描|连续失败|熔断|暂停 6 小时|max_run_minutes|单次运行上限|调度异常|后台守护长时间|唤醒调度器|跳过下一个归类周期' \
            v2/app/src/main v2/module service.sh config/default.conf webroot cleaner.sh status.sh; then
            echo '发现不应继续向用户展示的旧状态或入口' >&2
            exit 1
          fi
          if grep -RIn 'SmartScanActivity' v2/app/src/main/AndroidManifest.xml \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui \
            v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt; then
            echo '垃圾扫描入口仍有可达引用' >&2
            exit 1
          fi

      - name: Commit actual fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/patches
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make automatic tasks status-only [skip apply]'
          git push origin HEAD:agent/automatic-task-status
