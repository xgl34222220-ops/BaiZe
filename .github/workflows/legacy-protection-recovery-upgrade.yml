name: BaiZe Legacy Protection Recovery Upgrade

on:
  push:
    branches: [codex/baize-safety-scan-20260930]

permissions:
  contents: read
  actions: read

concurrency:
  group: baize-legacy-protection-recovery-${{ github.sha }}
  cancel-in-progress: false

jobs:
  signed-upgrade:
    if: contains(github.event.head_commit.message, '[legacy-recovery-signed]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact signed application source
        run: git diff --exit-code ea5b9b7f447e46fc20744ba8e023a368366f8f25 HEAD -- . ':(exclude).github/**' ':(exclude)docs/**' ':(exclude)v2/app/src/test/**' ':(exclude)v2/app/src/testDebug/**'
      - name: Verify exact signed producer runs
        uses: actions/github-script@v7
        with:
          script: |
            for (const expected of [
              {id: 37365008106, sha: '253225897cf983a53d5647e87f04855d32570134'},
              {id: 37384039800, sha: 'ea5b9b7f447e46fc20744ba8e023a368366f8f25'}
            ]) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: expected.id});
              if (run.head_sha !== expected.sha || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('Exact signed producer has not passed: ' + expected.id);
              }
            }
      - uses: actions/download-artifact@v4
        with:
          name: BaiZe-functional-test+25322589-Paired-Test
          run-id: 37365008106
          github-token: ${{ github.token }}
          path: baseline-30025
      - uses: actions/download-artifact@v4
        with:
          name: BaiZe-functional-test+ea5b9b7f-Paired-Test
          run-id: 37384039800
          github-token: ${{ github.token }}
          path: candidate-30026
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Prepare disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce old migration and verify explicit signed recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/smoke-legacy-protection-recovery.py baseline-30025/*.apk candidate-30026/*.apk 30026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaiZe-Signed-30025-30026-Protection-Recovery
          path: evidence/legacy-protection-upgrade/
          if-no-files-found: warn
          retention-days: 7
