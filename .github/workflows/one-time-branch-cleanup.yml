name: One-time obsolete branch cleanup final pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close superseded PRs and delete unused branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = 'main';

            async function runLimited(items, limit, task) {
              const results = new Array(items.length);
              let next = 0;
              async function worker() {
                while (true) {
                  const index = next++;
                  if (index >= items.length) return;
                  try {
                    results[index] = { ok: true, value: await task(items[index], index) };
                  } catch (error) {
                    results[index] = { ok: false, error };
                  }
                }
              }
              await Promise.all(Array.from({ length: Math.min(limit, items.length || 1) }, worker));
              return results;
            }

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const localPulls = openPulls.filter(
              pull => pull.head.repo && pull.head.repo.full_name === `${owner}/${repo}`
            );

            const comparisons = await runLimited(localPulls, 8, async pull => {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${pull.head.sha}...${defaultBranch}`
              });
              return {
                pull,
                included: ['ahead', 'identical'].includes(comparison.data.status)
              };
            });

            const superseded = [];
            const keep = new Set([defaultBranch]);
            const retainedPulls = [];
            for (let index = 0; index < localPulls.length; index++) {
              const pull = localPulls[index];
              const result = comparisons[index];
              if (result?.ok && result.value.included) {
                superseded.push(pull);
              } else {
                keep.add(pull.head.ref);
                retainedPulls.push(`#${pull.number} ${pull.head.ref}`);
                if (!result?.ok) core.warning(`无法判断 PR #${pull.number}: ${result?.error?.message || '未知错误'}`);
              }
            }

            const closeResults = await runLimited(superseded, 8, async pull => {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                state: 'closed'
              });
              return `#${pull.number} ${pull.head.ref}`;
            });
            const closedPulls = closeResults.filter(v => v.ok).map(v => v.value);
            closeResults.filter(v => !v.ok).forEach(v => core.warning(`关闭历史 PR 失败: ${v.error.message}`));

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const candidates = branches.filter(branch => !keep.has(branch.name));
            const deleteResults = await runLimited(candidates, 8, async branch => {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`
              });
              return branch.name;
            });

            const deleted = deleteResults.filter(v => v.ok).map(v => v.value);
            const failed = deleteResults
              .map((v, index) => ({ result: v, branch: candidates[index].name }))
              .filter(v => !v.result.ok)
              .map(v => `${v.branch}: ${v.result.error.message}`);
            failed.forEach(message => core.warning(`删除失败 ${message}`));

            await core.summary
              .addHeading('白泽分支清理结果')
              .addRaw(`保留分支：${[...keep].map(v => `\`${v}\``).join('、')}\n\n`)
              .addRaw(`关闭历史 PR（${closedPulls.length}）：${closedPulls.length ? closedPulls.join('、') : '无'}\n\n`)
              .addRaw(`删除分支（${deleted.length}）：${deleted.length ? deleted.map(v => `\`${v}\``).join('、') : '无'}\n\n`)
              .addRaw(`保留未合并 PR：${retainedPulls.length ? retainedPulls.join('、') : '无'}\n\n`)
              .addRaw(`失败（${failed.length}）：${failed.length ? failed.join('；') : '无'}\n`)
              .write();

            core.setOutput('deleted_count', deleted.length);
            core.setOutput('closed_pr_count', closedPulls.length);
            core.setOutput('failed_count', failed.length);
            if (failed.length) core.setFailed(`有 ${failed.length} 个分支删除失败`);
