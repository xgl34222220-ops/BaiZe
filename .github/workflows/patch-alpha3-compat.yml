name: Patch Alpha 3 Android compatibility

on:
  push:
    branches: [v2-alpha3]
    paths:
      - '.github/workflows/patch-alpha3-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha3
      - name: Patch Android compatible report writer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeRootService.kt')
          text = path.read_text()
          old = 'Files.writeString(temporary, report)'
          new = 'Files.write(temporary, report.toByteArray(Charsets.UTF_8))'
          if old not in text:
              raise SystemExit('target line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeRootService.kt
          git commit -m 'Fix Alpha 3 report writing on Android'
          git push origin HEAD:v2-alpha3
