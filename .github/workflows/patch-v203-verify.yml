name: Patch v2.0.3 verification symbol

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/patch-v203-verify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
          fetch-depth: 0
      - name: Correct dialog verification and commit
        run: |
          set -euo pipefail
          sed -i 's/NumberInputDialog/IntValueDialog/' .github/workflows/v2.0.3-real-compose-scheduler.yml
          rm -f .github/workflows/patch-v203-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows
          git commit -m 'ci(v2): verify the actual scheduler dialog symbol'
          git push origin HEAD:fix/v2.0.1-app-scheduler-takeover
