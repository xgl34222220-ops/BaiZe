name: Prepare BaiZe v2.5.6 Release

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-v2.5.6.yml'
      - 'v2/scripts/prepare-release-v2.5.6-stage.py'
      - 'v2/scripts/run-prepare-release-v2.5.6.sh'

permissions:
  contents: write

concurrency:
  group: prepare-baize-v256-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.head_ref == 'release/v2.5.6'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.5.6
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare immutable release content
        run: bash v2/scripts/run-prepare-release-v2.5.6.sh
