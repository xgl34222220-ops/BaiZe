name: Prepare BaiZe v2.5.6 Release

on:
  push:
    branches:
      - release/v2.5.6
    paths:
      - '.github/workflows/prepare-v2.5.6.yml'

permissions:
  contents: write

concurrency:
  group: prepare-baize-v256
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.5.6
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare immutable release
        run: python3 v2/scripts/prepare-release-v2.5.6.py
