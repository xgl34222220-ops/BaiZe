name: BaiZe Signed Protection Trash Upgrade

on:
  push:
    branches: [codex/baize-safety-scan-20260930]

permissions:
  contents: read
  actions: read

concurrency:
  group: baize-protection-trash-signed-${{ github.sha }}
  cancel-in-progress: false

jobs:
  signed-upgrade:
    if: contains(github.event.head_commit.message, '[protection-trash-signed]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact signed application source
        run: git diff --exit-code 253225897cf983a53d5647e87f04855d32570134 HEAD -- . ':(exclude).github/**' ':(exclude)docs/**'
      - name: Verify exact signed producer runs
        uses: actions/github-script@v7
        with:
          script: |
            for (const expected of [
              {id: 37175574045, sha: '251da038f95feb4b959ed245dd6dea26fc98b4d4'},
              {id: 37365008106, sha: '253225897cf983a53d5647e87f04855d32570134'}
            ]) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: expected.id});
              if (run.head_sha !== expected.sha || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('Exact signed producer has not passed: ' + expected.id);
              }
            }
      - uses: actions/download-artifact@v4
        with:
          name: BaiZe-functional-test+251da038-Paired-Test
          run-id: 37175574045
          github-token: ${{ github.token }}
          path: baseline-30024
      - uses: actions/download-artifact@v4
        with:
          name: BaiZe-functional-test+25322589-Paired-Test
          run-id: 37365008106
          github-token: ${{ github.token }}
          path: candidate-30025
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Prepare disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Direct signed upgrade and actual trash-screen navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/smoke-protection-trash-upgrade.py baseline-30024/*.apk candidate-30025/*.apk 30025
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaiZe-Signed-30024-30025-Trash-Upgrade
          path: evidence/signed-trash-upgrade/
          if-no-files-found: warn
          retention-days: 7
