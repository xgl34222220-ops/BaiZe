name: Report BaiZe v2.5.7 Release Status

on:
  push:
    branches:
      - main
    paths:
      - '.github/report-v2.5.7.trigger'

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read release workflow status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow v2.5.7-release.yml \
            --limit 1 \
            --json databaseId,status,conclusion,headSha,displayTitle,createdAt,updatedAt,url \
            > .github/release-v2.5.7.workflow-status.json
          test "$(python3 -c 'import json; print(len(json.load(open(".github/release-v2.5.7.workflow-status.json"))))')" -eq 1

      - name: Commit status snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/release-v2.5.7.workflow-status.json
          git commit -m 'ci: record BaiZe v2.5.7 release workflow status'
          git push origin HEAD:main
