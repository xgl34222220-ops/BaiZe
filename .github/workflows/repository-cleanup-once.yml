name: Repository Cleanup Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only v2.4.0 release, tag, and main branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowPath = '.github/workflows/repository-cleanup-once.yml';

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            if (defaultBranch !== 'main') {
              core.setFailed(`Safety check failed: default branch is ${defaultBranch}, expected main.`);
              return;
            }

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            const keep = releases.filter((release) =>
              !release.draft &&
              !release.prerelease &&
              String(release.tag_name || '').replace(/^v/i, '') === '2.4.0'
            );
            if (keep.length !== 1) {
              core.setFailed(`Safety check failed: expected exactly one formal v2.4.0 release, found ${keep.length}.`);
              return;
            }

            const keepRelease = keep[0];
            const keepTag = keepRelease.tag_name;
            core.info(`Keeping release ${keepRelease.name || keepTag} (${keepTag}).`);

            for (const release of releases) {
              if (release.id === keepRelease.id) continue;
              core.info(`Deleting release ${release.name || release.tag_name}.`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            }

            const tags = await github.paginate(
              github.rest.repos.listTags,
              { owner, repo, per_page: 100 }
            );
            for (const tag of tags) {
              if (tag.name === keepTag) continue;
              core.info(`Deleting tag ${tag.name}.`);
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag.name}` });
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error;
                core.warning(`Tag ${tag.name} was already absent or could not be deleted: ${error.message}`);
              }
            }

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            for (const branch of branches) {
              if (branch.name === defaultBranch) continue;
              core.info(`Deleting branch ${branch.name}.`);
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
            }

            const workflow = await github.rest.repos.getContent({
              owner,
              repo,
              path: workflowPath,
              ref: defaultBranch
            });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path: workflowPath,
              message: 'chore: remove temporary repository cleanup workflow',
              sha: workflow.data.sha,
              branch: defaultBranch
            });

            core.info('Repository cleanup completed successfully.');
