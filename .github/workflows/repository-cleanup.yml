name: BaiZe Repository Cleanup

on:
  push:
    branches: [main]
    paths: ['.github/cleanup.publish']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: baize-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release, archive exact branch tips, then remove unused branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST=.github/cleanup.publish
          VERSION=$(jq -r '.version' "$MANIFEST")
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(jq -r '.version' update.json)" = "$VERSION"
          gh release view "$VERSION" --json isDraft,isPrerelease,assets > /tmp/release.json
          jq -e '.isDraft == false and .isPrerelease == false' /tmp/release.json
          jq -e --arg name "BaiZe-$VERSION-Module.zip" 'any(.assets[]; .name == $name)' /tmp/release.json
          jq -e --arg name "BaiZe-$VERSION.apk" 'any(.assets[]; .name == $name)' /tmp/release.json
          git fetch origin main downloads --tags
          git merge-base --is-ancestor "$VERSION^{commit}" origin/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].head.ref' > /tmp/open-pr-branches
          jq -r '.branches[] | [.name, .sha] | @tsv' "$MANIFEST" > /tmp/branches.tsv
          while IFS=$'\t' read -r branch sha; do
            case "$branch" in main|downloads|'') echo "Refusing essential branch: $branch"; exit 1 ;; esac
            git check-ref-format "refs/heads/$branch"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            if grep -Fxq "$branch" /tmp/open-pr-branches; then
              echo "Branch still has an open PR: $branch"; exit 1
            fi
            actual=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            if [ -z "$actual" ]; then continue; fi
            test "$actual" = "$sha"
            archive="refs/tags/archive/$VERSION/$branch"
            existing=$(git ls-remote --tags origin "$archive" | awk '{print $1}')
            if [ -n "$existing" ]; then
              test "$existing" = "$sha"
            else
              git push origin "$sha:$archive"
            fi
            # Lease makes deletion fail if anyone advances the branch after the check.
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
            printf '%s\n' "Removed $branch; preserved $sha at $archive" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/branches.tsv
          git ls-remote --heads origin
