name: Restore History Details

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign

permissions:
  contents: write

concurrency:
  group: restore-history-details
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dual-theme-ui-redesign
          fetch-depth: 0

      - name: Restore application and task details
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          material = Path('v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/material/HistoryScreenMaterial.kt')
          miuix = Path('v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          m = material.read_text()
          m = replace_once(m, 'import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.clickable\n', 'material clickable import')
          m = replace_once(m, 'import androidx.compose.material.icons.Icons\n', 'import androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.rounded.Apps\n', 'material apps icon')
          m = replace_once(m, 'import androidx.compose.material.icons.rounded.DeleteOutline\n', 'import androidx.compose.material.icons.rounded.DeleteOutline\nimport androidx.compose.material.icons.rounded.ExpandLess\nimport androidx.compose.material.icons.rounded.ExpandMore\nimport androidx.compose.material.icons.rounded.Folder\n', 'material expand icons')
          m = replace_once(m, 'import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.saveable.rememberSaveable\nimport androidx.compose.runtime.setValue\n', 'material state imports')
          m = replace_once(m, 'import io.github.xgl34222220.baize.HistoryUiItem\n', 'import io.github.xgl34222220.baize.AppJunkUiItem\nimport io.github.xgl34222220.baize.GeneralJunkUiItem\nimport io.github.xgl34222220.baize.HistoryUiItem\n', 'material model imports')
          m = replace_once(m, 'import io.github.xgl34222220.baize.ui.history.HistoryUiActions\n', 'import io.github.xgl34222220.baize.ui.common.AppPackageIcon\nimport io.github.xgl34222220.baize.ui.history.HistoryUiActions\n', 'material icon import')

          m = replace_once(
              m,
              '        item { MaterialCurrentResult(state) }\n        item { MaterialSectionHeader("任务记录", "按执行时间倒序排列") }',
              '''        item { MaterialCurrentResult(state) }
        if (state.recentApps.isNotEmpty()) {
            item { MaterialSectionHeader("应用垃圾", "点击应用查看清理分类与路径") }
            item { MaterialAppResultGroup(state.recentApps) }
        }
        if (state.recentJunk.isNotEmpty()) {
            item { MaterialSectionHeader("其他垃圾", "本次任务处理的非应用垃圾") }
            item { MaterialJunkResultGroup(state.recentJunk) }
        }
        item { MaterialSectionHeader("任务记录", "点击有明细的任务可展开查看") }''',
              'material screen sections'
          )

          old_preview = '''            val details = buildList {
                addAll(state.recentApps.take(2).map { it.label.ifBlank { it.packageName } to it.bytes })
                addAll(state.recentJunk.take(2).map { it.name to it.bytes })
            }
            details.forEach { (label, bytes) ->
                Spacer(Modifier.height(12.dp))
                HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant.copy(alpha = .60f))
                Spacer(Modifier.height(12.dp))
                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text(label, modifier = Modifier.weight(1f), maxLines = 1, overflow = TextOverflow.Ellipsis)
                    Text(
                        Formatter.formatFileSize(context, bytes),
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                        style = MaterialTheme.typography.bodySmall
                    )
                }
            }
'''
          m = replace_once(m, old_preview, '', 'material remove two-item preview')

          material_helpers = r'''
@Composable
private fun MaterialAppResultGroup(apps: List<AppJunkUiItem>) {
    Card(
        modifier = Modifier.padding(horizontal = 20.dp).fillMaxWidth(),
        shape = MaterialTheme.shapes.large,
        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceContainerLow),
        elevation = CardDefaults.cardElevation(defaultElevation = 0.dp)
    ) {
        apps.forEachIndexed { index, item ->
            MaterialAppResultRow(item)
            if (index != apps.lastIndex) {
                HorizontalDivider(
                    modifier = Modifier.padding(start = 68.dp),
                    color = MaterialTheme.colorScheme.outlineVariant.copy(alpha = .60f)
                )
            }
        }
    }
}

@Composable
private fun MaterialAppResultRow(item: AppJunkUiItem) {
    val context = LocalContext.current
    var expanded by rememberSaveable(item.packageName, item.category) { mutableStateOf(false) }
    val hasDetails = item.categories.isNotEmpty()
    Column(
        modifier = Modifier
            .fillMaxWidth()
            .clickable(enabled = hasDetails) { expanded = !expanded }
            .padding(horizontal = 16.dp, vertical = 14.dp)
    ) {
        Row(verticalAlignment = Alignment.CenterVertically) {
            AppPackageIcon(
                packageName = item.packageName,
                label = item.label.ifBlank { item.packageName },
                size = 40.dp,
                corner = 12.dp
            )
            Spacer(Modifier.width(12.dp))
            Column(Modifier.weight(1f)) {
                Text(
                    item.label.ifBlank { item.packageName },
                    style = MaterialTheme.typography.titleMedium,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis
                )
                Text(
                    item.category.ifBlank { item.packageName },
                    color = MaterialTheme.colorScheme.onSurfaceVariant,
                    style = MaterialTheme.typography.bodySmall,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis
                )
            }
            Column(horizontalAlignment = Alignment.End) {
                Text(
                    Formatter.formatFileSize(context, item.bytes),
                    color = MaterialTheme.colorScheme.primary,
                    style = MaterialTheme.typography.labelLarge
                )
                Text("${item.files} 项", color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodySmall)
            }
            if (hasDetails) {
                Spacer(Modifier.width(6.dp))
                Icon(
                    if (expanded) Icons.Rounded.ExpandLess else Icons.Rounded.ExpandMore,
                    contentDescription = if (expanded) "收起应用明细" else "展开应用明细",
                    tint = MaterialTheme.colorScheme.onSurfaceVariant
                )
            }
        }
        if (expanded && hasDetails) {
            Spacer(Modifier.height(12.dp))
            HorizontalDivider(color = MaterialTheme.colorScheme.outlineVariant.copy(alpha = .60f))
            item.categories.forEach { detail ->
                Row(
                    modifier = Modifier.fillMaxWidth().padding(start = 52.dp, top = 10.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Column(Modifier.weight(1f)) {
                        Text(detail.name, style = MaterialTheme.typography.labelLarge)
                        Text(
                            detail.samplePath.ifBlank { "未记录示例路径" },
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                            style = MaterialTheme.typography.bodySmall,
                            maxLines = 2,
                            overflow = TextOverflow.Ellipsis
                        )
                    }
                    Text(
                        "${detail.files} 项 · ${Formatter.formatFileSize(context, detail.bytes)}",
                        color = MaterialTheme.colorScheme.primary,
                        style = MaterialTheme.typography.bodySmall
                    )
                }
            }
        }
    }
}

@Composable
private fun MaterialJunkResultGroup(items: List<GeneralJunkUiItem>) {
    val context = LocalContext.current
    Card(
        modifier = Modifier.padding(horizontal = 20.dp).fillMaxWidth(),
        shape = MaterialTheme.shapes.large,
        colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceContainerLow),
        elevation = CardDefaults.cardElevation(defaultElevation = 0.dp)
    ) {
        items.forEachIndexed { index, item ->
            Row(
                modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 14.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Surface(
                    modifier = Modifier.size(40.dp),
                    shape = MaterialTheme.shapes.medium,
                    color = MaterialTheme.colorScheme.secondaryContainer
                ) {
                    Box(contentAlignment = Alignment.Center) {
                        Icon(Icons.Rounded.Folder, contentDescription = null, tint = MaterialTheme.colorScheme.onSecondaryContainer)
                    }
                }
                Spacer(Modifier.width(12.dp))
                Column(Modifier.weight(1f)) {
                    Text(item.name, style = MaterialTheme.typography.titleMedium)
                    Text(
                        item.samplePath.ifBlank { "未记录示例路径" },
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                        style = MaterialTheme.typography.bodySmall,
                        maxLines = 1,
                        overflow = TextOverflow.Ellipsis
                    )
                }
                Column(horizontalAlignment = Alignment.End) {
                    Text(Formatter.formatFileSize(context, item.bytes), color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.labelLarge)
                    Text("${item.files} 项", color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodySmall)
                }
            }
            if (index != items.lastIndex) {
                HorizontalDivider(modifier = Modifier.padding(start = 68.dp), color = MaterialTheme.colorScheme.outlineVariant.copy(alpha = .60f))
            }
        }
    }
}

