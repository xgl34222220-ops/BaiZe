name: Restore History Details

on:
  push:
    branches:
      - agent/dual-theme-ui-redesign

permissions:
  contents: write

concurrency:
  group: restore-history-details
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dual-theme-ui-redesign
          fetch-depth: 0

      - name: Restore application and task details
        run: python3 .github/restore_history_details.py

      - name: Validate source changes
        run: git diff --check

      - name: Commit restored history details
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-history-details.yml
          rm -f .github/restore_history_details.py
          rm -f .github/ui-history-details-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ui: restore application and task history details'
          git push origin HEAD:agent/dual-theme-ui-redesign
