name: BaiZe Stable Release

on:
  push:
    branches: [main]
    paths: ['.github/release.publish']

permissions:
  contents: write

concurrency:
  group: baize-stable-release
  cancel-in-progress: false

env:
  BAIZE_CERT_SHA256: 9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release source
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(tr -d '[:space:]' < .github/release.publish)
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TARGET" HEAD
          git checkout --detach "$TARGET"
          VERSION=$(sed -n 's/^version=//p' module.prop)
          CODE=$(sed -n 's/^versionCode=//p' module.prop)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[0-9]+$ ]]
          cmp module.prop v2/module/module.prop
          grep -Fq "versionName = \"${VERSION#v}\"" v2/app/build.gradle.kts
          grep -Fq "versionCode = $CODE" v2/app/build.gradle.kts
          test -s "RELEASE_NOTES_$VERSION.md"
          echo "BAIZE_RELEASE_TARGET_SHA=$TARGET" >> "$GITHUB_ENV"
          echo "BAIZE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BAIZE_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          # Select the toolchain from the checked-out target, retaining historical releases.
          if grep -Eq 'version "9\.3\.' v2/build.gradle.kts; then
            echo 'BAIZE_GRADLE_VERSION=9.5.0' >> "$GITHUB_ENV"
          else
            echo 'BAIZE_GRADLE_VERSION=8.13' >> "$GITHUB_ENV"
          fi

      - name: Install compatibility tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static toybox

      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in cleaner.sh notify.sh v2/module/*.sh v2/scripts/*.sh; do
            sh -n "$script"
            busybox ash -n "$script"
          done
          for script in v2/tests/*.sh; do bash -n "$script"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set +o pipefail
          # AGP resolves any newer compile platform from the source configuration.
          yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.BAIZE_GRADLE_VERSION }}

      - name: Prepare formal signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BAIZE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.BAIZE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BAIZE_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.BAIZE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          normalize_secret() {
            secret_name=$1
            raw_value=$2
            value=$(printf '%s' "$raw_value" | tr -d '\r\n')
            value=$(printf '%s' "$value" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            case "$value" in "$secret_name="*) value=${value#*=} ;; esac
            case "$value" in
              \"*\") value=${value#\"}; value=${value%\"} ;;
              \'*\') value=${value#\'}; value=${value%\'} ;;
            esac
            printf '%s' "$value"
          }
          KEYSTORE_BASE64=$(normalize_secret BAIZE_KEYSTORE_BASE64 "$KEYSTORE_BASE64_RAW" | tr -d '[:space:]')
          KEYSTORE_PASSWORD=$(normalize_secret BAIZE_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD_RAW")
          KEY_ALIAS=$(normalize_secret BAIZE_KEY_ALIAS "$KEY_ALIAS_RAW")
          KEY_PASSWORD=$(normalize_secret BAIZE_KEY_PASSWORD "$KEY_PASSWORD_RAW")
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/baize-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          ACTUAL_CERT=$(keytool -exportcert -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -rfc | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$BAIZE_CERT_SHA256"
          {
            echo "BAIZE_KEYSTORE_PATH=$KEYSTORE"
            echo "BAIZE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BAIZE_KEY_ALIAS=$KEY_ALIAS"
            echo "BAIZE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build native engines
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Test and build signed App
        working-directory: v2
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease

      - name: Run core regression and package module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ZIP="v2/dist/BaiZe-$BAIZE_VERSION-Module.zip"
          APK=v2/app/build/outputs/apk/release/app-release.apk
          CERT="v2/dist/BaiZe-$BAIZE_VERSION-signing-certificate.txt"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop > "$RUNNER_TEMP/packaged-module.prop"
          cmp module.prop "$RUNNER_TEMP/packaged-module.prop"
          unzip -p "$ZIP" app/baize.apk > "$RUNNER_TEMP/packaged.apk"
          cmp "$APK" "$RUNNER_TEMP/packaged.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$CERT"
          APK_CERT=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' "$CERT" | tr -d ':[:space:]')
          test "$APK_CERT" = "$BAIZE_CERT_SHA256"
          cp "$APK" "v2/dist/BaiZe-$BAIZE_VERSION.apk"
          cd v2/dist
          sha256sum "BaiZe-$BAIZE_VERSION-Module.zip" > "BaiZe-$BAIZE_VERSION-Module.zip.sha256"
          sha256sum "BaiZe-$BAIZE_VERSION.apk" > "BaiZe-$BAIZE_VERSION.apk.sha256"
          sha256sum -c "BaiZe-$BAIZE_VERSION-Module.zip.sha256"
          sha256sum -c "BaiZe-$BAIZE_VERSION.apk.sha256"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-${{ env.BAIZE_VERSION }}-Verified-Release
          path: v2/dist/*
          if-no-files-found: error

      - name: Publish download mirror and formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main downloads
          # A newer release request supersedes this build before any asset is published.
          test "$(git show origin/main:.github/release.publish | tr -d '[:space:]')" = "$BAIZE_RELEASE_TARGET_SHA"
          git worktree add "$RUNNER_TEMP/baize-downloads" origin/downloads
          DEST="$RUNNER_TEMP/baize-downloads/releases/$BAIZE_VERSION"
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp v2/dist/* "$DEST/"
          git -C "$RUNNER_TEMP/baize-downloads" add -f "releases/$BAIZE_VERSION"
          git -C "$RUNNER_TEMP/baize-downloads" commit -m "release: verified $BAIZE_VERSION downloads"
          git -C "$RUNNER_TEMP/baize-downloads" push origin HEAD:downloads
          gh release create "$BAIZE_VERSION" v2/dist/* \
            --target "$BAIZE_RELEASE_TARGET_SHA" \
            --title "白泽 $BAIZE_VERSION" \
            --notes-file "RELEASE_NOTES_$BAIZE_VERSION.md" \
            --latest

      - name: Enable OTA after published assets are verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFIED="$RUNNER_TEMP/published-release"
          gh release download "$BAIZE_VERSION" --dir "$VERIFIED"
          (
            cd "$VERIFIED"
            sha256sum -c "BaiZe-$BAIZE_VERSION-Module.zip.sha256"
            sha256sum -c "BaiZe-$BAIZE_VERSION.apk.sha256"
          )
          for name in "BaiZe-$BAIZE_VERSION-Module.zip" "BaiZe-$BAIZE_VERSION.apk"; do
            cmp "v2/dist/$name" "$VERIFIED/$name"
            cmp "$RUNNER_TEMP/baize-downloads/releases/$BAIZE_VERSION/$name" "$VERIFIED/$name"
          done
          git fetch origin main downloads
          test "$(git rev-parse origin/downloads)" = "$(git -C "$RUNNER_TEMP/baize-downloads" rev-parse HEAD)"
          OTA="$RUNNER_TEMP/baize-ota"
          git worktree add "$OTA" origin/main
          cd "$OTA"
          test "$(tr -d '[:space:]' < .github/release.publish)" = "$BAIZE_RELEASE_TARGET_SHA"
          grep -Fxq "version=$BAIZE_VERSION" module.prop
          sh v2/scripts/sync-version.sh --source-only --check
          sh v2/scripts/sync-version.sh
          sh v2/scripts/sync-version.sh --check
          test "$(git diff --name-only)" = update.json
          git add update.json
          git commit -m "release: 签名产物和镜像验证后启用 $BAIZE_VERSION OTA"
          git push origin HEAD:main

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-Release-Diagnostics
          path: |
            v2/app/build/reports
            v2/dist
          if-no-files-found: ignore
