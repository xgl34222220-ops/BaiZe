name: Replace BaiZe 3.0.0 Formal Release
on:
  push:
    branches: [main]
    paths: ['.github/rebuild-stable.publish']
permissions:
  contents: write
concurrency:
  group: baize-stable-release
  cancel-in-progress: false
env:
  BAIZE_CERT_SHA256: 9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve authorized replacement source
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(tr -d '[:space:]' < .github/rebuild-stable.publish)
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TARGET" HEAD
          git checkout --detach "$TARGET"
          grep -Fxq 'version=v3.0.0' module.prop
          grep -Fxq 'versionCode=30002' module.prop
          sh v2/scripts/sync-version.sh --source-only --check
          echo "BAIZE_RELEASE_TARGET_SHA=$TARGET" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install packaging and native tools
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y busybox-static toybox
          sdkmanager 'ndk;27.2.12479018' 'build-tools;36.0.0'
      - name: Prepare and verify original formal signing key
        env:
          BAIZE_KEYSTORE_BASE64: ${{ secrets.BAIZE_KEYSTORE_BASE64 }}
          BAIZE_KEYSTORE_PASSWORD: ${{ secrets.BAIZE_KEYSTORE_PASSWORD }}
          BAIZE_KEY_ALIAS: ${{ secrets.BAIZE_KEY_ALIAS }}
          BAIZE_KEY_PASSWORD: ${{ secrets.BAIZE_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare-formal-signing.py
      - name: Build native engines
        working-directory: v2
        run: sh scripts/build-native.sh
      - name: Verify all JVM tests, lint and signed App
        working-directory: v2
        shell: bash
        run: |
          set +e
          gradle --no-daemon --continue :app:test :app:assembleRelease :app:lintDebug :app:lintRelease :macrobenchmark:assemble > "$RUNNER_TEMP/baize-formal-rebuild.log" 2>&1
          status=$?
          tail -n 160 "$RUNNER_TEMP/baize-formal-rebuild.log"
          exit "$status"
      - name: Retain signed candidate and mapping for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-30002-Signed-Candidate
          path: |
            v2/app/build/outputs/apk/release/app-release.apk
            v2/app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 7
      - name: Prepare original APK and KVM for final-package startup tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/baize-startup-baseline"
          gh release download v3.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'BaiZe-v3.0.0.apk' --dir "$RUNNER_TEMP/baize-startup-baseline"
          echo "BAIZE_BASELINE_APK=$RUNNER_TEMP/baize-startup-baseline/BaiZe-v3.0.0.apk" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the final signed APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: python3 .github/scripts/smoke-release-apk.py v2/app/build/outputs/apk/release/app-release.apk 30002
      - name: Run complete core regression and package module
        working-directory: v2
        run: sh scripts/package-module.sh
      - name: Verify signed APK and embedded module payload
        shell: bash
        run: |
          set -euo pipefail
          APK=v2/app/build/outputs/apk/release/app-release.apk
          ZIP=v2/dist/BaiZe-v3.0.0-Module.zip
          CERT=v2/dist/BaiZe-v3.0.0-signing-certificate.txt
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop > "$RUNNER_TEMP/rebuild-module.prop"
          cmp module.prop "$RUNNER_TEMP/rebuild-module.prop"
          unzip -p "$ZIP" app/baize.apk > "$RUNNER_TEMP/rebuild-embedded.apk"
          cmp "$APK" "$RUNNER_TEMP/rebuild-embedded.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$CERT"
          ACTUAL=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' "$CERT" | tr -d ':[:space:]')
          test "$ACTUAL" = "$BAIZE_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/rebuild-badging.txt"
          grep -q "versionCode='30002'" "$RUNNER_TEMP/rebuild-badging.txt"
          grep -q "versionName='3.0.0'" "$RUNNER_TEMP/rebuild-badging.txt"
          cp "$APK" v2/dist/BaiZe-v3.0.0.apk
          cd v2/dist
          sha256sum BaiZe-v3.0.0-Module.zip > BaiZe-v3.0.0-Module.zip.sha256
          sha256sum BaiZe-v3.0.0.apk > BaiZe-v3.0.0.apk.sha256
          sha256sum -c BaiZe-v3.0.0-Module.zip.sha256
          sha256sum -c BaiZe-v3.0.0.apk.sha256
      - name: Retain verified formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v3.0.0-build30002-Formal
          path: v2/dist/*
          if-no-files-found: error
      - name: Backup existing release before replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/replace-formal-release.py backup
      - name: Retain rollback assets
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v3.0.0-build30001-Rollback
          path: ${{ runner.temp }}/baize-formal-rollback/
          if-no-files-found: error
          retention-days: 30
      - name: Replace verified release, mirror and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/replace-formal-release.py publish
      - name: Advance OTA only after release verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          OTA="$RUNNER_TEMP/baize-formal-ota"
          git worktree add "$OTA" origin/main
          cd "$OTA"
          test "$(tr -d '[:space:]' < .github/rebuild-stable.publish)" = "$BAIZE_RELEASE_TARGET_SHA"
          grep -Fxq 'versionCode=30002' module.prop
          sh v2/scripts/sync-version.sh --source-only --check
          sh v2/scripts/sync-version.sh
          sh v2/scripts/sync-version.sh --check
          test "$(git diff --name-only)" = update.json
          git add update.json
          git commit -m 'release: enable startup-verified 3.0.0 repair OTA (30002)'
          git push origin HEAD:main
      - name: Retain release receipt and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v3.0.0-30002-Evidence
          path: |
            ${{ runner.temp }}/baize-formal-rebuild.log
            ${{ runner.temp }}/baize-formal-receipt.json
            ${{ runner.temp }}/baize-apk-startup/
            v2/app/build/reports/ui-screenshots/*.png
            v2/app/build/test-results/**/*.xml
            v2/app/build/reports/lint-results-*.txt
          if-no-files-found: warn
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/baize-formal.jks" "$RUNNER_TEMP/baize-formal.der"
