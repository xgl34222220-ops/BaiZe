name: Stage Seven Bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/rule-pack-management
          fetch-depth: 0

      - name: Apply stage seven integration
        run: python3 v2/tools/apply_stage7.py

      - name: Commit target branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f v2/tools/apply_stage7.py .github/workflows/stage7-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(rules): integrate signed rule pack management"
          git push origin HEAD:agent/rule-pack-management

      - name: Remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          git rm -f .github/workflows/stage7-bootstrap.yml
          git commit -m "chore: remove stage seven bootstrap workflow"
          git push origin main
