name: Unified Root Kotlin diagnostics

on:
  push:
    branches: [refactor/unified-root-tasks]
    paths:
      - '.github/workflows/unified-root-compile-diagnostics.yml'
      - '.diagnostics/unified-root-compile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baize-unified-root-kotlin-diagnostics
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile release Kotlin
        id: compile
        working-directory: v2
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon :app:compileReleaseKotlin 2>&1 | tee kotlin-compile.log
          code=${PIPESTATUS[0]}
          grep -E '(^e: | error: |Exception|FAILURE:)' kotlin-compile.log > kotlin-errors.txt || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-root-kotlin-diagnostics
          if-no-files-found: error
          path: |
            v2/kotlin-compile.log
            v2/kotlin-errors.txt
