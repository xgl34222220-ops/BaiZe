name: Cleanup unified Root refactor materialization

on:
  push:
    branches: [refactor/unified-root-tasks]
    paths:
      - 'tools/unified-root-refactor.ready'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: baize-unified-root-refactor-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/unified-root-tasks
          fetch-depth: 0

      - name: Remove transfer-only files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            tools/unified-root-refactor.part00 \
            tools/unified-root-refactor.part01 \
            tools/unified-root-refactor.part02 \
            tools/unified-root-refactor.part02a \
            tools/unified-root-refactor.part02b \
            tools/unified-root-refactor.part03 \
            tools/unified-root-refactor.part04 \
            tools/unified-root-refactor.ready
          git add -A tools
          git diff --cached --quiet && { echo 'No transfer files remain'; exit 0; }
          git commit -m 'chore: remove unified Root transfer files'
          git push origin HEAD:refactor/unified-root-tasks

      - name: Report cleanup status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh issue comment 94 --repo "$GITHUB_REPOSITORY" --body "BAIZE_UNIFIED_ROOT_CLEANUP run_id=$GITHUB_RUN_ID status=$JOB_STATUS head=$GITHUB_SHA"
