name: BaiZe v2 Alpha

on:
  push:
    branches: [v2-alpha2]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package module bridge
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Upload Alpha artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha2
          path: |
            v2/app/build/outputs/apk/debug/app-debug.apk
            v2/dist/BaiZe-v2-Alpha2-Bridge.zip
