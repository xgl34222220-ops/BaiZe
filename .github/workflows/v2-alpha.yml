name: BaiZe v2 Alpha

on:
  push:
    branches: [v2-alpha5]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        id: app_build
        continue-on-error: true
        working-directory: v2
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-alpha5.log

      - name: Package integrated module
        if: steps.app_build.outcome == 'success'
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify module contains App and rules
        if: steps.app_build.outcome == 'success'
        working-directory: v2
        run: |
          unzip -l dist/BaiZe-v2-Alpha5-Module.zip | grep -q 'app/baize.apk'
          unzip -l dist/BaiZe-v2-Alpha5-Module.zip | grep -q 'app/baize.apk.sha256'
          unzip -l dist/BaiZe-v2-Alpha5-Module.zip | grep -q 'config/deep.rules'
          test "$(unzip -p dist/BaiZe-v2-Alpha5-Module.zip config/deep.rules | sha256sum | awk '{print $1}')" = '73d4c898630a292753adca33298c8aabbf6146debf414b2cabbe6b87d1d5c31c'

      - name: Upload integrated module and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha5
          if-no-files-found: warn
          path: |
            v2/build-alpha5.log
            v2/dist/BaiZe-v2-Alpha5-Module.zip

      - name: Fail when app build failed
        if: steps.app_build.outcome != 'success'
        run: exit 1
