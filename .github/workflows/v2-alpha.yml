name: BaiZe v2 Alpha

on:
  push:
    branches: [v2-alpha14]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 14 branch
        uses: actions/checkout@v4
        with:
          ref: v2-alpha14
          fetch-depth: 0

      - name: Apply Alpha 14 product patch
        if: ${{ hashFiles('v2/scripts/alpha14-source-patch.py') != '' }}
        run: |
          set -o pipefail
          python3 v2/scripts/alpha14-source-patch.py 2>&1 | tee v2/alpha14-patch.log

      - name: Validate all cleaning rules
        run: python3 v2/scripts/validate-rules.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        id: app_build
        continue-on-error: true
        working-directory: v2
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-alpha14.log

      - name: Package integrated module
        if: steps.app_build.outcome == 'success'
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify Alpha 14 whitelist cleaner UI scheduler and rules
        if: steps.app_build.outcome == 'success'
        working-directory: v2
        run: |
          ZIP=dist/BaiZe-v2-Alpha14-Module.zip
          unzip -tq "$ZIP"
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'app/baize.apk.sha256'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha14'
          unzip -p "$ZIP" cleaner.sh | grep -q 'run_installer_temp'
          unzip -p "$ZIP" cleaner.sh | grep -q 'resolve_rule_target'
          unzip -p "$ZIP" cleaner.sh | grep -q 'rule_target_once'
          grep -q 'getInstalledPackageCatalog' app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          grep -q 'installedPackageCatalogJson' app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q 'filterProtected' app/src/main/res/layout/activity_whitelist.xml
          grep -q 'ItemWhitelistAppBinding' app/src/main/java/io/github/xgl34222220/baize/WhitelistActivity.kt
          grep -q 'cleanInstallerTempSwitch' app/src/main/res/layout/activity_dashboard.xml
          grep -q 'installer_temp_days' app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt
          test -f app/src/main/res/values-night/themes.xml
          grep -q 'minimumHeight = dp(84)' app/src/main/java/io/github/xgl34222220/baize/ui/FloatingGlassDock.kt
          grep -q 'Theme.Material3.DayNight.NoActionBar' app/src/main/res/values/themes.xml
          grep -q 'safeRuleSyntax' app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt
          ! grep -q '/data/adb/modules/safesweep/config' app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt
          test "$(unzip -p "$ZIP" config/deep.rules | sha256sum | awk '{print $1}')" = '73d4c898630a292753adca33298c8aabbf6146debf414b2cabbe6b87d1d5c31c'

      - name: Commit verified Alpha 14 sources
        if: steps.app_build.outcome == 'success' && hashFiles('v2/scripts/alpha14-source-patch.py') != ''
        run: |
          rm -f v2/scripts/alpha14-source-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Alpha 14 whitelist cleaner and UI improvements'
          git pull --rebase origin v2-alpha14
          git push origin HEAD:v2-alpha14

      - name: Upload integrated module and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha14
          if-no-files-found: warn
          path: |
            v2/alpha14-patch.log
            v2/build-alpha14.log
            v2/dist/BaiZe-v2-Alpha14-Module.zip

      - name: Fail when app build failed
        if: steps.app_build.outcome != 'success'
        run: exit 1
