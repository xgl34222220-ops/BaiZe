name: BaiZe v2 Alpha 20

on:
  push:
    branches: [v2-alpha20]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha20.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 20 branch
        uses: actions/checkout@v4
        with:
          ref: v2-alpha20
          fetch-depth: 0

      - name: Apply Alpha 20 source patch
        if: ${{ hashFiles('v2/scripts/alpha20-source-patch.py') != '' }}
        run: |
          set -o pipefail
          python3 v2/scripts/alpha20-prepatch.py 2>&1 | tee v2/alpha20-patch.log
          python3 v2/scripts/alpha20-source-patch.py 2>&1 | tee -a v2/alpha20-patch.log

      - name: Validate cleaning rules
        run: python3 v2/scripts/validate-rules.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        id: app_build
        continue-on-error: true
        working-directory: v2
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-alpha20.log

      - name: Package integrated module
        if: steps.app_build.outcome == 'success'
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify Alpha 20 persistent history and MIUIx UI
        if: steps.app_build.outcome == 'success'
        working-directory: v2
        run: |
          ZIP=dist/BaiZe-v2-Alpha20-Module.zip
          unzip -tq "$ZIP"
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha20'
          grep -q 'getTaskHistory' app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          grep -q 'clearTaskHistory' app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          grep -q 'taskHistoryJson' app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q 'historyList' app/src/main/res/layout/activity_dashboard.xml
          grep -q 'historyReleasedText' app/src/main/res/layout/activity_dashboard.xml
          grep -q 'ItemTaskHistoryBinding' app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt
          grep -q '记录由模块持久保存' app/src/main/res/layout/activity_dashboard.xml
          test -f app/src/main/res/layout/item_task_history.xml
          test -f app/src/main/res/values-night/colors.xml
          grep -q '#17202D' app/src/main/res/values/colors.xml
          grep -q '#F4F6FB' app/src/main/res/values-night/colors.xml
          ! grep -q 'bg_app_gradient' app/src/main/res/layout/activity_dashboard.xml
          grep -q '"$TRIGGER" >>"$HISTORY_FILE"' ../cleaner.sh
          grep -q 'ColorDrawable' app/src/main/java/io/github/xgl34222220/baize/Alpha7UiPolish.kt
          ! grep -q 'LiquidBackdropDrawable' app/src/main/java/io/github/xgl34222220/baize/Alpha7UiPolish.kt
          test "$(unzip -p "$ZIP" config/deep.rules | sha256sum | awk '{print $1}')" = '73d4c898630a292753adca33298c8aabbf6146debf414b2cabbe6b87d1d5c31c'

      - name: Commit verified Alpha 20 sources
        if: steps.app_build.outcome == 'success' && hashFiles('v2/scripts/alpha20-source-patch.py') != ''
        run: |
          rm -f v2/scripts/alpha20-source-patch.py
          rm -f v2/scripts/alpha20-prepatch.py
          rm -f v2/scripts/alpha20-build-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Alpha 20 persistent history and MIUIx contrast fixes'
          git pull --rebase origin v2-alpha20
          git push origin HEAD:v2-alpha20

      - name: Upload module and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha20
          if-no-files-found: warn
          path: |
            v2/alpha20-patch.log
            v2/build-alpha20.log
            v2/dist/BaiZe-v2-Alpha20-Module.zip

      - name: Fail when app build failed
        if: steps.app_build.outcome != 'success'
        run: exit 1
