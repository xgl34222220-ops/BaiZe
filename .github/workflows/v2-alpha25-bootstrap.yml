name: Bootstrap BaiZe v2 Alpha 25

on:
  pull_request:
    branches: [v2-alpha24]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.head_ref == 'v2-alpha25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha25
          fetch-depth: 0

      - name: Apply Alpha 25 hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch target not found: {path}\n--- expected ---\n{old}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest = 'v2/app/src/main/AndroidManifest.xml'
          replace_once(
              manifest,
              '''        <service
              android:name=".root.BaiZeProfileRootService"
              android:exported="false" />''',
              '''        <service
              android:name=".root.BaiZeRootService"
              android:exported="false" />
          <service
              android:name=".root.BaiZeProfileRootService"
              android:exported="false" />'''
          )

          activity = 'v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt'
          replace_once(
              activity,
              '''    private fun runPendingCleanIfReady() {
              if (!pendingClean || rootService == null || cacheService == null) return
              pendingClean = false
              runSmartClean()
          }''',
              '''    private fun runPendingCleanIfReady() {
              if (!pendingClean) return
              val snapshotsReady = hasUsableScanSnapshots()
              val requiredEnginesReady = if (snapshotsReady) {
                  (cacheSnapshotId.isBlank() || cacheSnapshotCount <= 0 || cacheService != null) &&
                      (safeSnapshotId.isBlank() || safeSnapshotCount <= 0 || rootService != null)
              } else {
                  rootService != null && cacheService != null
              }
              if (!requiredEnginesReady) return
              pendingClean = false
              runSmartClean()
          }'''
          )
          replace_once(
              activity,
              '''    private fun cleanNativeSnapshots() {
              val cache = cacheService ?: return toast("应用缓存引擎尚未连接")
              val profiles = rootService ?: return toast("分类引擎尚未连接")
              if (dashboardState.value.running) return
              if (!hasUsableScanSnapshots()) {
                  dashboardState.value = dashboardState.value.copy(
                      scanCompleted = false,
                      taskPhase = "没有可用扫描快照，请先执行安全扫描"
                  )
                  toast("扫描结果已失效，请重新扫描")
                  return
              }
              if (schedulerState.value.notifyOnComplete) requestNotificationPermission()''',
              '''    private fun cleanNativeSnapshots() {
              if (dashboardState.value.running) return
              if (!hasUsableScanSnapshots()) {
                  dashboardState.value = dashboardState.value.copy(
                      scanCompleted = false,
                      taskPhase = "没有可用扫描快照，请先执行安全扫描"
                  )
                  toast("扫描结果已失效，请重新扫描")
                  return
              }
              val needsCacheEngine = cacheSnapshotId.isNotBlank() && cacheSnapshotCount > 0
              val needsProfileEngine = safeSnapshotId.isNotBlank() && safeSnapshotCount > 0
              val cacheEngine = cacheService
              val profileEngine = rootService
              if ((needsCacheEngine && cacheEngine == null) || (needsProfileEngine && profileEngine == null)) {
                  pendingClean = true
                  dashboardState.value = dashboardState.value.copy(
                      connected = false,
                      ready = false,
                      serviceText = "扫描快照仍有效，正在重连缺失的 Root 引擎…",
                      taskPhase = "等待引擎重连后继续按扫描结果清理"
                  )
                  connectServices()
                  toast("扫描快照仍有效，正在重连缺失引擎")
                  return
              }
              if (schedulerState.value.notifyOnComplete) requestNotificationPermission()'''
          )
          replace_once(
              activity,
              'JSONObject(cache.cleanSelected(cacheSnapshotId, selection, whitelist))',
              'JSONObject(requireNotNull(cacheEngine).cleanSelected(cacheSnapshotId, selection, whitelist))'
          )
          replace_once(
              activity,
              'JSONObject(profiles.cleanProfileSelected(safeSnapshotId, selection, optionsJson()))',
              'JSONObject(requireNotNull(profileEngine).cleanProfileSelected(safeSnapshotId, selection, optionsJson()))'
          )

          ui = 'v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt'
          replace_once(ui, 'import androidx.compose.foundation.lazy.items', 'import androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.lazy.rememberLazyListState')
          replace_once(ui, 'import androidx.compose.runtime.Composable', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect')
          replace_once(
              ui,
              '''    val context = LocalContext.current
              val accentGradient = rememberAccentGradient()
              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = 126.dp),''',
              '''    val context = LocalContext.current
              val accentGradient = rememberAccentGradient()
              val listState = rememberLazyListState()
              val bottomInset = WindowInsets.navigationBars.asPaddingValues().calculateBottomPadding()
              LaunchedEffect(state.scanCompleted) {
                  if (state.scanCompleted) listState.animateScrollToItem(5)
              }
              LazyColumn(
                  state = listState,
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(bottom = bottomInset + 154.dp),'''
          )
          replace_once(ui, '原生快照清理引擎 · Alpha 24', '原生快照清理引擎 · Alpha 25')
          replace_once(
              ui,
              'Text(if (state.running) "清理任务执行中" else "清理引擎已连接", color = Color.White, fontSize = 27.sp, fontWeight = FontWeight.Black)',
              '''Text(
                      when {
                          state.running -> "清理任务执行中"
                          state.ready -> "清理引擎已就绪"
                          state.connected -> "清理引擎已连接"
                          else -> "正在连接清理引擎"
                      },
                      color = Color.White,
                      fontSize = 27.sp,
                      fontWeight = FontWeight.Black
                  )'''
          )
          replace_once(ui, 'enabled = state.connected,', 'enabled = state.running || state.ready,')
          replace_once(
              ui,
              'Icon(Icons.Rounded.CheckCircle, null, tint = Color.White, modifier = Modifier.size(34.dp))',
              '''Icon(
                          if (state.ready) Icons.Rounded.CheckCircle else Icons.Rounded.Refresh,
                          null,
                          tint = Color.White.copy(alpha = if (state.ready) 1f else .78f),
                          modifier = Modifier.size(34.dp)
                      )'''
          )
          replace_once(ui, 'Text(if (ready) "运行正常" else "待检查", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)', 'Text(if (ready) "运行正常" else "未就绪", fontSize = 11.sp, color = MaterialTheme.colorScheme.primary)')

          replacements = {
              'v2/app/build.gradle.kts': [('versionCode = 20400', 'versionCode = 20500'), ('versionName = "2.0.0-alpha24"', 'versionName = "2.0.0-alpha25"')],
              'v2/module/module.prop': [('version=v2.0.0-alpha24', 'version=v2.0.0-alpha25'), ('versionCode=20400', 'versionCode=20500')],
              'v2/module/customize.sh': [('白泽 v2 Alpha 24', '白泽 v2 Alpha 25')],
              'v2/scripts/package-module.sh': [('BaiZe-v2-Alpha24-Module.zip', 'BaiZe-v2-Alpha25-Module.zip'), ('Alpha 24', 'Alpha 25')],
              'v2/README.md': [('# 白泽 v2 Alpha 24', '# 白泽 v2 Alpha 25'), ('## Alpha 24', '## Alpha 25'), ('BaiZe-v2-Alpha24-Module.zip', 'BaiZe-v2-Alpha25-Module.zip')],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace_once(path, old, new)

          changes = Path('v2/ALPHA25-CHANGES.md')
          if not changes.exists():
              changes.write_text('''# Alpha 25 改动摘要

- 补全 `BaiZeRootService` 的 Manifest 声明，修复应用缓存引擎无法稳定绑定的问题。
- 扫描结果清理只要求对应快照所属的引擎在线；单引擎快照也可直接清理，不再错误提示另一引擎未连接。
- 必需引擎短暂断开时保留 30 分钟快照，自动重连后继续清理，绝不重新全盘扫描。
- 首页连接标题与真实状态同步；引擎未就绪时不再显示“清理引擎已连接”。
- 扫描完成后自动定位结果卡片，并增加动态底部安全间距，避免悬浮导航遮挡按钮与说明。
''', encoding='utf-8')
          PY

      - name: Validate shell and cleaning rules
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha25-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha25'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'

      - name: Commit verified hotfix
        run: |
          printf 'Alpha 25 build verified by GitHub Actions.\n' > v2/ALPHA25-BUILD-OK.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Alpha 25 snapshot engine and result layout'
            git push origin HEAD:v2-alpha25
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha25
          path: v2/dist/BaiZe-v2-Alpha25-Module.zip
