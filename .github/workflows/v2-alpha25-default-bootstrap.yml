name: Bootstrap BaiZe Alpha 25 from main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.head_ref == 'v2-alpha25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha25
          fetch-depth: 0

      - name: Apply Alpha 25 hotfix
        run: python3 v2/scripts/apply-alpha25-hotfix.py

      - name: Validate shell and cleaning rules
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha25-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha25'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'

      - name: Commit verified hotfix
        run: |
          printf 'Alpha 25 build verified by GitHub Actions.\n' > v2/ALPHA25-BUILD-OK.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Alpha 25 snapshot engine and result layout'
            git push origin HEAD:v2-alpha25
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha25
          path: v2/dist/BaiZe-v2-Alpha25-Module.zip
