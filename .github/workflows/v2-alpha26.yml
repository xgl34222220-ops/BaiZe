name: BaiZe v2 Alpha 26

on:
  push:
    branches: [v2-alpha26]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha26.yml'
  pull_request:
    branches: [v2-alpha25]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha26
          fetch-depth: 0

      - name: Apply Alpha 26 recovery refactor
        run: python3 v2/scripts/apply-alpha26-recovery.py

      - name: Validate shell and cleaning rules
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha26-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha26'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha26-verified
          path: |
            v2/dist/BaiZe-v2-Alpha26-Module.zip
            v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
            v2/app/build.gradle.kts
            v2/module/module.prop
            v2/module/customize.sh
            v2/scripts/package-module.sh
            v2/README.md
            v2/ALPHA26-CHANGES.md
