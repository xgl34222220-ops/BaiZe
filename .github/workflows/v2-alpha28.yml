name: BaiZe v2 Alpha 28

on:
  push:
    branches: [v2-alpha28]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha28
          fetch-depth: 0

      - name: Apply Alpha 28 fixes
        run: python3 v2/scripts/apply-alpha28-app-details.py

      - name: Validate shell and cleaning rules
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha28-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha28'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'
          grep -q 'apps-latest.tsv' ../cleaner.sh
          grep -q 'AppJunkCard' app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt

      - name: Commit verified sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cleaner.sh v2
          if ! git diff --cached --quiet; then
            git commit -m 'Fix records crash and add per-app cleanup details'
            git push origin HEAD:v2-alpha28
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha28
          path: v2/dist/BaiZe-v2-Alpha28-Module.zip
