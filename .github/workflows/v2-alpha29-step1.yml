name: BaiZe v2 Alpha 29 Step 1

on:
  push:
    branches: [v2-alpha29]
    paths:
      - 'cleaner.sh'
      - 'v2/app/**'
      - '.github/workflows/v2-alpha29-step1.yml'
  pull_request:
    branches: [v2-alpha28]
    paths:
      - 'cleaner.sh'
      - 'v2/app/**'
      - '.github/workflows/v2-alpha29-step1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha29
          fetch-depth: 0

      - name: Validate cleaner data schema
        run: |
          sh -n cleaner.sh
          grep -q '^APP_ITEMS=' cleaner.sh
          grep -q '^filter_processed_list()' cleaner.sh
          grep -q 'package.*category.*files.*bytes.*errors.*sample_path' cleaner.sh
          grep -q 'app-items-latest.tsv' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q '"categories"' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          python3 - <<'PY'
          from pathlib import Path
          cleaner = Path('cleaner.sh').read_text(encoding='utf-8')
          root = Path('v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt').read_text(encoding='utf-8')
          required = [
              'APP_ITEMS="$REPORT_DIR/app-items-latest.tsv"',
              'PROCESSED_PATHS="$TMP_DIR/processed-paths"',
              'filter_processed_list "$list"',
              'printf \'%s\\t%s\\t%s\\t%s\\t%s\\t%s\\n\'',
          ]
          missing = [item for item in required if item not in cleaner]
          if missing:
              raise SystemExit(f'missing cleaner markers: {missing}')
          for marker in ['"errors"', '"samplePath"', '"categories"']:
              if marker not in root:
                  raise SystemExit(f'missing RootService marker: {marker}')
          print('Alpha 29 app-detail schema validated')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Alpha29-Step1-App
          path: v2/app/build/outputs/apk/debug/app-debug.apk
