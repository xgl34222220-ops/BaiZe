name: BaiZe v2 Alpha 29 Step 2

on:
  push:
    branches: [v2-alpha29]
    paths:
      - 'v2/app/**'
      - '.github/workflows/v2-alpha29-step2.yml'
  pull_request:
    branches: [v2-alpha28]
    paths:
      - 'v2/app/**'
      - '.github/workflows/v2-alpha29-step2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha29
          fetch-depth: 0

      - name: Validate icon loader
        run: |
          grep -q 'object AppIconRepository' v2/app/src/main/java/io/github/xgl34222220/baize/AppIconRepository.kt
          grep -q 'LruCache<String, ImageBitmap>' v2/app/src/main/java/io/github/xgl34222220/baize/AppIconRepository.kt
          grep -q 'withContext(Dispatchers.IO)' v2/app/src/main/java/io/github/xgl34222220/baize/AppIconRepository.kt
          grep -q 'ApplicationIcon(' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'android.permission.QUERY_ALL_PACKAGES' v2/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Alpha29-Step2-App
          path: v2/app/build/outputs/apk/debug/app-debug.apk
