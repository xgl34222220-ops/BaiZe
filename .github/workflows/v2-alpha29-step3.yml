name: BaiZe v2 Alpha 29 Step 3

on:
  push:
    branches: [v2-alpha29]
    paths:
      - 'v2/app/**'
      - '.github/workflows/v2-alpha29-step3.yml'
  pull_request:
    branches: [v2-alpha28]
    paths:
      - 'v2/app/**'
      - '.github/workflows/v2-alpha29-step3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha29
          fetch-depth: 0

      - name: Validate category details
        run: |
          grep -q 'data class AppJunkCategoryUiItem' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'AppJunkCardContent(item)' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'category.optLong("errors"' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'AnimatedVisibility' v2/app/src/main/java/io/github/xgl34222220/baize/AppJunkResultComponents.kt
          grep -q 'friendlyCategory' v2/app/src/main/java/io/github/xgl34222220/baize/AppJunkResultComponents.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Alpha29-Step3-App
          path: v2/app/build/outputs/apk/debug/app-debug.apk
