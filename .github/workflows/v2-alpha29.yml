name: BaiZe v2 Alpha 29

on:
  push:
    branches: [v2-alpha29]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha29.yml'
  pull_request:
    branches: [v2-alpha28]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha29
          fetch-depth: 0

      - name: Apply Alpha 29 final version
        run: |
          if ! grep -q 'versionCode = 20900' v2/app/build.gradle.kts; then
            python3 v2/scripts/apply-alpha29-finalize.py
          else
            echo 'Alpha 29 final sources already committed'
          fi

      - name: Validate shell and cleaning data
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q '^APP_ITEMS=' cleaner.sh
          grep -q '^filter_processed_list()' cleaner.sh
          grep -q 'app-items-latest.tsv' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q 'object AppIconRepository' v2/app/src/main/java/io/github/xgl34222220/baize/AppIconRepository.kt
          grep -q 'data class AppJunkCategoryUiItem' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'CurrentCleanupSummaryContent(state.recentApps)' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'version=v2.0.0-alpha29' v2/module/module.prop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha29-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha29'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -l "$ZIP" | grep -q 'config/deep.rules'
          unzip -p "$ZIP" cleaner.sh | grep -q 'app-items-latest.tsv'
          unzip -p "$ZIP" cleaner.sh | grep -q '^filter_processed_list()'

      - name: Commit verified Alpha 29 sources
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize Alpha 29 application cleanup details and UI'
            git push origin HEAD:v2-alpha29
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha29
          path: v2/dist/BaiZe-v2-Alpha29-Module.zip
