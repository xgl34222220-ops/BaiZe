name: BaiZe v2 Alpha 36 Home Simplify

on:
  push:
    branches: [v2-alpha36-home-simplify]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha36-home-simplify.yml'
  pull_request:
    branches: [v2-alpha35-clean-dual-ui-step1]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha36-home-simplify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha36-home-simplify
          fetch-depth: 0
          show-progress: false

      - name: Apply Alpha 36 home simplification
        run: python3 v2/scripts/apply-alpha36-home-simplify.py

      - name: Validate UI architecture and shell
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'fun MaterialQuickActions' v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt
          grep -q 'fun MiuixHomeQuickAction' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'Material 3 清理概览 · Alpha 36' v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt
          grep -q 'Miuix × Liquid Glass · Alpha 36' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          ! grep -q 'MaterialCategoryGroup' v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt
          grep -q 'version=v2.0.0-alpha36' v2/module/module.prop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha36-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha36'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'

      - name: Commit verified source
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2
          if ! git diff --cached --quiet; then
            git commit -m 'Simplify dual-skin home quick actions'
            git push origin HEAD:v2-alpha36-home-simplify
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha36-Home-Simplify
          path: v2/dist/BaiZe-v2-Alpha36-Module.zip
