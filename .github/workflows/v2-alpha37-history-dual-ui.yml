name: BaiZe v2 Alpha 37 History Dual UI

on:
  push:
    branches: [v2-alpha37-history-dual-ui]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha37-history-dual-ui.yml'
  pull_request:
    branches: [v2-alpha36-home-cleanup]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha37-history-dual-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha37-history-dual-ui
          fetch-depth: 0
          show-progress: false

      - name: Validate UI architecture and shell
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'data class HistoryUiState' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/HistoryContract.kt
          grep -q 'fun HistoryRoute' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/HistoryRoute.kt
          grep -q 'fun HistoryScreenMaterial' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/material/HistoryScreenMaterial.kt
          grep -q 'fun HistoryScreenMiuix' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt
          grep -q 'HistoryRoute(UiStyle.MATERIAL' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'HistoryRoute(UiStyle.MIUIX' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'version=v2.0.0-alpha37' v2/module/module.prop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha37-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha37'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha37-History-Dual-UI
          path: v2/dist/BaiZe-v2-Alpha37-Module.zip
