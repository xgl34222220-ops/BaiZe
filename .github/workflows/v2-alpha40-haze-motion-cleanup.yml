name: BaiZe v2 Alpha 40 Haze Motion Cleanup

on:
  push:
    branches: [v2-alpha40-haze-motion-cleanup]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha40-haze-motion-cleanup.yml'
  pull_request:
    branches: [v2-alpha39-settings-dual-ui]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha40-haze-motion-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha40-haze-motion-cleanup
          fetch-depth: 0
          show-progress: false

      - name: Validate UI architecture and shell
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'dev.chrisbanes.haze:haze:1.6.10' v2/app/build.gradle.kts
          grep -q 'rememberHazeState' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'hazeSource(state = hazeState)' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'fun AnimatedPageHost' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'hazeEffect' v2/app/src/main/java/io/github/xgl34222220/baize/ui/miuix/MiuixLiquidComponents.kt
          ! grep -q 'private fun PlanPage' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          ! grep -q 'private fun LegacyRecordsPage' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          ! grep -q 'private fun SettingsPage' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'version=v2.0.0-alpha40' v2/module/module.prop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha40-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha40'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha40-Haze-Motion-Cleanup
          path: v2/dist/BaiZe-v2-Alpha40-Module.zip
