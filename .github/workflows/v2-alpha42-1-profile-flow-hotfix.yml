name: BaiZe v2 Alpha 42.1 Profile Flow Hotfix

on:
  push:
    branches: [v2-alpha42-1-profile-flow-hotfix]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-1-profile-flow-hotfix.yml'
  pull_request:
    branches: [v2-alpha42-stability-hardening]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-1-profile-flow-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-1-profile-flow-hotfix
          fetch-depth: 0
          show-progress: false

      - name: Validate hotfix architecture and shell
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'recoverRemoteOrLatestState()' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt
          grep -q 'restoreAuthorizedScanResult' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt
          grep -q 'onOpenAudit = onOpenDetails' v2/app/src/main/java/io/github/xgl34222220/baize/ui/logs/LogsRoute.kt
          grep -q 'onOpenAudit = onOpenDetails' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/SettingsRoute.kt
          test "$(grep -c 'page = BaiZePage.Records' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt)" -ge 4
          grep -q 'version=v2.0.0-alpha42.1' v2/module/module.prop
          test ! -e v2/scripts/apply-alpha42-1-profile-flow-hotfix.py
          test ! -e v2/.alpha42-1-source-trigger

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha42.1-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha42.1'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -p "$ZIP" app/baize.apk.sha256 | grep -Eq '^[0-9a-f]{64}$'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha42.1-Profile-Flow-Hotfix
          path: v2/dist/BaiZe-v2-Alpha42.1-Module.zip
