name: BaiZe v2 Alpha 42.2 Auxiliary Compose UI

on:
  push:
    branches: [v2-alpha42-2-compose-aux-ui]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-2-compose-aux-ui.yml'
  pull_request:
    branches: [v2-alpha42-1-profile-flow-hotfix]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-2-compose-aux-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-2-compose-aux-ui
          fetch-depth: 0
          show-progress: false

      - name: Validate auxiliary Compose UI and shell
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'class CleanCenterActivity : ComponentActivity' v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt
          grep -q 'CleanCenterMaterial' v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt
          grep -q 'CleanCenterMiuix' v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt
          grep -q 'class ProfileActivity : ComponentActivity' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt
          grep -q 'ProfileScreenMaterial' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt
          grep -q 'ProfileScreenMiuix' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt
          grep -q 'recoverRemoteOrLatestState()' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt
          grep -q 'version=v2.0.0-alpha42.2' v2/module/module.prop
          ! grep -q 'ActivityCleanCenterBinding' v2/app/src/main/java/io/github/xgl34222220/baize/CleanCenterActivity.kt
          ! grep -q 'ActivityProfileBinding' v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:assembleDebug > /tmp/alpha42-2-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE '(^| )e: |error: |Exception|FAILURE:' /tmp/alpha42-2-build.log | tail -n 180 || true
            tail -n 220 /tmp/alpha42-2-build.log
          fi
          exit "$status"

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha42.2-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha42.2'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -p "$ZIP" app/baize.apk.sha256 | grep -Eq '^[0-9a-f]{64}$'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha42.2-Auxiliary-Compose-UI
          path: v2/dist/BaiZe-v2-Alpha42.2-Module.zip
