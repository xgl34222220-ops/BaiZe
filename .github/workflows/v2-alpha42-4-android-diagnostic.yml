name: BaiZe v2 Alpha 42.4 Android Diagnostic

on:
  push:
    branches: [v2-alpha42-4-native-deep-cache-scanner]
    paths:
      - 'v2/app/**'
      - '.github/workflows/v2-alpha42-4-android-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-4-native-deep-cache-scanner
          show-progress: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Capture Android build
        working-directory: v2
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > /tmp/alpha42-4-gradle.log 2>&1
          code=$?
          tail -n 200 /tmp/alpha42-4-gradle.log
          echo "$code" > /tmp/alpha42-4-gradle.exit
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Alpha42.4-Android-Diagnostic
          path: |
            /tmp/alpha42-4-gradle.log
            /tmp/alpha42-4-gradle.exit
