name: BaiZe v2 Alpha 42.4 Native Deep Cache Scanner

on:
  push:
    branches: [v2-alpha42-4-native-deep-cache-scanner]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-4-native-deep-cache.yml'
  pull_request:
    branches: [v2-alpha42-3-native-corpse-scanner]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-4-native-deep-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-4-native-deep-cache-scanner
          fetch-depth: 0
          show-progress: false

      - name: Validate sources and version
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/cleaner.sh v2/module/customize.sh v2/module/service.sh v2/module/action.sh
          sh -n v2/scripts/build-native.sh v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'version=v2.0.0-alpha42.4' v2/module/module.prop
          grep -q 'versionCode=22240' v2/module/module.prop
          grep -q 'scan-cache' v2/native/baize_engine_42_4.c
          grep -q 'scan-deep' v2/native/baize_engine_42_4.c
          grep -q 'native-c-arm64-cache-v42.4' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeRootService.kt

      - name: Build host native engine
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o /tmp/baize_engine_host

      - name: Test native cache scanner fixture
        run: |
          TEST=/tmp/baize-cache-fixture
          rm -rf "$TEST"
          mkdir -p "$TEST/data/user/0/com.fast.app/cache/sub"
          mkdir -p "$TEST/data/user/0/com.keep.app/cache"
          mkdir -p "$TEST/media/0/Android/data/com.fast.app/code_cache"
          mkdir -p "$TEST/state/reports"
          printf 'abc' > "$TEST/data/user/0/com.fast.app/cache/a"
          printf '12345' > "$TEST/data/user/0/com.fast.app/cache/sub/b"
          printf 'skip' > "$TEST/data/user/0/com.keep.app/cache/x"
          printf 'zz' > "$TEST/media/0/Android/data/com.fast.app/code_cache/c"
          printf 'com.keep.app\n' > "$TEST/state/native-cache-packages.conf"
          printf 'max_file_mb=256\napp_cache_days=0\nexternal_cache_days=0\n' > "$TEST/state/config.conf"
          : > "$TEST/state/whitelist.conf"
          BAIZE_NATIVE_TEST=1 \
          BAIZE_STATE_DIR="$TEST/state" \
          BAIZE_DATA_ROOT="$TEST/data" \
          BAIZE_MEDIA_ROOT="$TEST/media" \
          BAIZE_NATIVE_ENGINE=/tmp/baize_engine_host \
          BAIZE_PACKAGE_WHITELIST="$TEST/state/native-cache-packages.conf" \
            sh v2/module/cleaner.sh cache-scan ci
          grep -q '^engine=native-c-arm64$' "$TEST/state/latest.env"
          grep -q '^regular_files=3$' "$TEST/state/latest.env"
          grep -q '^whitelisted=1$' "$TEST/state/latest.env"
          grep -q 'com.fast.app' "$TEST/state/cache_scan.items.tsv"
          ! grep -q 'com.keep.app' "$TEST/state/cache_scan.items.tsv"

      - name: Test native deep snapshot fixture
        run: |
          TEST=/tmp/baize-deep-fixture
          ROOT=/data/user/99/com.baize.ci
          rm -rf "$TEST" "$ROOT"
          mkdir -p "$TEST/state/reports" "$ROOT/cache/sub" "$ROOT/files"
          printf 'abc' > "$ROOT/cache/a"
          printf '12345' > "$ROOT/cache/sub/b"
          printf 'protected' > "$ROOT/files/user.db"
          printf '%s\n' "$ROOT/cache/*" "$ROOT/files" > "$TEST/deep.rules"
          printf 'max_file_mb=256\ndeep_high_risk_enabled=0\n' > "$TEST/state/config.conf"
          : > "$TEST/state/whitelist.conf"
          BAIZE_NATIVE_TEST=1 \
          BAIZE_STATE_DIR="$TEST/state" \
          BAIZE_NATIVE_ENGINE=/tmp/baize_engine_host \
          BAIZE_DEEP_RULES="$TEST/deep.rules" \
            sh v2/module/cleaner.sh deep-scan ci
          grep -q '^engine=native-c-arm64$' "$TEST/state/latest.env"
          grep -q '^rules_sha=' "$TEST/state/deep_scan.env"
          grep -q "$ROOT/cache" "$TEST/state/deep_scan.targets"
          ! grep -q "$ROOT/files" "$TEST/state/deep_scan.targets"
          grep -q $'protected\thigh\t深度规则' "$TEST/state/reports/latest.tsv"
          rm -rf "$ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build arm64 native engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha42.4-Native-Deep-Cache-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha42.4'
          unzip -p "$ZIP" module.prop | grep -q 'versionCode=22240'
          unzip -l "$ZIP" | grep -q 'cleaner.sh.compat'
          unzip -l "$ZIP" | grep -q 'bin/arm64-v8a/baize_engine'
          unzip -p "$ZIP" bin/arm64-v8a/baize_engine > /tmp/baize_engine_android
          file /tmp/baize_engine_android | grep -q 'ARM aarch64'
          sha256sum "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha42.4-Native-Deep-Cache
          path: v2/dist/BaiZe-v2-Alpha42.4-Native-Deep-Cache-Module.zip
