name: Apply Alpha 42.6 Task Feedback

on:
  push:
    branches: [v2-alpha42-6-unified-snapshot-clean]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-6-unified-snapshot-clean
          fetch-depth: 0

      - name: Apply explicit task feedback
        run: |
          # The dashboard contains two response prefixes with the same first four lines. The utility
          # handler is intentionally the first one, so replace the first deterministic match.
          sed -i 's/if count != 1:/if count < 1:/' v2/scripts/apply-task-feedback.py
          python3 v2/scripts/apply-task-feedback.py

      - name: Commit task feedback
        run: |
          if git diff --quiet; then
            echo "Task feedback already applied"
            exit 0
          fi
          git checkout -- v2/scripts/apply-task-feedback.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/ProfileActivity.kt \
                  v2/app/src/main/java/io/github/xgl34222220/baize/SmartScanActivity.kt
          git commit -m "fix(app): show task feedback instead of silent clicks"
          git push origin HEAD:v2-alpha42-6-unified-snapshot-clean
