name: Apply Alpha 42.8 APK Snapshot Persistence

on:
  push:
    branches: [v2-alpha42-8-snapshot-clean-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-8-snapshot-clean-ui
          fetch-depth: 0

      - name: Persist APK scan authorization snapshot
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('cleaner.sh')
          text = path.read_text()

          anchor = 'CORPSE_SCAN_TARGETS="$STATE_DIR/corpse_scan.targets"\n'
          addition = anchor + 'APK_SCAN_STATE="$STATE_DIR/apk_scan.env"\nAPK_SCAN_TARGETS="$STATE_DIR/apk_scan.targets"\n'
          if 'APK_SCAN_STATE="$STATE_DIR/apk_scan.env"' not in text:
              if anchor not in text:
                  raise SystemExit('APK state variable anchor missing')
              text = text.replace(anchor, addition, 1)

          function_anchor = '''run_apk_packages() {
            [ -d /data/media ] || return 0
            list="$TMP_DIR/apk-packages.nul"
'''
          function_replacement = '''snapshot_sha256() {
            file=$1
            [ -f "$file" ] || { echo missing; return; }
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" 2>/dev/null | awk 'NR==1{print $1}'
            else
              toybox sha256sum "$file" 2>/dev/null | awk 'NR==1{print $1}'
            fi
          }

          run_apk_packages() {
            [ -d /data/media ] || return 0
            if [ "$REQUEST_MODE" = "apk-scan" ] && [ "$MODE" = "scan" ]; then
              rm -f "$APK_SCAN_STATE" "$APK_SCAN_TARGETS"
            fi
            list="$TMP_DIR/apk-packages.nul"
'''
          if 'snapshot_sha256() {' not in text:
              if function_anchor not in text:
                  raise SystemExit('run_apk_packages anchor missing')
              text = text.replace(function_anchor, function_replacement, 1)

          sample_anchor = '''  sample_path=$(first_nul_path "$list" 2>/dev/null)

            if [ "$MODE" = "clean" ]; then
'''
          sample_replacement = '''  sample_path=$(first_nul_path "$list" 2>/dev/null)

            if [ "$REQUEST_MODE" = "apk-scan" ] && [ "$MODE" = "scan" ]; then
              cp -f "$list" "$APK_SCAN_TARGETS"
              targets_sha=$(snapshot_sha256 "$APK_SCAN_TARGETS")
              whitelist_sha=$(snapshot_sha256 "$WHITELIST")
              scan_epoch=$(date +%s)
              snapshot_id="${scan_epoch}-$(printf '%s' "$targets_sha" | cut -c1-16)"
              {
                echo "epoch=$scan_epoch"
                echo "snapshot_id=$snapshot_id"
                echo "targets_sha=$targets_sha"
                echo "whitelist_sha=$whitelist_sha"
                echo "max_file_bytes=$APK_PACKAGE_MAX_BYTES"
                echo "package_days=$APK_PACKAGE_DAYS"
                echo "bytes=$estimated"
                echo "files=$count"
                echo "engine=compat-apk-scan-v42.8"
              } >"$APK_SCAN_STATE"
              chmod 0600 "$APK_SCAN_STATE" "$APK_SCAN_TARGETS" 2>/dev/null
            fi

            if [ "$MODE" = "clean" ]; then
'''
          if 'engine=compat-apk-scan-v42.8' not in text:
              if sample_anchor not in text:
                  raise SystemExit('APK snapshot write anchor missing')
              text = text.replace(sample_anchor, sample_replacement, 1)

          result_anchor = '''  elif [ "$PROFILE" = "fragment" ]; then
              RESULT="碎片扫描完成，可清理 $SPACE"
            else
              if [ "$PROFILE" = "corpse" ]; then RESULT="卸载残留扫描完成，可清理 $SPACE"; else RESULT="扫描完成，可清理 $SPACE"; fi
'''
          result_replacement = '''  elif [ "$PROFILE" = "fragment" ]; then
              RESULT="碎片扫描完成，可清理 $SPACE"
            elif [ "$PROFILE" = "apk" ]; then
              RESULT="安装包扫描完成，可清理 $SPACE"
            else
              if [ "$PROFILE" = "corpse" ]; then RESULT="卸载残留扫描完成，可清理 $SPACE"; else RESULT="扫描完成，可清理 $SPACE"; fi
'''
          if 'RESULT="安装包扫描完成，可清理 $SPACE"' not in text:
              if result_anchor not in text:
                  raise SystemExit('APK result anchor missing')
              text = text.replace(result_anchor, result_replacement, 1)

          path.write_text(text)
          PY

      - name: Commit snapshot persistence
        run: |
          if git diff --quiet; then
            echo "APK snapshot persistence already applied"
            exit 0
          fi
          git diff --check
          sh -n cleaner.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cleaner.sh
          git commit -m "feat(engine): persist APK scan authorization snapshot"
          git push origin HEAD:v2-alpha42-8-snapshot-clean-ui
