name: BaiZe v2 Alpha 42.8 Snapshot Clean UI

on:
  push:
    branches: [v2-alpha42-8-snapshot-clean-ui]
    paths:
      - 'cleaner.sh'
      - 'v2/**'
      - '.github/workflows/v2-alpha42-8-snapshot-clean-ui.yml'
  pull_request:
    branches: [v2-alpha42-7-secondary-scan-pages]
    paths:
      - 'cleaner.sh'
      - 'v2/**'
      - '.github/workflows/v2-alpha42-8-snapshot-clean-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-8-snapshot-clean-ui
          fetch-depth: 0
          show-progress: false

      - name: Validate snapshot routing and themed pages
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/cleaner42_6.sh
          sh -n v2/module/native-scan.sh
          sh -n v2/module/cache-snapshot-clean.sh
          sh -n v2/module/profile-snapshot-clean.sh
          sh -n v2/module/apk-snapshot-clean.sh
          sh -n v2/module/customize.sh v2/module/service.sh v2/module/action.sh
          sh -n v2/scripts/build-native.sh v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'APK_SCAN_STATE="$STATE_DIR/apk_scan.env"' cleaner.sh
          grep -q 'engine=compat-apk-scan-v42.8' cleaner.sh
          grep -q 'apk-cleaner.sh' v2/module/cleaner42_6.sh
          grep -q 'runModuleTask("apk-clean")' v2/app/src/main/java/io/github/xgl34222220/baize/ApkScanActivity.kt
          grep -q '一键清理.*项' v2/app/src/main/java/io/github/xgl34222220/baize/ApkScanActivity.kt
          grep -q 'CACHE SNAPSHOT' v2/app/src/main/java/io/github/xgl34222220/baize/CacheActivity.kt
          grep -q 'BaiZeTheme(appearance)' v2/app/src/main/java/io/github/xgl34222220/baize/CacheActivity.kt
          grep -q 'versionCode = 22280' v2/app/build.gradle.kts
          grep -q 'version=v2.0.0-alpha42.8' v2/module/module.prop

      - name: Test APK snapshot clean without rediscovery
        shell: bash
        run: |
          set -euo pipefail
          TEST=/tmp/baize-apk-snapshot
          MEDIA="$TEST/media"
          STATE="$TEST/state"
          TARGET="$MEDIA/0/Download/old-scanned.apk"
          NEW="$MEDIA/0/Download/new-after-scan.apk"
          rm -rf "$TEST"
          mkdir -p "$MEDIA/0/Download" "$STATE/reports" "$STATE/logs"
          printf 'old-apk-content' > "$TARGET"
          touch -d '10 minutes ago' "$TARGET"
          : > "$STATE/whitelist.conf"
          printf '%s\0' "$TARGET" > "$STATE/apk_scan.targets"
          targets_sha=$(sha256sum "$STATE/apk_scan.targets" | awk '{print $1}')
          whitelist_sha=$(sha256sum "$STATE/whitelist.conf" | awk '{print $1}')
          epoch=$(date +%s)
          {
            echo "epoch=$epoch"
            echo "snapshot_id=${epoch}-${targets_sha:0:16}"
            echo "targets_sha=$targets_sha"
            echo "whitelist_sha=$whitelist_sha"
            echo "max_file_bytes=1073741824"
            echo "bytes=$(stat -c %s "$TARGET")"
            echo "files=1"
          } > "$STATE/apk_scan.env"
          sleep 1
          printf 'new-apk-content' > "$NEW"

          BAIZE_STATE_DIR="$STATE" BAIZE_MEDIA_ROOT="$MEDIA" \
            bash v2/module/apk-snapshot-clean.sh apk-clean ci > "$TEST/clean.out"

          test ! -e "$TARGET"
          test -f "$NEW"
          test ! -e "$STATE/apk_scan.env"
          test ! -e "$STATE/apk_scan.targets"
          grep -q '^mode=apk-clean$' "$STATE/latest.env"
          grep -q '安装包快照清理完成' "$TEST/clean.out"
          grep -q '扫描快照:' "$TEST/clean.out"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build arm64 native engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha42.8-Snapshot-Clean-UI-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha42.8'
          unzip -p "$ZIP" module.prop | grep -q 'versionCode=22280'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'apk-cleaner.sh'
          unzip -p "$ZIP" cleaner.sh | grep -q 'apk-cleaner.sh'
          unzip -p "$ZIP" cleaner.sh.compat | grep -q 'engine=compat-apk-scan-v42.8'
          unzip -p "$ZIP" app/baize.apk > /tmp/baize.apk
          unzip -l /tmp/baize.apk | grep -q 'AndroidManifest.xml'
          sha256sum "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha42.8-Snapshot-Clean-UI
          path: v2/dist/BaiZe-v2-Alpha42.8-Snapshot-Clean-UI-Module.zip
