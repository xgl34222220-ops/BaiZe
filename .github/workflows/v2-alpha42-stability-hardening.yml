name: BaiZe v2 Alpha 42 Stability Hardening

on:
  push:
    branches: [v2-alpha42-stability-hardening]
    paths:
      - 'v2/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'config/**'
      - '.github/workflows/v2-alpha42-stability-hardening.yml'
  pull_request:
    branches: [v2-alpha41-appearance-dual-ui]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-alpha42-stability-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-alpha42-stability-hardening
          fetch-depth: 0
          show-progress: false

      - name: Validate stability architecture and shell
        run: |
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/action.sh v2/module/customize.sh v2/module/service.sh v2/module/uninstall.sh
          sh -n v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q 'String getRawLog(int maxChars)' v2/app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          grep -q 'fun rawLogJson' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q 'SNAPSHOT_TTL_MS' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'refreshRawLog()' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'fun MaterialRawLogCard' v2/app/src/main/java/io/github/xgl34222220/baize/ui/logs/material/LogsScreenMaterial.kt
          grep -q 'fun MiuixRawLogCard' v2/app/src/main/java/io/github/xgl34222220/baize/ui/logs/miuix/LogsScreenMiuix.kt
          grep -q 'ThemeManager.setMode' v2/app/src/main/java/io/github/xgl34222220/baize/ui/appearance/AppearanceRepository.kt
          grep -q 'appearance.uiStyle == UiStyle.MIUIX' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'version=v2.0.0-alpha42' v2/module/module.prop

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        working-directory: v2
        run: |
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2-Alpha42-Module.zip
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q 'version=v2.0.0-alpha42'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'cleaner.sh'
          unzip -l "$ZIP" | grep -q 'scheduler.sh'
          unzip -p "$ZIP" app/baize.apk.sha256 | grep -Eq '^[0-9a-f]{64}$'

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2-Alpha42-Stability-Hardening
          path: v2/dist/BaiZe-v2-Alpha42-Module.zip
