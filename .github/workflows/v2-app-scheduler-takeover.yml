name: BaiZe v2 App Scheduler Takeover

on:
  push:
    branches: [fix/v2.0.1-app-scheduler-takeover]
    paths:
      - '.github/workflows/v2-app-scheduler-takeover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout takeover branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
          fetch-depth: 0
          show-progress: false

      - name: Apply App-only scheduler patch
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH_B64' | base64 -d | gzip -d > v2/scripts/app-scheduler-takeover-patch.py
          
          PATCH_B64
          python3 v2/scripts/app-scheduler-takeover-patch.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 native engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package App-only module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify native App takeover
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.1-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.1'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22310'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'bin/arm64-v8a/baize_engine'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          grep -q 'daily_schedule_minute' v2/app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt
          grep -q 'MAX_HOURS = 720' v2/app/src/main/java/io/github/xgl34222220/baize/ui/MiuixScheduleRow.kt
          grep -q '每日固定时刻' v2/app/src/main/res/layout/activity_dashboard.xml
          grep -q 'rm -rf.*webroot' v2/module/customize.sh
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f v2/scripts/app-scheduler-takeover-patch.py
          rm -f .github/workflows/v2-app-scheduler-takeover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v2/app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/MiuixScheduleRow.kt \
            v2/app/src/main/res/layout/activity_dashboard.xml \
            v2/module/customize.sh \
            v2/module/service.sh \
            v2/module/action.sh \
            v2/scripts/package-module.sh \
            v2/app/build.gradle.kts \
            v2/module/module.prop \
            RELEASE_NOTES_V2.md \
            .github/workflows/v2-app-scheduler-takeover.yml
          git commit -m 'fix(v2): let the native app take over scheduling'
          git push origin HEAD:fix/v2.0.1-app-scheduler-takeover

      - name: Upload v2.0.1 test module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.1-App-Scheduler-Takeover
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.1-Module.zip
            v2/dist/BaiZe-v2.0.1-Module.zip.sha256
