name: Build and publish BaiZe v2

on:
  pull_request:
    branches: [v2, main]
    paths:
      - 'v2/**'
      - 'config/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'RELEASE_NOTES_V2.md'
      - '.github/workflows/v2-stable-release.yml'
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release after the verified build'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: baize-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Read and validate version metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          MODULE_VERSION="$(sed -n 's/^version=//p' v2/module/module.prop | head -n 1)"
          MODULE_CODE="$(sed -n 's/^versionCode=//p' v2/module/module.prop | head -n 1)"
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' v2/app/build.gradle.kts | head -n 1)"
          APP_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' v2/app/build.gradle.kts | head -n 1)"

          test -n "$MODULE_VERSION"
          test -n "$MODULE_CODE"
          test -n "$APP_VERSION"
          test -n "$APP_CODE"
          test "$MODULE_VERSION" = "v$APP_VERSION"
          test "$MODULE_CODE" = "$APP_CODE"

          case "$MODULE_VERSION" in
            v2.*) ;;
            *)
              echo "Unexpected v2 module version: $MODULE_VERSION" >&2
              exit 1
              ;;
          esac

          ZIP_NAME="BaiZe-${MODULE_VERSION}-Module.zip"
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$MODULE_CODE" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate stable sources
        shell: bash
        run: |
          set -euo pipefail
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/cleaner42_6.sh
          sh -n v2/module/native-scan.sh
          sh -n v2/module/cache-snapshot-clean.sh
          sh -n v2/module/profile-snapshot-clean.sh
          sh -n v2/module/apk-snapshot-scan.sh
          sh -n v2/module/apk-snapshot-clean.sh
          sh -n v2/module/customize.sh v2/module/service.sh v2/module/action.sh
          sh -n v2/scripts/build-native.sh v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          ! grep -qi 'alpha' v2/module/module.prop
          test -s RELEASE_NOTES_V2.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 native engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package stable module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify final module
        shell: bash
        env:
          MODULE_VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          set -euo pipefail
          ZIP="v2/dist/$ZIP_NAME"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx "version=$MODULE_VERSION"
          unzip -p "$ZIP" module.prop | grep -qx "versionCode=$VERSION_CODE"
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'bin/arm64-v8a/baize_engine'
          unzip -l "$ZIP" | grep -q 'cache-snapshot-clean.sh'
          unzip -l "$ZIP" | grep -q 'apk-cleaner.sh'
          unzip -l "$ZIP" | grep -q 'profile-cleaner.sh'
          unzip -p "$ZIP" bin/arm64-v8a/baize_engine > /tmp/baize_engine_android
          file /tmp/baize_engine_android | grep -q 'ARM aarch64'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-${{ steps.metadata.outputs.version }}-${{ github.event_name }}
          if-no-files-found: error
          path: |
            v2/dist/${{ steps.metadata.outputs.zip_name }}
            v2/dist/${{ steps.metadata.outputs.zip_name }}.sha256

  release:
    name: Publish explicit release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v2.') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: BaiZe-${{ needs.build.outputs.version }}-${{ github.event_name }}
          path: v2/dist

      - name: Validate release ref
        id: release_metadata
        shell: bash
        env:
          BUILT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            test "$TAG" = "$BUILT_VERSION"
          else
            TAG="$BUILT_VERSION"
            test "${{ inputs.publish_release }}" = "true"
          fi

          case "$TAG" in
            v2.*) ;;
            *)
              echo "Refusing to publish unexpected tag: $TAG" >&2
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_metadata.outputs.tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="v2/dist/$ZIP_NAME"
          SHA="$ZIP.sha256"

          test -s "$ZIP"
          test -s "$SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite published assets." >&2
            exit 1
          fi

          gh release create "$TAG" "$ZIP" "$SHA" \
            --target "$GITHUB_SHA" \
            --title "白泽 $TAG" \
            --notes-file RELEASE_NOTES_V2.md \
            --latest
