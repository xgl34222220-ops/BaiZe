name: Publish BaiZe v2 Stable

on:
  push:
    branches: [v2-release]
    paths:
      - 'v2/**'
      - 'config/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'RELEASE_NOTES_V2.md'
      - '.github/workflows/v2-stable-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - 'config/**'
      - 'cleaner.sh'
      - 'notify.sh'
      - 'service.sh'
      - 'RELEASE_NOTES_V2.md'
      - '.github/workflows/v2-stable-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baize-v2-stable-release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-release
          fetch-depth: 0
          show-progress: false

      - name: Validate stable sources
        run: |
          set -eu
          sh -n cleaner.sh notify.sh service.sh
          sh -n v2/module/cleaner42_6.sh
          sh -n v2/module/native-scan.sh
          sh -n v2/module/cache-snapshot-clean.sh
          sh -n v2/module/profile-snapshot-clean.sh
          sh -n v2/module/apk-snapshot-scan.sh
          sh -n v2/module/apk-snapshot-clean.sh
          sh -n v2/module/customize.sh v2/module/service.sh v2/module/action.sh
          sh -n v2/scripts/build-native.sh v2/scripts/package-module.sh
          python3 v2/scripts/validate-rules.py
          grep -q '^version=v2.0.0$' v2/module/module.prop
          grep -q '^versionCode=22300$' v2/module/module.prop
          grep -q 'versionCode = 22300' v2/app/build.gradle.kts
          grep -q 'versionName = "2.0.0"' v2/app/build.gradle.kts
          ! grep -q 'alpha42' v2/module/module.prop
          test -s RELEASE_NOTES_V2.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 native engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package stable module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify final module
        run: |
          set -eu
          ZIP=v2/dist/BaiZe-v2.0.0-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -q '^version=v2.0.0$'
          unzip -p "$ZIP" module.prop | grep -q '^versionCode=22300$'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'bin/arm64-v8a/baize_engine'
          unzip -l "$ZIP" | grep -q 'cache-snapshot-clean.sh'
          unzip -l "$ZIP" | grep -q 'apk-cleaner.sh'
          unzip -l "$ZIP" | grep -q 'profile-cleaner.sh'
          unzip -p "$ZIP" bin/arm64-v8a/baize_engine > /tmp/baize_engine_android
          file /tmp/baize_engine_android | grep -q 'ARM aarch64'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.0-Stable-${{ github.event_name }}
          path: |
            v2/dist/BaiZe-v2.0.0-Module.zip
            v2/dist/BaiZe-v2.0.0-Module.zip.sha256

      - name: Publish stable GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG=v2.0.0
          ZIP=v2/dist/BaiZe-v2.0.0-Module.zip
          SHA=v2/dist/BaiZe-v2.0.0-Module.zip.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
            gh release edit "$TAG" \
              --title '白泽 v2' \
              --notes-file RELEASE_NOTES_V2.md \
              --latest \
              --prerelease=false
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --target "$GITHUB_SHA" \
              --title '白泽 v2' \
              --notes-file RELEASE_NOTES_V2.md \
              --latest
          fi
