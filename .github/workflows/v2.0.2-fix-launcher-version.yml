name: BaiZe v2.0.2 Launcher Version Fix

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/v2.0.2-fix-launcher-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
          fetch-depth: 0
          show-progress: false

      - name: Fix real launcher, visible version and module action
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # The launcher is MiuixDashboardActivity. Its Compose header was still hard-coded to Alpha 42.
          replace_exact(
              'v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt',
              '"Miuix × Haze Glass · Alpha 42"',
              '"Miuix × Haze Glass · v${BuildConfig.VERSION_NAME}"'
          )

          material = Path('v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt')
          text = material.read_text(encoding='utf-8')
          old_import = 'import io.github.xgl34222220.baize.DashboardActions\nimport io.github.xgl34222220.baize.DashboardUiState\n'
          new_import = 'import io.github.xgl34222220.baize.BuildConfig\nimport io.github.xgl34222220.baize.DashboardActions\nimport io.github.xgl34222220.baize.DashboardUiState\n'
          if old_import not in text:
              raise SystemExit('HomeScreenMaterial.kt: import anchor missing')
          text = text.replace(old_import, new_import, 1)
          old_label = '"Material 3 清理概览 · Alpha 36"'
          if text.count(old_label) != 1:
              raise SystemExit('HomeScreenMaterial.kt: hard-coded Alpha 36 label missing')
          text = text.replace(old_label, '"Material 3 清理概览 · v${BuildConfig.VERSION_NAME}"', 1)
          material.write_text(text, encoding='utf-8')

          # The module action must open the actual launcher, not the obsolete view-based dashboard.
          replace_exact(
              'v2/module/action.sh',
              'am start -n "$APP_ID/.DashboardActivity" >/dev/null 2>&1',
              'am start -n "$APP_ID/.MiuixDashboardActivity" >/dev/null 2>&1 || monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1'
          )

          # v2.0.1 was already tested on-device and exposed this bug; publish the corrected test as v2.0.2.
          replace_exact('v2/app/build.gradle.kts', 'versionCode = 22310', 'versionCode = 22320')
          replace_exact('v2/app/build.gradle.kts', 'versionName = "2.0.1"', 'versionName = "2.0.2"')
          replace_exact('v2/module/module.prop', 'version=v2.0.1', 'version=v2.0.2')
          replace_exact('v2/module/module.prop', 'versionCode=22310', 'versionCode=22320')
          replace_exact('v2/module/module.prop', 'description=白泽 v2.0.1：', 'description=白泽 v2.0.2：')
          replace_exact('v2/scripts/package-module.sh', 'BaiZe-v2.0.1-Module.zip', 'BaiZe-v2.0.2-Module.zip')
          replace_exact('v2/scripts/package-module.sh', "grep -q '^version=v2.0.1$'", "grep -q '^version=v2.0.2$'")
          replace_exact('v2/scripts/package-module.sh', "grep -q '^versionCode=22310$'", "grep -q '^versionCode=22320$'")
          replace_exact('v2/scripts/package-module.sh', '白泽 v2.0.1 App 接管版模块', '白泽 v2.0.2 App 接管版模块')
          replace_exact('v2/module/customize.sh', '安装白泽 v2.0.1 App 接管版', '安装白泽 v2.0.2 App 接管版')

          notes = Path('RELEASE_NOTES_V2.md')
          notes_text = notes.read_text(encoding='utf-8')
          notes_text = notes_text.replace('v2.0.1', 'v2.0.2').replace('App：`2.0.1`', 'App：`2.0.2`').replace('versionCode：`22310`', 'versionCode：`22320`')
          notes.write_text(notes_text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify launcher, version and absence of WebUI
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.2-Module.zip
          APK=v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.2'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22320'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          grep -q 'MiuixDashboardActivity' v2/module/action.sh
          grep -q 'Miuix × Haze Glass · v${BuildConfig.VERSION_NAME}' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'Material 3 清理概览 · v${BuildConfig.VERSION_NAME}' v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt
          rm -rf /tmp/baize-dex && mkdir -p /tmp/baize-dex
          cd /tmp/baize-dex
          unzip -q "$GITHUB_WORKSPACE/$APK" 'classes*.dex'
          ! strings classes*.dex | grep -Fq 'Alpha 42'
          ! strings classes*.dex | grep -Fq 'Alpha 36'
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v2.0.2-fix-launcher-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/home/material/HomeScreenMaterial.kt \
            v2/module/action.sh \
            v2/app/build.gradle.kts \
            v2/module/module.prop \
            v2/scripts/package-module.sh \
            v2/module/customize.sh \
            RELEASE_NOTES_V2.md \
            .github/workflows/v2.0.2-fix-launcher-version.yml
          git commit -m 'fix(v2): align native launcher and visible version'
          git push origin HEAD:fix/v2.0.1-app-scheduler-takeover

      - name: Upload corrected v2.0.2 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.2-Native-App-Takeover
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.2-Module.zip
            v2/dist/BaiZe-v2.0.2-Module.zip.sha256
