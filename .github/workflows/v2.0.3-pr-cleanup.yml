name: BaiZe v2.0.3 PR Cleanup

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/v2.0.3-pr-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
          fetch-depth: 0
          show-progress: false

      - name: Remove obsolete XML-page changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v2
          git checkout origin/v2 -- \
            v2/app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/MiuixScheduleRow.kt \
            v2/app/src/main/res/layout/activity_dashboard.xml
          git diff --check

          # The active Compose implementation must remain present after restoring old files.
          grep -q 'daily_schedule_enabled' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'range = 1..720' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt
          grep -q '每日固定时间' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package cleaned module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify cleaned v2.0.3 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.3-Module.zip
          APK=v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.3'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22330'
          unzip -Z1 "$ZIP" > /tmp/baize-v203-clean-list.txt
          if grep -Eq '^(webroot|webui|www|ksu-webui)/' /tmp/baize-v203-clean-list.txt; then
            echo '模块包中仍存在 WebUI 目录' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='22330' versionName='2.0.3'"
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v2.0.3-pr-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v2/app/src/main/java/io/github/xgl34222220/baize/DashboardActivity.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/MiuixScheduleRow.kt \
            v2/app/src/main/res/layout/activity_dashboard.xml
          git add -u .github/workflows/v2.0.3-pr-cleanup.yml
          git commit -m 'chore(v2): drop obsolete XML scheduler edits'
          git push origin HEAD:fix/v2.0.1-app-scheduler-takeover

      - name: Upload cleaned v2.0.3 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.3-Cleaned-Compose-Scheduler
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.3-Module.zip
            v2/dist/BaiZe-v2.0.3-Module.zip.sha256
