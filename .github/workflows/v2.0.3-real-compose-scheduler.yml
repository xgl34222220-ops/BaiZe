name: BaiZe v2.0.3 Real Compose Scheduler

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/v2.0.3-real-compose-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
          fetch-depth: 0
          show-progress: false

      - name: Apply real Compose scheduler UI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '[... ELLIPSIZATION ...]' | base64 -d | tar -xzf -
          python3 - <<'PYFIX'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences of {old!r}, found {actual}")
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('v2/app/build.gradle.kts', 'versionCode = 22320', 'versionCode = 22330')
          replace('v2/app/build.gradle.kts', 'versionName = "2.0.2"', 'versionName = "2.0.3"')
          replace('v2/module/module.prop', 'version=v2.0.2', 'version=v2.0.3')
          replace('v2/module/module.prop', 'versionCode=22320', 'versionCode=22330')
          replace('v2/module/module.prop', 'description=白泽 v2.0.2：', 'description=白泽 v2.0.3：')
          replace('v2/module/service.sh', 'module_version=2.0.1', 'module_version=2.0.3')
          replace('v2/scripts/package-module.sh', 'BaiZe-v2.0.2-Module.zip', 'BaiZe-v2.0.3-Module.zip')
          replace('v2/scripts/package-module.sh', "^version=v2.0.2$", "^version=v2.0.3$")
          replace('v2/scripts/package-module.sh', "^versionCode=22320$", "^versionCode=22330$")
          replace('v2/scripts/package-module.sh', '白泽 v2.0.2 App 接管版模块', '白泽 v2.0.3 原生调度完整版模块')

          customize = Path('v2/module/customize.sh')
          text = customize.read_text(encoding='utf-8').replace('v2.0.2', 'v2.0.3')
          customize.write_text(text, encoding='utf-8')

          notes = Path('RELEASE_NOTES_V2.md')
          text = notes.read_text(encoding='utf-8')
          text = text.replace('v2.0.2', 'v2.0.3').replace('`2.0.2`', '`2.0.3`').replace('`22320`', '`22330`')
          notes.write_text(text, encoding='utf-8')
          PYFIX
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify real native scheduler controls
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.3-Module.zip
          APK=v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.3'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22330'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          grep -q 'daily_schedule_enabled' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'daily_grace_minutes' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'range = 1..720' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt
          grep -q '精确周期' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt
          grep -q '每日固定时间' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='22330' versionName='2.0.3'"
          rm -rf /tmp/baize-v203-dex && mkdir -p /tmp/baize-v203-dex
          cd /tmp/baize-v203-dex
          unzip -q "$GITHUB_WORKSPACE/$APK" 'classes*.dex'
          strings classes*.dex | grep -Fq '精确输入 1–720 小时'
          strings classes*.dex | grep -Fq '每日固定时间'
          strings classes*.dex | grep -Fq 'daily_schedule_minute'
          cd "$GITHUB_WORKSPACE"
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified native App changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v2.0.3-real-compose-scheduler.yml
          rm -f .github/workflows/export-clean-ui-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/CleanContract.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/CleanRoute.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/ScheduleInputDialogs.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt \
            v2/app/build.gradle.kts \
            v2/module/module.prop \
            v2/module/service.sh \
            v2/module/customize.sh \
            v2/scripts/package-module.sh \
            RELEASE_NOTES_V2.md
          git add -u .github/workflows/v2.0.3-real-compose-scheduler.yml .github/workflows/export-clean-ui-source.yml
          git commit -m 'fix(v2): implement scheduler controls in the active Compose UI'
          git push origin HEAD:fix/v2.0.1-app-scheduler-takeover

      - name: Upload v2.0.3 test module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.3-Real-Compose-Scheduler
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.3-Module.zip
            v2/dist/BaiZe-v2.0.3-Module.zip.sha256
