name: BaiZe v2.0.4 System Bars Insets

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/v2.0.4-system-bars-insets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status bar fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.4-system-bars-insets
          fetch-depth: 0
          show-progress: false

      - name: Apply global safe top inset and bump v2.0.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt')
          app = app_path.read_text(encoding='utf-8')

          # v2.0.3 protected only the home header. Remove that local inset and place it on the
          # shared page host so every page receives exactly one top safe area.
          app, header_count = re.subn(
              r'(\.fillMaxWidth\(\)\s*)\.statusBarsPadding\(\)(\s*\.padding\(horizontal = 22\.dp, vertical = 14\.dp\))',
              r'\1\2',
              app,
              count=1,
          )
          if header_count != 1:
              raise SystemExit(f'expected one legacy home-only status inset, found {header_count}')

          patterns = [
              (
                  r'(style = UiStyle\.MATERIAL,\n\s*)modifier = Modifier\.fillMaxSize\(\)',
                  r'\1modifier = Modifier\n                            .fillMaxSize()\n                            .statusBarsPadding()'
              ),
              (
                  r'(style = UiStyle\.MIUIX,\n\s*)modifier = Modifier\.fillMaxSize\(\)',
                  r'\1modifier = Modifier\n                                .fillMaxSize()\n                                .statusBarsPadding()'
              ),
          ]
          for pattern, replacement in patterns:
              app, count = re.subn(pattern, replacement, app, count=1)
              if count != 1:
                  raise SystemExit(f'page host inset anchor matched {count} times: {pattern}')
          if app.count('.statusBarsPadding()') != 2:
              raise SystemExit(f'expected exactly two global page-host status bar paddings, found {app.count(".statusBarsPadding()")}')
          app_path.write_text(app, encoding='utf-8')

          gradle = Path('v2/app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text, code_count = re.subn(r'versionCode\s*=\s*22330', 'versionCode = 22340', text, count=1)
          text, name_count = re.subn(r'versionName\s*=\s*"2\.0\.3"', 'versionName = "2.0.4"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f'App version anchors: code={code_count}, name={name_count}')
          gradle.write_text(text, encoding='utf-8')

          prop = Path('v2/module/module.prop')
          lines = prop.read_text(encoding='utf-8').splitlines()
          values = {
              'version': 'v2.0.4',
              'versionCode': '22340',
              'description': '白泽 v2.0.4：统一修复所有原生页面的状态栏安全区，保留完整自动清理、快照与安全保护。',
          }
          seen = set()
          output = []
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else ''
              if key in values:
                  output.append(f'{key}={values[key]}')
                  seen.add(key)
              else:
                  output.append(line)
          if seen != set(values):
              raise SystemExit(f'module.prop keys missing: {set(values) - seen}')
          prop.write_text('\n'.join(output) + '\n', encoding='utf-8')

          package = Path('v2/scripts/package-module.sh')
          text = package.read_text(encoding='utf-8')
          if text.count('v2.0.3') < 3 or text.count('22330') != 1:
              raise SystemExit('unexpected package-module version anchors')
          text = text.replace('v2.0.3', 'v2.0.4').replace('22330', '22340')
          text = text.replace('原生调度完整版模块', '状态栏安全区修正版模块')
          package.write_text(text, encoding='utf-8')

          notes = Path('RELEASE_NOTES_V2.md')
          note_text = notes.read_text(encoding='utf-8')
          header = '''# 白泽 v2.0.4\n\n- 将状态栏安全区从首页私有标题迁移到公共页面宿主。\n- 修复 MIUIx 与 Material 的首页、清理、记录、日志、设置内容侵入时间、信号图标和挖孔区域。\n- 页面背景继续延伸至系统栏，实际交互内容统一从安全区下方开始。\n- 保留 v2.0.3 的每日定时、1–720 小时精确周期与 App 全面接管。\n\n'''
          if not note_text.startswith('# 白泽 v2.0.4'):
              notes.write_text(header + note_text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package v2.0.4 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify global status bar protection
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.4-Module.zip
          APK=v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.4'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22340'
          test "$(grep -c 'statusBarsPadding()' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt)" -eq 2
          grep -A4 'style = UiStyle.MATERIAL' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt | grep -q 'statusBarsPadding()'
          grep -A4 'style = UiStyle.MIUIX' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt | grep -q 'statusBarsPadding()'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='22340' versionName='2.0.4'"
          if unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'; then
            echo '模块包中仍存在 WebUI 目录' >&2
            exit 1
          fi
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified v2.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v2.0.4-system-bars-insets.yml
          rm -f .github/workflows/v204-inset-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt \
            v2/app/build.gradle.kts \
            v2/module/module.prop \
            v2/scripts/package-module.sh \
            RELEASE_NOTES_V2.md \
            .github/workflows/v2.0.4-system-bars-insets.yml \
            .github/workflows/v204-inset-diagnostic.yml
          git commit -m 'fix(v2): keep every page below the status bar'
          git push origin HEAD:fix/v2.0.4-system-bars-insets

      - name: Upload v2.0.4 test module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.4-System-Bars-Fix
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.4-Module.zip
            v2/dist/BaiZe-v2.0.4-Module.zip.sha256
