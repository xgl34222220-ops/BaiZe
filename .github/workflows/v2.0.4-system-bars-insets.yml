name: BaiZe v2.0.4 System Bars Insets

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/v2.0.4-system-bars-insets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status bar fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.4-system-bars-insets
          fetch-depth: 0
          show-progress: false

      - name: Apply global safe top inset and bump v2.0.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              file.write_text(text.replace(old, new, expected), encoding='utf-8')

          app = 'v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt'
          replace_exact(
              app,
              '''AnimatedPageHost(
                        page = page,
                        style = UiStyle.MATERIAL,
                        modifier = Modifier.fillMaxSize()
                    )''',
              '''AnimatedPageHost(
                        page = page,
                        style = UiStyle.MATERIAL,
                        modifier = Modifier
                            .fillMaxSize()
                            .statusBarsPadding()
                    )'''
          )
          replace_exact(
              app,
              '''AnimatedPageHost(
                            page = page,
                            style = UiStyle.MIUIX,
                            modifier = Modifier.fillMaxSize()
                        )''',
              '''AnimatedPageHost(
                            page = page,
                            style = UiStyle.MIUIX,
                            modifier = Modifier
                                .fillMaxSize()
                                .statusBarsPadding()
                        )'''
          )

          replace_exact('v2/app/build.gradle.kts', 'versionCode = 22330', 'versionCode = 22340')
          replace_exact('v2/app/build.gradle.kts', 'versionName = "2.0.3"', 'versionName = "2.0.4"')
          replace_exact('v2/module/module.prop', 'version=v2.0.3', 'version=v2.0.4')
          replace_exact('v2/module/module.prop', 'versionCode=22330', 'versionCode=22340')
          replace_exact(
              'v2/module/module.prop',
              'description=白泽 v2.0.3：原生 App 全面接管清理与 1-720 小时/每日定时，移除旧 WebUI，并保留快照与完整安全保护。',
              'description=白泽 v2.0.4：统一修复所有原生页面的状态栏安全区，保留完整自动清理、快照与安全保护。'
          )
          replace_exact('v2/scripts/package-module.sh', 'BaiZe-v2.0.3-Module.zip', 'BaiZe-v2.0.4-Module.zip')
          replace_exact('v2/scripts/package-module.sh', "^version=v2.0.3$", "^version=v2.0.4$")
          replace_exact('v2/scripts/package-module.sh', "^versionCode=22330$", "^versionCode=22340$")
          replace_exact('v2/scripts/package-module.sh', '白泽 v2.0.3 原生调度完整版模块', '白泽 v2.0.4 状态栏安全区修正版模块')

          notes = Path('RELEASE_NOTES_V2.md')
          note_text = notes.read_text(encoding='utf-8')
          header = '''# 白泽 v2.0.4\n\n- 修复 MIUIx 与 Material 所有主页面内容侵入状态栏、时间和挖孔区域的问题。\n- 页面背景继续延伸至系统栏，标题、按钮和列表统一从状态栏安全区下方开始。\n- 保留 v2.0.3 的每日定时、1–720 小时精确周期与 App 全面接管。\n\n'''
          notes.write_text(header + note_text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package v2.0.4 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify global status bar protection
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.4-Module.zip
          APK=v2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.4'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22340'
          test "$(grep -c 'statusBarsPadding()' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt)" -eq 2
          grep -q 'style = UiStyle.MATERIAL' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'style = UiStyle.MIUIX' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='22340' versionName='2.0.4'"
          if unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'; then
            echo '模块包中仍存在 WebUI 目录' >&2
            exit 1
          fi
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified v2.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v2.0.4-system-bars-insets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt \
            v2/app/build.gradle.kts \
            v2/module/module.prop \
            v2/scripts/package-module.sh \
            RELEASE_NOTES_V2.md \
            .github/workflows/v2.0.4-system-bars-insets.yml
          git commit -m 'fix(v2): keep every page below the status bar'
          git push origin HEAD:fix/v2.0.4-system-bars-insets

      - name: Upload v2.0.4 test module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.4-System-Bars-Fix
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.4-Module.zip
            v2/dist/BaiZe-v2.0.4-Module.zip.sha256
