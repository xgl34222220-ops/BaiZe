name: BaiZe v2.0.5 Reliable Snapshots

on:
  pull_request:
    branches: [fix/v2.0.4-system-bars-insets]
    paths:
      - '.github/workflows/v2.0.5-reliable-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2.0.5 branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.0.5-reliable-snapshots
          fetch-depth: 0
          show-progress: false

      - name: Apply reliable snapshot implementation
        shell: bash
        run: |
          set +e
          {
            set -x
            wc -c .github/v205-payload/part*
            cat .github/v205-payload/part* > /tmp/v205-payload.b64
            wc -c /tmp/v205-payload.b64
            base64 -d /tmp/v205-payload.b64 > /tmp/v205-payload.tar.gz
            sha256sum /tmp/v205-payload.tar.gz
            tar -tzf /tmp/v205-payload.tar.gz
            tar -xzf /tmp/v205-payload.tar.gz
            git diff --check
            for script in \
              service.sh \
              v2/module/service.sh \
              v2/module/customize.sh \
              v2/module/cache-transaction.sh \
              v2/module/cache-snapshot-clean.sh \
              v2/module/native-scan.sh \
              v2/module/cleaner42_6.sh \
              v2/scripts/package-module.sh \
              v2/scripts/build-native.sh; do
              sh -n "$script"
            done
          } > APPLY_V205_DIAGNOSTICS.txt 2>&1
          status=$?
          cat APPLY_V205_DIAGNOSTICS.txt
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add APPLY_V205_DIAGNOSTICS.txt
            git commit -m 'ci(v2): preserve v2.0.5 apply diagnostics' || true
            git push origin HEAD:fix/v2.0.5-reliable-snapshots
          fi
          exit "$status"

      - name: Test immutable snapshot semantics on host
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/baize-v205-snapshot-test
          rm -rf "$WORK"
          mkdir -p \
            "$WORK/data/user/0/com.example.app/cache" \
            "$WORK/data/user_de/0/com.example.app/cache" \
            "$WORK/media/0/Android/data/com.example.app/cache" \
            "$WORK/out"
          printf 'stable-original' > "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          printf 'will-change' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'external-stable' > "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          : > "$WORK/whitelist"
          : > "$WORK/packages"

          gcc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o "$WORK/baize_engine"

          "$WORK/baize_engine" scan-cache \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --min-age-days 0 --max-file-bytes 99999999 \
            --report "$WORK/out/scan.tsv" --targets "$WORK/out/targets" \
            --items "$WORK/out/items.tsv" --manifest "$WORK/out/manifest0" \
            --summary "$WORK/out/scan.env" --progress "$WORK/out/progress" --stop "$WORK/out/stop"

          grep -qx 'files=3' "$WORK/out/scan.env"
          test -s "$WORK/out/manifest0"
          printf 'modified-after-scan' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'new-after-scan' > "$WORK/data/user/0/com.example.app/cache/new.tmp"

          "$WORK/baize_engine" clean-cache-snapshot \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --manifest "$WORK/out/manifest0" --max-file-bytes 99999999 \
            --report "$WORK/out/clean.tsv" --summary "$WORK/out/clean.env" \
            --progress "$WORK/out/progress2" --stop "$WORK/out/stop2"

          test ! -e "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          test ! -e "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          grep -qx 'modified-after-scan' "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          grep -qx 'new-after-scan' "$WORK/data/user/0/com.example.app/cache/new.tmp"
          grep -qx 'files=2' "$WORK/out/clean.env"
          grep -qx 'skipped=1' "$WORK/out/clean.env"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 native engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package v2.0.5 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify reliability invariants
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.0.5-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.0.5'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22350'
          unzip -l "$ZIP" | grep -q 'cache-transaction.sh'
          unzip -p "$ZIP" cleaner.sh | grep -q 'cache-auto'
          unzip -p "$ZIP" scheduler.sh | grep -q 'cache-auto'
          unzip -p "$ZIP" scheduler.sh | grep -q 'compute_next_sleep'
          unzip -p "$ZIP" scheduler.sh | grep -q 'FAILURE_LIMIT=3'
          unzip -p "$ZIP" service.sh | grep -q 'failed-preserved'
          ! unzip -p "$ZIP" service.sh | grep -Eq 'pm uninstall.*io.github.xgl34222220.baize|pm uninstall.*\$APP_ID'
          unzip -p "$ZIP" cache-snapshot-clean.sh | grep -q 'clean-cache-snapshot'
          ! unzip -p "$ZIP" cache-snapshot-clean.sh | grep -Eq 'find[[:space:]].*cache|xargs[[:space:]].*rm'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified v2.0.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v205-payload
          rm -f .github/workflows/export-v205-source.yml
          rm -f .github/workflows/v2.0.5-reliable-snapshots.yml
          rm -f APPLY_V205_DIAGNOSTICS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v2): make cache scheduling transactional and immutable'
          git push origin HEAD:fix/v2.0.5-reliable-snapshots

      - name: Upload v2.0.5 test module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.0.5-Reliable-Snapshots
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.0.5-Module.zip
            v2/dist/BaiZe-v2.0.5-Module.zip.sha256
