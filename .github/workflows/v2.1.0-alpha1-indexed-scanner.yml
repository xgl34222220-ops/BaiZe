name: BaiZe v2.1.0 Alpha 1 Indexed Scanner

on:
  pull_request:
    branches: [fix/v2.0.5-reliable-snapshots]
    paths:
      - '.github/workflows/v2.1.0-alpha1-indexed-scanner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-one-pass-scanner
          fetch-depth: 0
          show-progress: false

      - name: Apply indexed scanner payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v210-payload/part* | base64 -d | tar -xzf -
          git diff --check
          sh -n v2/module/native-scan.sh
          sh -n v2/module/service.sh
          sh -n v2/module/customize.sh
          sh -n v2/scripts/build-native.sh
          sh -n v2/scripts/package-module.sh

      - name: Test shared installed-package index
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/baize-v210-index
          rm -rf "$WORK"
          mkdir -p "$WORK/media/0/Android/data" "$WORK/media/0/Android/obb" "$WORK/media/0/Android/media" "$WORK/installed" "$WORK/out"
          : > "$WORK/whitelist"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/baize-v210-index')
          installed = []
          for index in range(1000):
              package = f'com.example.app{index}'
              installed.append(package)
              path = root / 'media/0/Android/data' / package / 'cache'
              path.mkdir(parents=True)
              (path / 'item.tmp').write_text('installed')
          for index in range(100):
              package = f'com.example.removed{index}'
              path = root / 'media/0/Android/data' / package
              path.mkdir(parents=True)
              (path / 'old.bin').write_bytes(b'x' * 10)
          (root / 'installed/0.txt').write_text('\n'.join(installed) + '\n')
          PY
          gcc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o "$WORK/baize_engine"
          "$WORK/baize_engine" scan-corpses \
            --media-root "$WORK/media" --installed-root "$WORK/installed" \
            --whitelist "$WORK/whitelist" --max-file-bytes 99999999 \
            --report "$WORK/out/report.tsv" --targets "$WORK/out/targets" \
            --summary "$WORK/out/summary.env" --progress "$WORK/out/progress" --stop "$WORK/out/stop"
          grep -qx 'package_index_entries=1000' "$WORK/out/summary.env"
          grep -qx 'package_index_files=1' "$WORK/out/summary.env"
          grep -qx 'package_lookups=1100' "$WORK/out/summary.env"
          grep -qx 'targets=100' "$WORK/out/summary.env"
          grep -Eq '^first_result_ms=[0-9]+$' "$WORK/out/summary.env"
          grep -Eq '^items_per_second=[0-9]+$' "$WORK/out/summary.env"
          test "$(wc -l < "$WORK/out/targets")" -eq 100

      - name: Recheck immutable snapshot safety
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/baize-v210-snapshot
          rm -rf "$WORK"
          mkdir -p "$WORK/data/user/0/com.example.app/cache" "$WORK/media/0/Android/data/com.example.app/cache" "$WORK/out"
          printf 'stable-original' > "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          printf 'will-change' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'external-stable' > "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          : > "$WORK/whitelist"
          : > "$WORK/packages"
          gcc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o "$WORK/baize_engine"
          "$WORK/baize_engine" scan-cache \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --min-age-days 0 --max-file-bytes 99999999 \
            --report "$WORK/out/scan.tsv" --targets "$WORK/out/targets" \
            --items "$WORK/out/items.tsv" --manifest "$WORK/out/manifest0" \
            --summary "$WORK/out/scan.env" --progress "$WORK/out/progress" --stop "$WORK/out/stop"
          printf 'modified-after-scan' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'new-after-scan' > "$WORK/data/user/0/com.example.app/cache/new.tmp"
          "$WORK/baize_engine" clean-cache-snapshot \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --manifest "$WORK/out/manifest0" --max-file-bytes 99999999 \
            --report "$WORK/out/clean.tsv" --summary "$WORK/out/clean.env" \
            --progress "$WORK/out/progress2" --stop "$WORK/out/stop2"
          test ! -e "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          test ! -e "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          grep -qx 'modified-after-scan' "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          grep -qx 'new-after-scan' "$WORK/data/user/0/com.example.app/cache/new.tmp"
          grep -qx 'files=2' "$WORK/out/clean.env"
          grep -qx 'skipped=1' "$WORK/out/clean.env"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package Alpha 1 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify performance preview
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.1.0-alpha1-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.0-alpha1'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22401'
          unzip -p "$ZIP" native-cleaner.sh | grep -q 'package_index_entries'
          unzip -p "$ZIP" native-cleaner.sh | grep -q 'items_per_second'
          unzip -p "$ZIP" native-cleaner.sh | grep -q 'first_result_ms'
          strings v2/build/native/arm64-v8a/baize_engine | grep -q '43.0-alpha1-index'
          grep -q 'versionName = "2.1.0-alpha1"' v2/app/build.gradle.kts
          grep -q 'native-c-arm64-cache-v43.0-alpha1-index' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeRootService.kt
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified Alpha 1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v210-payload
          rm -f .github/workflows/export-v210-source.yml
          rm -f .github/workflows/v2.1.0-alpha1-indexed-scanner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(v2): add shared package index and scan benchmarks'
          git push origin HEAD:perf/v2.1.0-one-pass-scanner

      - name: Upload Alpha 1 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha1-Indexed-Scanner
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.0-alpha1-Module.zip
            v2/dist/BaiZe-v2.1.0-alpha1-Module.zip.sha256
