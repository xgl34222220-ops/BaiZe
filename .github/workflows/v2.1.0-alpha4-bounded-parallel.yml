name: BaiZe v2.1.0 Alpha 4 Bounded Parallel

on:
  pull_request:
    branches: [perf/v2.1.0-alpha3-path-pruning]
    paths: ['.github/workflows/v2.1.0-alpha4-bounded-parallel.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 4 branch
        uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-alpha4-limited-parallel
          fetch-depth: 0

      - name: Apply Alpha 4 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/alpha4-payload/part* > /tmp/alpha4.patch.b64
          python3 - <<'PY'
          from pathlib import Path
          values=[]
          for path in sorted(Path('.github/alpha4-tail').glob('part*')):
              values.extend(int(value) for value in path.read_text().split(',') if value)
          with Path('/tmp/alpha4.patch.b64').open('ab') as stream:
              stream.write(bytes(values))
          PY
          base64 -d /tmp/alpha4.patch.b64 | gzip -d > /tmp/alpha4.patch
          patch -p1 < /tmp/alpha4.patch
          git diff --check
          sh -n v2/module/one-pass-scan.sh
          sh -n v2/module/service.sh
          sh -n v2/module/customize.sh
          sh -n v2/scripts/build-native.sh
          sh -n v2/scripts/package-module.sh

      - name: Build host scanner
        shell: bash
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o /tmp/baize_engine

      - name: Verify serial and bounded-parallel equivalence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/alpha4-fixture
          rm -rf "$ROOT" /tmp/alpha4-serial /tmp/alpha4-parallel
          mkdir -p "$ROOT/data/user/0/com.example.app/cache" \
                   "$ROOT/data/user_de/0/com.example.app/code_cache" \
                   "$ROOT/media/0/Android/data/com.example.app/cache" \
                   "$ROOT/media/0/Android/data/com.example.removed" \
                   "$ROOT/media/0/Android/obb/com.example.removedobb" \
                   "$ROOT/installed"
          printf 'internal' > "$ROOT/data/user/0/com.example.app/cache/internal.tmp"
          printf 'device' > "$ROOT/data/user_de/0/com.example.app/code_cache/device.tmp"
          printf 'external' > "$ROOT/media/0/Android/data/com.example.app/cache/external.tmp"
          printf 'orphan' > "$ROOT/media/0/Android/data/com.example.removed/old.bin"
          printf 'obb' > "$ROOT/media/0/Android/obb/com.example.removedobb/old.obb"
          printf 'com.example.app\n' > "$ROOT/installed/0.txt"
          for MODE in serial parallel; do
            STATE=/tmp/alpha4-$MODE
            mkdir -p "$STATE"
            cp config/default.conf "$STATE/config.conf"
            : > "$STATE/whitelist.conf"
            : > "$STATE/native-cache-packages.conf"
            WORKERS=1; [ "$MODE" = parallel ] && WORKERS=2
            BAIZE_NATIVE_TEST=1 BAIZE_ROOT_WORKERS=$WORKERS \
              BAIZE_STATE_DIR="$STATE" BAIZE_DATA_ROOT="$ROOT/data" \
              BAIZE_MEDIA_ROOT="$ROOT/media" BAIZE_INSTALLED_ROOT="$ROOT/installed" \
              BAIZE_NATIVE_ENGINE=/tmp/baize_engine \
              sh v2/module/one-pass-scan.sh cache-scan ci
          done
          sort /tmp/alpha4-serial/cache_scan.targets > /tmp/serial.cache
          sort /tmp/alpha4-parallel/cache_scan.targets > /tmp/parallel.cache
          sort /tmp/alpha4-serial/corpse_scan.targets > /tmp/serial.corpse
          sort /tmp/alpha4-parallel/corpse_scan.targets > /tmp/parallel.corpse
          cmp /tmp/serial.cache /tmp/parallel.cache
          cmp /tmp/serial.corpse /tmp/parallel.corpse
          test "$(sort /tmp/parallel.cache | uniq -d | wc -l)" -eq 0
          test "$(sort /tmp/parallel.corpse | uniq -d | wc -l)" -eq 0
          grep -qx 'root_workers=1' /tmp/alpha4-serial/cache_scan.env
          grep -qx 'root_workers=2' /tmp/alpha4-parallel/cache_scan.env
          grep -Eq '^parallel_wall_ms=[0-9]+$' /tmp/alpha4-parallel/cache_scan.env
          grep -Eq '^internal_worker_ms=[0-9]+$' /tmp/alpha4-parallel/cache_scan.env
          grep -Eq '^external_worker_ms=[0-9]+$' /tmp/alpha4-parallel/cache_scan.env
          grep -Eq '^parallel_overlap_milli=[0-9]+$' /tmp/alpha4-parallel/cache_scan.env

      - name: Verify failed worker cannot publish half snapshot
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/alpha4-fixture
          STATE=/tmp/alpha4-failure
          rm -rf "$STATE"; mkdir -p "$STATE"
          cp config/default.conf "$STATE/config.conf"
          : > "$STATE/whitelist.conf"; : > "$STATE/native-cache-packages.conf"
          printf 'old-snapshot\n' > "$STATE/cache_scan.env"
          printf 'old-target\n' > "$STATE/cache_scan.targets"
          cat > /tmp/fail-engine <<'SH'
          #!/bin/sh
          [ "$1" = scan-external-one-pass ] && exit 72
          exec /tmp/baize_engine "$@"
          SH
          chmod +x /tmp/fail-engine
          set +e
          BAIZE_NATIVE_TEST=1 BAIZE_ROOT_WORKERS=2 BAIZE_STATE_DIR="$STATE" \
            BAIZE_DATA_ROOT="$ROOT/data" BAIZE_MEDIA_ROOT="$ROOT/media" \
            BAIZE_INSTALLED_ROOT="$ROOT/installed" BAIZE_NATIVE_ENGINE=/tmp/fail-engine \
            sh v2/module/one-pass-scan.sh cache-scan ci
          CODE=$?
          set -e
          test "$CODE" -eq 8
          grep -qx 'old-snapshot' "$STATE/cache_scan.env"
          grep -qx 'old-target' "$STATE/cache_scan.targets"
          test ! -d "$STATE/run.lock"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package Alpha 4 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify Alpha 4 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.1.0-alpha4-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.0-alpha4'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22404'
          unzip -p "$ZIP" config/default.conf | grep -qx 'scan_root_workers=0'
          unzip -p "$ZIP" one-pass-scan.sh | grep -q 'BAIZE_ROOT_WORKERS'
          unzip -p "$ZIP" one-pass-scan.sh | grep -q 'parallel_overlap_milli'
          strings v2/build/native/arm64-v8a/baize_engine | grep -q '43.3-alpha4-bounded-parallel'
          grep -q 'versionName = "2.1.0-alpha4"' v2/app/build.gradle.kts
          grep -q 'native-c-arm64-one-pass-path-index-bounded-parallel' \
            v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeRootService.kt
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified Alpha 4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/alpha4-payload .github/alpha4-tail
          rm -f .github/workflows/export-v210-alpha4.yml
          rm -f .github/workflows/v2.1.0-alpha4-bounded-parallel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(v2): add bounded parallel root scanning'
          git push origin HEAD:perf/v2.1.0-alpha4-limited-parallel

      - name: Upload Alpha 4 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha4-Bounded-Parallel
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.0-alpha4-Module.zip
            v2/dist/BaiZe-v2.1.0-alpha4-Module.zip.sha256
