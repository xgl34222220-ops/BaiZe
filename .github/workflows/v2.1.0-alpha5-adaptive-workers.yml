name: BaiZe v2.1.0 Alpha 5 Adaptive Workers

on:
  pull_request:
    branches: [perf/v2.1.0-alpha4-limited-parallel]
    paths:
      - '.github/workflows/v2.1.0-alpha5-adaptive-workers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 5 branch
        uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-alpha5-adaptive-workers
          fetch-depth: 0

      - name: Apply Alpha 5 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/alpha5-payload/part* | base64 -d | tar -xzf -
          sh -n v2/module/one-pass-scan.sh
          sh -n v2/module/service.sh
          sh -n v2/scripts/package-module.sh
          git diff --check

      - name: Build host scanner
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o /tmp/baize-engine

      - name: Test adaptive worker policy
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$GITHUB_WORKSPACE/v2/module/one-pass-scan.sh"
          make_fixture() {
            root=$1
            rm -rf "$root"
            mkdir -p "$root/state" "$root/media/0/Android/data/com.example.app/cache" \
              "$root/data/user/0/com.example.app/cache" "$root/installed"
            cp config/default.conf "$root/state/config.conf"
            cp config/whitelist.conf "$root/state/whitelist.conf"
            sed -i 's/^scan_parallel_min_items=.*/scan_parallel_min_items=1/' "$root/state/config.conf"
            printf 'com.example.app\n' > "$root/installed/0.txt"
            printf 'internal' > "$root/data/user/0/com.example.app/cache/internal.tmp"
            printf 'external' > "$root/media/0/Android/data/com.example.app/cache/external.tmp"
          }
          run_scan() {
            root=$1
            BAIZE_STATE_DIR="$root/state" BAIZE_MEDIA_ROOT="$root/media" BAIZE_DATA_ROOT="$root/data" \
            BAIZE_INSTALLED_ROOT="$root/installed" BAIZE_NATIVE_ENGINE=/tmp/baize-engine \
              /bin/sh "$SCRIPT" cache-scan ci >/tmp/alpha5-scan.log
          }

          BOOT=/tmp/alpha5-bootstrap
          make_fixture "$BOOT"
          run_scan "$BOOT"
          grep -qx 'root_workers=1' "$BOOT/state/cache_scan.env"
          grep -qx 'worker_reason=auto_bootstrap_serial' "$BOOT/state/cache_scan.env"
          grep -qx 'serial_samples=1' "$BOOT/state/root-worker-profile.env"

          FAST=/tmp/alpha5-fast
          make_fixture "$FAST"
          cat > "$FAST/state/root-worker-profile.env" <<'EOF'
          profile_version=1
          serial_samples=2
          serial_rate=100
          serial_wall_ms=1000
          serial_items=100
          parallel_samples=2
          parallel_rate=140
          parallel_wall_ms=700
          parallel_items=100
          successful_runs=4
          last_probe_run=4
          last_items=100
          last_workers=2
          recommended_workers=2
          parallel_gain_percent=40
          parallel_failures=0
          parallel_blocked_until=0
          last_decision=seed
          updated_epoch=0
          EOF
          run_scan "$FAST"
          grep -qx 'root_workers=2' "$FAST/state/cache_scan.env"
          grep -qx 'worker_reason=auto_parallel_faster' "$FAST/state/cache_scan.env"

          SLOW=/tmp/alpha5-slow
          make_fixture "$SLOW"
          cat > "$SLOW/state/root-worker-profile.env" <<'EOF'
          profile_version=1
          serial_samples=2
          serial_rate=140
          serial_wall_ms=700
          serial_items=100
          parallel_samples=2
          parallel_rate=100
          parallel_wall_ms=1000
          parallel_items=100
          successful_runs=4
          last_probe_run=4
          last_items=100
          last_workers=1
          recommended_workers=1
          parallel_gain_percent=-28
          parallel_failures=0
          parallel_blocked_until=0
          last_decision=seed
          updated_epoch=0
          EOF
          run_scan "$SLOW"
          grep -qx 'root_workers=1' "$SLOW/state/cache_scan.env"
          grep -qx 'worker_reason=auto_serial_faster' "$SLOW/state/cache_scan.env"

          COOL=/tmp/alpha5-cooldown
          make_fixture "$COOL"
          blocked=$(( $(date +%s) + 3600 ))
          cat > "$COOL/state/root-worker-profile.env" <<EOF
          profile_version=1
          serial_samples=2
          serial_rate=100
          serial_wall_ms=1000
          serial_items=100
          parallel_samples=2
          parallel_rate=160
          parallel_wall_ms=600
          parallel_items=100
          successful_runs=4
          last_probe_run=4
          last_items=100
          last_workers=2
          recommended_workers=2
          parallel_gain_percent=60
          parallel_failures=1
          parallel_blocked_until=$blocked
          last_decision=auto_parallel_failed
          updated_epoch=0
          EOF
          run_scan "$COOL"
          grep -qx 'root_workers=1' "$COOL/state/cache_scan.env"
          grep -qx 'worker_reason=auto_parallel_cooldown' "$COOL/state/cache_scan.env"

      - name: Recheck immutable snapshot safety
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/alpha5-snapshot
          rm -rf "$WORK"
          mkdir -p "$WORK/data/user/0/com.example.app/cache" "$WORK/media/0/Android/data/com.example.app/cache" "$WORK/out"
          printf 'stable-original' > "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          printf 'will-change' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'external-stable' > "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          : > "$WORK/whitelist"
          : > "$WORK/packages"
          /tmp/baize-engine scan-cache \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --min-age-days 0 --max-file-bytes 99999999 \
            --report "$WORK/out/scan.tsv" --targets "$WORK/out/targets" \
            --items "$WORK/out/items.tsv" --manifest "$WORK/out/manifest0" \
            --summary "$WORK/out/scan.env" --progress "$WORK/out/progress" --stop "$WORK/out/stop"
          printf 'modified-after-scan' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'new-after-scan' > "$WORK/data/user/0/com.example.app/cache/new.tmp"
          /tmp/baize-engine clean-cache-snapshot \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --manifest "$WORK/out/manifest0" --max-file-bytes 99999999 \
            --report "$WORK/out/clean.tsv" --summary "$WORK/out/clean.env" \
            --progress "$WORK/out/progress2" --stop "$WORK/out/stop2"
          test ! -e "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          test ! -e "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          grep -qx 'modified-after-scan' "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          grep -qx 'new-after-scan' "$WORK/data/user/0/com.example.app/cache/new.tmp"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package Alpha 5 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify Alpha 5 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.1.0-alpha5-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.0-alpha5'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22405'
          unzip -p "$ZIP" one-pass-scan.sh | grep -q 'auto_bootstrap_serial'
          unzip -p "$ZIP" one-pass-scan.sh | grep -q 'scan_parallel_min_gain_percent'
          unzip -p "$ZIP" one-pass-scan.sh | grep -q 'root-worker-profile.env'
          grep -q 'versionName = "2.1.0-alpha5"' v2/app/build.gradle.kts
          grep -q 'versionCode = 22405' v2/app/build.gradle.kts
          strings v2/build/native/arm64-v8a/baize_engine | grep -q '43.3-alpha4-bounded-parallel'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified Alpha 5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/alpha5-payload
          rm -f .github/workflows/export-v210-alpha5.yml
          rm -f .github/workflows/v2.1.0-alpha5-adaptive-workers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(v2): learn serial versus parallel scan policy'
          git push origin HEAD:perf/v2.1.0-alpha5-adaptive-workers

      - name: Upload Alpha 5 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha5-Adaptive-Workers
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.0-alpha5-Module.zip
            v2/dist/BaiZe-v2.1.0-alpha5-Module.zip.sha256
