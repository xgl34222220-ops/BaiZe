name: BaiZe v2.1.0 Alpha 6 Performance Panel

on:
  pull_request:
    branches: [perf/v2.1.0-alpha5-adaptive-workers]
    paths:
      - '.github/workflows/v2.1.0-alpha6-performance-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 6 branch
        uses: actions/checkout@v4
        with:
          ref: perf/v2.1.0-alpha6-performance-panel
          fetch-depth: 0

      - name: Apply Alpha 6 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/alpha6/apply_versions.py
          python3 .github/alpha6/apply_models.py
          python3 .github/alpha6/apply_services.py
          python3 .github/alpha6/apply_material.py
          python3 .github/alpha6/apply_miuix.py
          git diff --check
          sh -n v2/module/one-pass-scan.sh
          sh -n v2/module/service.sh
          sh -n v2/scripts/package-module.sh

      - name: Verify performance policy bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'String resetScanWorkerProfile();' v2/app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          grep -q 'scan_root_workers' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'scanPerformanceJson()' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q 'root-worker-profile.env' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          grep -q '扫描性能策略' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt
          grep -q '扫描性能策略' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt
          grep -q '固定双进程只影响扫描' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt
          grep -q '固定双进程只影响扫描' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt').read_text()
          start = text.index('private fun resetScanWorkerProfileJson')
          end = text.index('private fun taskHistoryJson', start)
          reset = text[start:end]
          assert 'root-worker-profile.env' in reset
          for forbidden in ('cache_scan.env', 'history.tsv', 'whitelist.conf', 'deleteRecursively'):
              assert forbidden not in reset, forbidden
          PY

      - name: Build host scanner
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Wformat=2 -Wshadow -Wconversion \
            v2/native/baize_engine_42_4.c -o /tmp/baize-engine

      - name: Recheck immutable snapshot safety
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/alpha6-snapshot
          rm -rf "$WORK"
          mkdir -p "$WORK/data/user/0/com.example.app/cache" "$WORK/media/0/Android/data/com.example.app/cache" "$WORK/out"
          printf 'stable-original' > "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          printf 'will-change' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'external-stable' > "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          : > "$WORK/whitelist"
          : > "$WORK/packages"
          /tmp/baize-engine scan-cache \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --min-age-days 0 --max-file-bytes 99999999 \
            --report "$WORK/out/scan.tsv" --targets "$WORK/out/targets" \
            --items "$WORK/out/items.tsv" --manifest "$WORK/out/manifest0" \
            --summary "$WORK/out/scan.env" --progress "$WORK/out/progress" --stop "$WORK/out/stop"
          printf 'modified-after-scan' > "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          printf 'new-after-scan' > "$WORK/data/user/0/com.example.app/cache/new.tmp"
          /tmp/baize-engine clean-cache-snapshot \
            --data-root "$WORK/data" --media-root "$WORK/media" \
            --whitelist "$WORK/whitelist" --package-whitelist "$WORK/packages" \
            --manifest "$WORK/out/manifest0" --max-file-bytes 99999999 \
            --report "$WORK/out/clean.tsv" --summary "$WORK/out/clean.env" \
            --progress "$WORK/out/progress2" --stop "$WORK/out/stop2"
          test ! -e "$WORK/data/user/0/com.example.app/cache/stable.tmp"
          test ! -e "$WORK/media/0/Android/data/com.example.app/cache/external.tmp"
          grep -qx 'modified-after-scan' "$WORK/data/user/0/com.example.app/cache/changed.tmp"
          grep -qx 'new-after-scan' "$WORK/data/user/0/com.example.app/cache/new.tmp"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package Alpha 6 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify Alpha 6 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.1.0-alpha6-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.0-alpha6'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22406'
          unzip -p "$ZIP" one-pass-scan.sh | grep -q '43.5-alpha6-performance-panel'
          grep -q 'versionName = "2.1.0-alpha6"' v2/app/build.gradle.kts
          grep -q 'versionCode = 22406' v2/app/build.gradle.kts
          grep -q 'resetScanWorkerProfile' v2/app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified Alpha 6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/alpha6
          rm -f .github/workflows/export-v210-alpha6.yml
          rm -f .github/workflows/v2.1.0-alpha6-performance-panel.yml
          rm -f v2/V2.1-ALPHA6-PLAN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(v2): expose adaptive scan policy in native app'
          git push origin HEAD:perf/v2.1.0-alpha6-performance-panel

      - name: Upload Alpha 6 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha6-Performance-Panel
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.0-alpha6-Module.zip
            v2/dist/BaiZe-v2.1.0-alpha6-Module.zip.sha256
