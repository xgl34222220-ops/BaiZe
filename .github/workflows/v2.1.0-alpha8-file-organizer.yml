name: BaiZe v2.1.0 Alpha 8 File Organizer

on:
  pull_request:
    branches: [feat/v2.1.0-alpha7-system-cache]
    paths:
      - '.github/workflows/v2.1.0-alpha8-file-organizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Alpha 8 branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2.1.0-alpha8-file-organizer
          fetch-depth: 0

      - name: Apply direct Alpha 8 source patches
        shell: bash
        run: |
          set -euo pipefail
          find .github/alpha8-direct -maxdepth 1 -type f -name 'part-*.patch' ! -name 'part-13-*' -print | sort | xargs cat > /tmp/alpha8-main.patch
          git apply --check /tmp/alpha8-main.patch
          git apply /tmp/alpha8-main.patch
          cat .github/alpha8-direct/part-13-*.patch > /tmp/alpha8-ownership.patch
          git apply --check /tmp/alpha8-ownership.patch
          git apply /tmp/alpha8-ownership.patch
          git diff --check
          sh -n v2/module/one-pass-scan.sh
          sh -n v2/scripts/package-module.sh

      - name: Verify exact Alpha 8 source
        shell: bash
        run: |
          set -euo pipefail
          echo '449bc80339ddea6afa6437a6bf982e13c0f405859bc7e969e0e016f7064bed0b  v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt' | sha256sum -c -
          echo '36418aab5a9e5f3e4fef475b93c0f8f44f223eb4d05de40e13eea822bca86cba  v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerActivity.kt' | sha256sum -c -
          echo 'b16a950be40e4349a967520d66e7688f636e712e3f5c234c6111fbceb8426a55  v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt' | sha256sum -c -
          echo 'efa8d8489417a841c411f00d4ce1dcbd9e22d60c3096e47935c50869a99e605c  v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/CleanContract.kt' | sha256sum -c -
          echo '94decf6efcbe809c577671b8981259eae4745d629b8e89455dc7bd369264dea3  v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt' | sha256sum -c -
          echo '8c2a3ac49cbff7141cebcd4816b2de3ce745daf2382c9e1ca0a551da0cf4e98d  v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt' | sha256sum -c -

      - name: Verify automatic policy and empty-directory fix
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '扫描工作进程|扫描性能策略|固定双进程|固定串行|onScanWorkerModeChanged|onResetScanPerformance' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean
          grep -q 'put("scan_root_workers", 0)' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'scanRootWorkers = 0' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'exec "$MODDIR/one-pass-scan.sh"' v2/module/native-scan.sh
          grep -q 'root-worker-profile.env' v2/module/one-pass-scan.sh
          ENGINE=v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt
          grep -q 'walkProtectedEmptyShells' "$ENGINE"
          grep -q 'visitor(file, true)' "$ENGINE"
          grep -q 'target.isDirectory && isEmptyDirectory(target)' "$ENGINE"
          grep -q 'mounts.contains(path)' "$ENGINE"
          grep -q 'isSymlink(target)' "$ENGINE"

      - name: Verify organizer safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
          UI=v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerActivity.kt
          AIDL=v2/app/src/main/aidl/io/github/xgl34222220/baize/root/IProfileRootService.aidl
          grep -q 'scanFileOrganizer' "$AIDL"
          grep -q 'applyFileOrganizer' "$AIDL"
          grep -q 'undoFileOrganizer' "$AIDL"
          grep -q 'validSnapshot(snapshotId)' "$ENGINE"
          grep -q 'fingerprint(source) != item.fingerprint' "$ENGINE"
          grep -q 'Os.lstat' "$ENGINE"
          grep -q 'Os.rename' "$ENGINE"
          grep -q 'sha256(source) != sha256(temp)' "$ENGINE"
          grep -q 'destination.exists()' "$ENGINE"
          grep -q 'normalizeSharedOwnership' "$ENGINE"
          grep -q 'restoreOriginalMetadata' "$ENGINE"
          grep -q 'organizer-last.json' "$ENGINE"
          grep -q '/data/user' "$ENGINE"
          grep -q '/data/user_de' "$ENGINE"
          grep -q '/Android/data/' "$ENGINE"
          grep -q '/Android/media/' "$ENGINE"
          grep -q 'BaiZe归类' "$ENGINE"
          grep -q '归类所选' "$UI"
          ! grep -q 'AlertDialog' "$UI"
          ! grep -q 'sourcePathJson' "$UI"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package Alpha 8 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify Alpha 8 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.1.0-alpha8-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.0-alpha8'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22408'
          grep -q 'versionName = "2.1.0-alpha8"' v2/app/build.gradle.kts
          grep -q 'versionCode = 22408' v2/app/build.gradle.kts
          grep -q 'FileOrganizerActivity' v2/app/src/main/AndroidManifest.xml
          grep -q 'native-c-arm64-cache-v43.7-alpha8-organizer' v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeRootService.kt
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Commit verified Alpha 8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/alpha8-direct .github/alpha8-payload
          rm -f .github/alpha8-direct-marker.txt
          rm -f .github/workflows/export-alpha8-workspace.yml
          rm -f .github/workflows/v2.1.0-alpha8-file-organizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v2): organize all download roots and fix empty items'
          git push origin HEAD:feat/v2.1.0-alpha8-file-organizer

      - name: Upload Alpha 8 module
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha8-File-Organizer
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.0-alpha8-Module.zip
            v2/dist/BaiZe-v2.1.0-alpha8-Module.zip.sha256
