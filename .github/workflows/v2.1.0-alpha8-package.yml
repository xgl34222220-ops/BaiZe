name: BaiZe v2.1.0 Alpha 8 Package

on:
  pull_request:
    branches: [feat/v2.1.0-alpha7-system-cache]
    paths:
      - '.github/workflows/v2.1.0-alpha8-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.1.0-alpha8-file-organizer
          fetch-depth: 0

      - name: Verify committed source
        shell: bash
        run: |
          set -euo pipefail
          echo '449bc80339ddea6afa6437a6bf982e13c0f405859bc7e969e0e016f7064bed0b  v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt' | sha256sum -c -
          echo '5ab38c7b75a06b9887bfe0e139b04a69435fe21585684fa9fe68338915f187f9  v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerActivity.kt' | sha256sum -c -
          echo 'b16a950be40e4349a967520d66e7688f636e712e3f5c234c6111fbceb8426a55  v2/app/src/main/java/io/github/xgl34222220/baize/root/NativeProfileEngine.kt' | sha256sum -c -
          grep -q '^version=v2.1.0-alpha8$' v2/module/module.prop
          grep -q '^versionCode=22408$' v2/module/module.prop
          grep -q 'Alpha 8' v2/module/module.prop
          ! grep -R -n -E '扫描工作进程|扫描性能策略|固定双进程|固定串行|onScanWorkerModeChanged|onResetScanPerformance' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean
          ! grep -q 'AlertDialog' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerActivity.kt
          sh -n v2/module/one-pass-scan.sh
          sh -n v2/scripts/package-module.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Package and verify module
        shell: bash
        run: |
          set -euo pipefail
          cd v2
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2.1.0-alpha8-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.0-alpha8'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22408'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.0-alpha8-File-Organizer
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.0-alpha8-Module.zip
            v2/dist/BaiZe-v2.1.0-alpha8-Module.zip.sha256

      - name: Remove temporary packaging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v2.1.0-alpha8-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(v2): remove Alpha 8 packaging workflow'
          git push origin HEAD:feat/v2.1.0-alpha8-file-organizer
