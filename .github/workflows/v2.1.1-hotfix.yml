name: BaiZe v2.1.1 Hotfix

on:
  push:
    branches:
      - main
      - fix/v2.1.1-performance-apk-icons
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          sh -n v2/module/apk-snapshot-scan.sh
          sh -n v2/module/apk-snapshot-clean.sh
          sh -n v2/module/one-pass-scan.sh
          sh -n v2/scripts/build-native.sh
          sh -n v2/scripts/package-module.sh
          grep -q 'versionName = "2.1.1"' v2/app/build.gradle.kts
          grep -q 'versionCode = 22501' v2/app/build.gradle.kts
          grep -qx 'version=v2.1.1' v2/module/module.prop
          grep -qx 'versionCode=22501' v2/module/module.prop
          grep -q 'produceState<Bitmap?>' v2/app/src/main/java/io/github/xgl34222220/baize/InstantCacheActivity.kt
          grep -q 'AppIconCache.load' v2/app/src/main/java/io/github/xgl34222220/baize/InstantCacheActivity.kt
          grep -q 'contentType = { "app" }' v2/app/src/main/java/io/github/xgl34222220/baize/InstantCacheActivity.kt
          grep -q 'shadowElevation = 0.dp' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt
          ! grep -q '\.shadow(' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt
          grep -q 'apk-snapshot-v2.1.1-generic-roots' v2/module/apk-snapshot-scan.sh
          grep -q 'Android/media' v2/module/apk-snapshot-scan.sh
          grep -q 'Android/data' v2/module/apk-snapshot-scan.sh
          grep -q 'TRIGGER" = "manual' v2/module/apk-snapshot-scan.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Android App
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee android-build.log

      - name: Upload Android build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.1-build-failure-log
          path: v2/android-build.log
          if-no-files-found: ignore

      - name: Package v2.1.1 module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify final package
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.1.1-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.1.1'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22501'
          unzip -p "$ZIP" apk-scanner.sh | grep -q 'apk-snapshot-v2.1.1-generic-roots'
          unzip -p "$ZIP" app/baize.apk.sha256 | grep -Eq '^[a-f0-9]{64}$'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload v2.1.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.1.1-Performance-APK-Icons
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.1.1-Module.zip
            v2/dist/BaiZe-v2.1.1-Module.zip.sha256
            v2/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.1.1
          ZIP=v2/dist/BaiZe-v2.1.1-Module.zip
          SHA=v2/dist/BaiZe-v2.1.1-Module.zip.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title '白泽 v2.1.1' --notes-file RELEASE_NOTES_V2.1.1.md
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --target "$GITHUB_SHA" \
              --title '白泽 v2.1.1' \
              --notes-file RELEASE_NOTES_V2.1.1.md \
              --latest
          fi
