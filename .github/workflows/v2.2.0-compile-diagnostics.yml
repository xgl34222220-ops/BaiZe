name: BaiZe v2.2.0 Compile Diagnostics

on:
  push:
    branches:
      - feat/v2.2.0-core-rework
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile app and benchmark
        id: compile
        working-directory: v2
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:compileReleaseKotlin :macrobenchmark:compileDebugKotlin > compile-diagnostics.log 2>&1
          status=$?
          tail -n 250 compile-diagnostics.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compile diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.0-compile-diagnostics
          if-no-files-found: error
          path: v2/compile-diagnostics.log
      - name: Fail after artifact upload
        if: steps.compile.outputs.status != '0'
        run: exit 1
