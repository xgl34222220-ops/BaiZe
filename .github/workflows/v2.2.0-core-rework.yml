name: BaiZe v2.2.3 Records Review Test

on:
  push:
    branches:
      - fix/v2.2.3-records-icons-protected-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baize-v223-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.2.3 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.v223-plan-placeholder
          python3 tools/apply-v223-ui-records.py
          python3 tools/apply-v223-dashboard-records.py
          python3 tools/apply-v223-version.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/.v223-plan-placeholder \
            tools/apply-v223-ui-records.py \
            tools/apply-v223-dashboard-records.py \
            tools/apply-v223-version.py
          git diff --check
          grep -q 'versionName = "2.2.3"' v2/app/build.gradle.kts
          grep -q 'versionCode = 22603' v2/app/build.gradle.kts
          grep -qx 'version=v2.2.3' v2/module/module.prop
          grep -qx 'versionCode=22603' v2/module/module.prop
          grep -q 'QUERY_ALL_PACKAGES' v2/app/src/main/AndroidManifest.xml
          grep -q 'ProtectedReviewActivity' v2/app/src/main/AndroidManifest.xml
          grep -q 'PersistentAppIconStore' v2/app/src/main/java/io/github/xgl34222220/baize/ui/common/AppPackageIcon.kt
          grep -q 'context.filesDir' v2/app/src/main/java/io/github/xgl34222220/baize/ui/common/AppPackageIcon.kt
          grep -q 'AppPackageIconPreloader' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt
          grep -q '异常与受保护项目' v2/app/src/main/java/io/github/xgl34222220/baize/ui/history/miuix/HistoryScreenMiuix.kt
          grep -q 'lastTaskTime' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'last_protected_items' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          ! grep -q 'Logs("日志"' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          ! grep -q 'applyV221SourceHotfix' v2/app/build.gradle.kts
          test -s v2/app/src/main/java/io/github/xgl34222220/baize/ProtectedReviewActivity.kt
          sh -n v2/scripts/package-module.sh
          sh -n v2/module/storage-index.sh
          sh -n v2/module/one-pass-scan.sh

      - name: Test shared index coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baize-index-test
          mkdir -p \
            /tmp/baize-index-test/media/0/Tencent/QQfile_recv \
            /tmp/baize-index-test/media/0/Android/media/org.telegram.messenger/Telegram \
            /tmp/baize-index-test/media/0/Android/data/nu.gpu.nagramx/files/Download \
            /tmp/baize-index-test/state
          printf apk > /tmp/baize-index-test/media/0/Tencent/QQfile_recv/qq-test.apk
          printf apks > /tmp/baize-index-test/media/0/Android/media/org.telegram.messenger/Telegram/telegram-test.apks
          printf xapk > /tmp/baize-index-test/media/0/Android/data/nu.gpu.nagramx/files/Download/nagramx-test.xapk
          BAIZE_STATE_DIR=/tmp/baize-index-test/state \
          BAIZE_MEDIA_ROOT=/tmp/baize-index-test/media \
          bash v2/module/storage-index.sh refresh ci
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/baize-index-test/state/index/storage-files.nul').read_bytes().split(b'\0')
          names = {Path(p.decode()).name for p in data if p}
          required = {'qq-test.apk', 'telegram-test.apks', 'nagramx-test.xapk'}
          assert not (required - names), f'missing fixtures: {required - names}'
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build release app and benchmark APK
        id: android_build
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :macrobenchmark:assemble 2>&1 | tee android-build.log

      - name: Upload Android build failure log
        if: failure() && steps.android_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.3-android-build-failure
          if-no-files-found: warn
          path: v2/android-build.log

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=v2/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -Eq 'baseline.prof|baseline.profm|dexopt/baseline'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" --file AndroidManifest.xml \
            > /tmp/baize-v223-manifest.txt
          grep -q 'io.github.xgl34222220.baize.ProtectedReviewActivity' /tmp/baize-v223-manifest.txt
          grep -q 'android.permission.QUERY_ALL_PACKAGES' /tmp/baize-v223-manifest.txt
          test -s v2/app/build/outputs/mapping/release/mapping.txt
          grep -q 'ProtectedReviewActivity' v2/app/build/outputs/mapping/release/mapping.txt
          grep -q 'PersistentAppIconStore' v2/app/build/outputs/mapping/release/mapping.txt

      - name: Package module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify final module
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.2.3-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.2.3'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22603'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'bin/arm64-v8a/baize_engine'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          cp "$ZIP" v2/dist/BaiZe-v2.2.3-Records-Protected-Review-Test-Module.zip
          sha256sum v2/dist/BaiZe-v2.2.3-Records-Protected-Review-Test-Module.zip \
            | tee v2/dist/BaiZe-v2.2.3-Records-Protected-Review-Test-Module.zip.sha256

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.3-Records-Protected-Review-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.2.3-Records-Protected-Review-Test-Module.zip
            v2/dist/BaiZe-v2.2.3-Records-Protected-Review-Test-Module.zip.sha256
            v2/app/build/outputs/apk/release/app-release.apk
            v2/android-build.log
