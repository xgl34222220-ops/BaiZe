name: BaiZe v2.3.0 Trusted Test Builder

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baize-v230-trusted-test-builder
  cancel-in-progress: false

jobs:
  build-v230-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted v2.3.0 branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2.3.0-stabilization
          fetch-depth: 0

      - name: Materialize final v2.3.0 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          changed=false

          if [ -f tools/prepare-v230-materialization.py ]; then
            python3 -m py_compile tools/prepare-v230-materialization.py
            python3 tools/prepare-v230-materialization.py
            changed=true
          fi

          if [ -f tools/bootstrap-v230.py.gz.b64 ]; then
            base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d > /tmp/bootstrap-v230.py
            python3 -m py_compile /tmp/bootstrap-v230.py
            python3 /tmp/bootstrap-v230.py
            rm -f tools/bootstrap-v230.py.gz.b64
            changed=true
          fi

          if [ -f tools/finalize-v230.py.gz.b64 ]; then
            base64 -d tools/finalize-v230.py.gz.b64 | gzip -d > /tmp/finalize-v230.py
            python3 -m py_compile /tmp/finalize-v230.py
            python3 /tmp/finalize-v230.py
            rm -f tools/finalize-v230.py.gz.b64
            changed=true
          fi

          if [ -f tools/fix-v230-android-lint.py ]; then
            python3 -m py_compile tools/fix-v230-android-lint.py
            python3 tools/fix-v230-android-lint.py
            changed=true
          fi

          if [ -f tools/apply-v230-organizer-download-coverage.py ]; then
            python3 -m py_compile tools/apply-v230-organizer-download-coverage.py
            python3 tools/apply-v230-organizer-download-coverage.py
            changed=true
          fi

          git diff --check
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Verify QQ and generic app organizer coverage
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'withContext(Dispatchers.Main.immediate)' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
          grep -q 'ROOT_BIND_ATTEMPTS = 3' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
          grep -q 'discover_app_user_roots' v2/module/storage-index.sh
          grep -q 'QQfile_recv' v2/module/storage-index.sh
          grep -q '"attachment", "attachments"' v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
          sh -n v2/module/storage-index.sh

          ROOT=/tmp/baize-organizer
          rm -rf "$ROOT"
          mkdir -p \
            "$ROOT/media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv" \
            "$ROOT/media/0/Android/data/com.example.browser/private/received" \
            "$ROOT/media/0/Android/data/com.example.mail/data/attachments" \
            "$ROOT/media/0/Android/data/com.example.browser/cache/Download" \
            "$ROOT/state"
          printf 'qq-module' > "$ROOT/media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu-Test.zip"
          printf 'browser-apk' > "$ROOT/media/0/Android/data/com.example.browser/private/received/browser-test.apk"
          printf 'mail-pdf' > "$ROOT/media/0/Android/data/com.example.mail/data/attachments/manual.pdf"
          printf 'cache-file' > "$ROOT/media/0/Android/data/com.example.browser/cache/Download/must-not-index.zip"
          BAIZE_MEDIA_ROOT="$ROOT/media" BAIZE_STATE_DIR="$ROOT/state" bash v2/module/storage-index.sh refresh organizer-ci
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/baize-organizer')
          paths = {p.decode() for p in (root/'state/index/storage-files.nul').read_bytes().split(b'\0') if p}
          required = {
              str(root/'media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu-Test.zip'),
              str(root/'media/0/Android/data/com.example.browser/private/received/browser-test.apk'),
              str(root/'media/0/Android/data/com.example.mail/data/attachments/manual.pdf'),
          }
          assert not (required - paths), f'missing: {sorted(required - paths)}'
          assert not any(p.endswith('must-not-index.zip') for p in paths)
          PY

      - name: Commit materialized source
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize v2.3.0 organizer test source"
            git push origin HEAD:feat/v2.3.0-stabilization
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build test APK
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee android-build.log

      - name: Package test module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2.3.0-Module.zip
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$ZIP" storage-index.sh | grep -q 'discover_app_user_roots'
          unzip -p "$ZIP" storage-index.sh | grep -q 'QQfile_recv'
          cp "$ZIP" dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip
          sha256sum dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip > dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip.sha256
          cp "$APK" dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk
          sha256sum dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk > dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk.sha256

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-QQ-Organizer-Root-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip.sha256
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk.sha256
            v2/android-build.log
