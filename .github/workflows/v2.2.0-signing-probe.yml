name: BaiZe v2.2.0 Signing Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2.2.0-signing-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record secret availability without exposing values
        env:
          BAIZE_KEYSTORE_B64: ${{ secrets.BAIZE_KEYSTORE_BASE64 }}
          GENERIC_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          BAIZE_STORE_PASSWORD: ${{ secrets.BAIZE_KEYSTORE_PASSWORD }}
          GENERIC_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BAIZE_ALIAS: ${{ secrets.BAIZE_KEY_ALIAS }}
          GENERIC_ALIAS: ${{ secrets.KEY_ALIAS }}
          BAIZE_KEY_PASSWORD_SECRET: ${{ secrets.BAIZE_KEY_PASSWORD }}
          GENERIC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          present() { [[ -n "$1" ]] && printf yes || printf no; }
          {
            echo "keystore=$(present "${BAIZE_KEYSTORE_B64:-${GENERIC_KEYSTORE_B64:-}}")"
            echo "store_password=$(present "${BAIZE_STORE_PASSWORD:-${GENERIC_STORE_PASSWORD:-}}")"
            echo "alias=$(present "${BAIZE_ALIAS:-${GENERIC_ALIAS:-}}")"
            echo "key_password=$(present "${BAIZE_KEY_PASSWORD_SECRET:-${GENERIC_KEY_PASSWORD:-}}")"
          } > .github/signing-probe-status.txt
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/signing-probe-status.txt
          git commit -m 'ci(v2.2.0): record signing readiness' || exit 0
          git push origin HEAD:main
