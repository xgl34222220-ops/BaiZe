name: BaiZe v2.2.4 Background Task Recovery

on:
  push:
    branches:
      - fix/v2.2.4-background-task-recovery
  pull_request:
    branches:
      - fix/v2.2.3-records-icons-protected-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baize-v224-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.2.3 and v2.2.4 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.v223-plan-placeholder
          python3 tools/apply-v223-ui-records.py
          python3 tools/apply-v223-dashboard-records.py
          python3 tools/apply-v223-version.py
          python3 tools/apply-v224-background-recovery.py

      - name: Verify background recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/.v223-plan-placeholder \
            tools/apply-v223-ui-records.py \
            tools/apply-v223-dashboard-records.py \
            tools/apply-v223-version.py \
            tools/apply-v224-background-recovery.py
          git diff --check
          ACTIVITY=v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'data class RemoteTaskProbe' "$ACTIVITY"
          grep -q 'recoverRemoteTaskOrRefresh' "$ACTIVITY"
          grep -q 'startRecoveredTaskPoll' "$ACTIVITY"
          grep -q 'probeRemoteTask' "$ACTIVITY"
          grep -q '后台 Root 任务仍在执行，已恢复实时进度' "$ACTIVITY"
          grep -q '可切到后台，Root 会继续执行' "$ACTIVITY"
          grep -q 'taskPhase = if (dashboardState.value.running)' "$ACTIVITY"
          grep -q 'recoveryProbeJob?.cancel()' "$ACTIVITY"
          grep -q 'versionName = "2.2.4"' v2/app/build.gradle.kts
          grep -q 'versionCode = 22604' v2/app/build.gradle.kts
          grep -qx 'version=v2.2.4' v2/module/module.prop
          grep -qx 'versionCode=22604' v2/module/module.prop
          ! grep -q 'Logs("日志"' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          sh -n v2/scripts/package-module.sh
          sh -n v2/module/storage-index.sh
          sh -n v2/module/one-pass-scan.sh

      - name: Test recovery ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt').read_text()
          profile = text.index('override fun onServiceConnected', text.index('profileConnection'))
          recover = text.index('recoverRemoteTaskOrRefresh(runPendingActions = true)', profile)
          pending = text.find('runPendingActionsIfReady()', profile, recover)
          assert pending == -1, 'pending actions run before remote task recovery'
          resume = text.index('override fun onResume()')
          assert text.index('recoverRemoteTaskOrRefresh()', resume) < text.index('private fun refreshAll()', resume)
          render = text[text.index('private fun renderTaskState'):text.index('private fun stopTask')]
          assert 'if (!json.optBoolean("running")) return' in render
          assert 'running = true' in render
          recovery = text[text.index('private fun startRecoveredTaskPoll'):text.index('private fun connectPrimaryService')]
          assert 'idleConfirmations < 2' in recovery
          assert 'if (!probe.complete)' in recovery
          PY

      - name: Test shared index coverage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baize-index-test
          mkdir -p \
            /tmp/baize-index-test/media/0/Tencent/QQfile_recv \
            /tmp/baize-index-test/media/0/Android/media/org.telegram.messenger/Telegram \
            /tmp/baize-index-test/media/0/Android/data/nu.gpu.nagramx/files/Download \
            /tmp/baize-index-test/state
          printf apk > /tmp/baize-index-test/media/0/Tencent/QQfile_recv/qq-test.apk
          printf apks > /tmp/baize-index-test/media/0/Android/media/org.telegram.messenger/Telegram/telegram-test.apks
          printf xapk > /tmp/baize-index-test/media/0/Android/data/nu.gpu.nagramx/files/Download/nagramx-test.xapk
          BAIZE_STATE_DIR=/tmp/baize-index-test/state \
          BAIZE_MEDIA_ROOT=/tmp/baize-index-test/media \
          bash v2/module/storage-index.sh refresh ci
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/baize-index-test/state/index/storage-files.nul').read_bytes().split(b'\0')
          names = {Path(p.decode()).name for p in data if p}
          required = {'qq-test.apk', 'telegram-test.apks', 'nagramx-test.xapk'}
          assert not (required - names), f'missing fixtures: {required - names}'
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build release app and benchmark APK
        id: android_build
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :macrobenchmark:assemble 2>&1 | tee android-build.log

      - name: Upload Android build failure log
        if: failure() && steps.android_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.4-android-build-failure
          if-no-files-found: warn
          path: v2/android-build.log

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=v2/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -Eq 'baseline.prof|baseline.profm|dexopt/baseline'
          unzip -Z1 "$APK" | grep -q '^classes.*dex$'

      - name: Package module
        working-directory: v2
        run: sh scripts/package-module.sh

      - name: Verify final module
        shell: bash
        run: |
          set -euo pipefail
          ZIP=v2/dist/BaiZe-v2.2.4-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.2.4'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=22604'
          unzip -l "$ZIP" | grep -q 'app/baize.apk'
          unzip -l "$ZIP" | grep -q 'bin/arm64-v8a/baize_engine'
          ! unzip -Z1 "$ZIP" | grep -Eq '^(webroot|webui|www|ksu-webui)/'
          cp "$ZIP" v2/dist/BaiZe-v2.2.4-Background-Task-Recovery-Test-Module.zip
          sha256sum v2/dist/BaiZe-v2.2.4-Background-Task-Recovery-Test-Module.zip \
            | tee v2/dist/BaiZe-v2.2.4-Background-Task-Recovery-Test-Module.zip.sha256

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.4-Background-Task-Recovery-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.2.4-Background-Task-Recovery-Test-Module.zip
            v2/dist/BaiZe-v2.2.4-Background-Task-Recovery-Test-Module.zip.sha256
            v2/app/build/outputs/apk/release/app-release.apk
            v2/android-build.log
