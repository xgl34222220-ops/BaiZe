name: BaiZe v2.3.0 Full Stabilization

on:
  push:
    branches: [feat/v2.3.0-stabilization]
  pull_request:
    branches: [fix/v2.2.5-root-worker-deep-performance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baize-v230-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize final v2.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
          python3 /tmp/bootstrap-v230.py
          base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
          python3 /tmp/finalize-v230.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("v2/module/storage-index.sh")
          lines = path.read_text().splitlines()
          fixed = []
          for line in lines:
              if line.startswith("add_root(){ group=$1 user=$2 volume=$3 depth=$4 root="):
                  line = 'add_root(){ ar_group=$1; ar_user=$2; ar_volume=$3; ar_depth=$4; ar_root=${5%/}; [ -d "$ar_root" ] || return 0; [ ! -L "$ar_root" ] || return 0; grep -Fq "$(printf \'\\t%s\\n\' "$ar_root")" "$ROOTS" 2>/dev/null && return 0; printf \'%s\\t%s\\t%s\\t%s\\t%s\\n\' "$(safe "$ar_group")" "$ar_user" "$(safe "$ar_volume")" "$ar_depth" "$ar_root" >>"$ROOTS"; }'
              elif line.startswith("add_user_root(){ user=$1 root=$2 volume=$3;"):
                  line = 'add_user_root(){ au_user=$1; au_root=$2; au_volume=$3; add_root "共享存储" "$au_user" "$au_volume" 2 "$au_root"; add_root "QQ接收" "$au_user" "$au_volume" 12 "$au_root/Tencent/QQfile_recv"; add_root "TIM接收" "$au_user" "$au_volume" 12 "$au_root/Tencent/Timfile_recv"; for au_path in "$au_root"/Download "$au_root"/Downloads "$au_root"/Documents; do add_root "用户文件" "$au_user" "$au_volume" 12 "$au_path"; done; for au_pkg in "$au_root"/Android/media/*; do [ -d "$au_pkg" ] && add_root "应用媒体:${au_pkg##*/}" "$au_user" "$au_volume" 14 "$au_pkg"; done; for au_pkg in "$au_root"/Android/data/*; do [ -d "$au_pkg" ] || continue; au_name=${au_pkg##*/}; add_root "应用文件:$au_name" "$au_user" "$au_volume" 12 "$au_pkg/files"; add_root "应用下载:$au_name" "$au_user" "$au_volume" 10 "$au_pkg/Download"; add_root "应用下载:$au_name" "$au_user" "$au_volume" 10 "$au_pkg/Downloads"; done; }'
              fixed.append(line)
          text = "\n".join(fixed) + "\n"
          if "ar_root=${5%/}" not in text or "au_root=$2" not in text:
              raise SystemExit("storage-index ash isolation was not applied")
          path.write_text(text)
          PY
          rm -f tools/bootstrap-v230.py.gz.b64 tools/finalize-v230.py.gz.b64 tools/apply-v230-native-path-safety.py.gz.b64
          git diff --check
          tar --exclude=.git -czf /tmp/BaiZe-v2.3.0-Materialized-Source.tar.gz .

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "2.3.0"' v2/app/build.gradle.kts
          grep -q 'versionCode = 23000' v2/app/build.gradle.kts
          grep -qx 'version=v2.3.0' v2/module/module.prop
          grep -qx 'versionCode=23000' v2/module/module.prop
          grep -q 'cacheMinutes: Int = 60' v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt
          grep -q 'listOf(30, 60, 360, 1_440)' v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt
          grep -q 'run_due_group.*\$6' service.sh
          grep -q 'static bool path_join' v2/native/baize_engine_42_4.c
          grep -q 'ar_root=${5%/}' v2/module/storage-index.sh
          ! grep -RIn 'com.google.android.material.color.utilities.Hct' v2/app/src/main/java

      - name: Install BusyBox ash
        run: sudo apt-get update && sudo apt-get install -y busybox-static

      - name: Verify Root framework shell compatibility
        shell: bash
        run: |
          set -euo pipefail
          for script in v2/module/*.sh v2/scripts/*.sh service.sh cleaner.sh; do
            sh -n "$script"
            busybox ash -n "$script"
          done
          grep -q 'BAIZE_STATE_DIR' v2/module/task-worker.sh
          grep -q 'setsid\|nohup' v2/module/task-worker.sh

      - name: Test detached Root worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baize-worker
          mkdir -p /tmp/baize-worker/module /tmp/baize-worker/state/logs
          cp v2/module/task-worker.sh v2/module/worker-runner.sh /tmp/baize-worker/module/
          cat >/tmp/baize-worker/module/cleaner.sh <<'SH'
          #!/bin/sh
          state=${BAIZE_STATE_DIR:?}
          echo "mode=$1" >"$state/running.env"
          sleep 1
          echo "mode=$1" >"$state/latest.env"
          echo "result=fixture-complete" >>"$state/latest.env"
          rm -f "$state/running.env"
          SH
          chmod +x /tmp/baize-worker/module/*.sh
          BAIZE_STATE_DIR=/tmp/baize-worker/state BAIZE_SHELL_BIN=/bin/sh sh /tmp/baize-worker/module/task-worker.sh clean ci fixture-clean detach
          sleep 2
          grep -q '^result=fixture-complete$' /tmp/baize-worker/state/latest.env
          BAIZE_STATE_DIR=/tmp/baize-worker/state BAIZE_SHELL_BIN=/bin/sh sh /tmp/baize-worker/module/task-worker.sh cache-auto ci fixture-cache detach
          sleep 2
          grep -q '^mode=cache-auto$' /tmp/baize-worker/state/latest.env

      - name: Test 30-minute scheduler dispatch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baize-scheduler
          mkdir -p /tmp/baize-scheduler/module /tmp/baize-scheduler/state/logs /tmp/baize-scheduler/bin
          cp service.sh /tmp/baize-scheduler/module/scheduler.sh
          sed -i 's/^sleep 120$/sleep 0/' /tmp/baize-scheduler/module/scheduler.sh
          printf '#!/bin/sh\n[ "$1" = sys.boot_completed ] && echo 1\n' >/tmp/baize-scheduler/bin/getprop
          printf '#!/bin/sh\n[ "$1" = battery ] && printf "level: 90\\ntemperature: 300\\n"\n' >/tmp/baize-scheduler/bin/dumpsys
          cat >/tmp/baize-scheduler/module/task-worker.sh <<'SH'
          #!/bin/sh
          printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" >>"${BAIZE_STATE_DIR:?}/dispatch.tsv"
          SH
          cat >/tmp/baize-scheduler/state/config.conf <<'EOF'
          enabled=1
          screen_off_only=0
          charging_only=0
          device_idle_only=0
          min_battery=0
          max_battery_temp=60
          schedule_cache_enabled=1
          schedule_cache_minutes=30
          schedule_cache_hours=1
          schedule_empty_enabled=0
          schedule_rules_enabled=0
          schedule_fragment_enabled=0
          schedule_deep_enabled=0
          daily_schedule_enabled=0
          EOF
          chmod +x /tmp/baize-scheduler/bin/* /tmp/baize-scheduler/module/*.sh
          set +e
          PATH=/tmp/baize-scheduler/bin:$PATH BAIZE_STATE_DIR=/tmp/baize-scheduler/state timeout 5 busybox ash /tmp/baize-scheduler/module/scheduler.sh
          code=$?
          set -e
          [ "$code" -eq 124 ] || [ "$code" -eq 143 ]
          grep -Eq '^cache-auto[[:space:]]+scheduled:cache[[:space:]]+scheduled-cache-' /tmp/baize-scheduler/state/dispatch.tsv
          grep -q '^state=completed$' /tmp/baize-scheduler/state/scheduler.env

      - name: Test scheduler supervisor recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baize-supervisor
          mkdir -p /tmp/baize-supervisor/module /tmp/baize-supervisor/state/logs
          cp v2/module/supervisor.sh /tmp/baize-supervisor/module/
          cat >/tmp/baize-supervisor/module/scheduler.sh <<'SH'
          #!/bin/sh
          state=${BAIZE_STATE_DIR:?}
          count=$(cat "$state/count" 2>/dev/null || echo 0)
          count=$((count + 1)); echo "$count" >"$state/count"
          [ "$count" -lt 2 ] && exit 9
          sleep 30
          SH
          chmod +x /tmp/baize-supervisor/module/*.sh
          BAIZE_STATE_DIR=/tmp/baize-supervisor/state busybox ash /tmp/baize-supervisor/module/supervisor.sh & supervisor=$!
          sleep 14
          test "$(cat /tmp/baize-supervisor/state/count)" -ge 2
          grep -q '^restart_count=' /tmp/baize-supervisor/state/supervisor.env
          kill "$supervisor" 2>/dev/null || true

      - name: Test multi-user removable-volume index and analysis
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baize-index
          mkdir -p /tmp/baize-index/media/0/Download /tmp/baize-index/media/10/Android/media/org.telegram.messenger /tmp/baize-index/storage/ABCD-1234/Android/data/pkg/files /tmp/baize-index/state
          printf apk >/tmp/baize-index/media/0/Download/a.apk
          printf zip >/tmp/baize-index/media/10/Android/media/org.telegram.messenger/b.zip
          printf txt >/tmp/baize-index/storage/ABCD-1234/Android/data/pkg/files/c.txt
          sed 's#/storage/\*#/tmp/baize-index/storage/*#g; s#/mnt/media_rw/\*#/tmp/baize-index/no-media/*#g' v2/module/storage-index.sh >/tmp/baize-index/index.sh
          BAIZE_STATE_DIR=/tmp/baize-index/state BAIZE_MEDIA_ROOT=/tmp/baize-index/media busybox ash /tmp/baize-index/index.sh refresh ci
          tr '\0' '\n' </tmp/baize-index/state/index/storage-files.nul | grep -q '/0/Download/a.apk'
          tr '\0' '\n' </tmp/baize-index/state/index/storage-files.nul | grep -q '/10/Android/media/.*/b.zip'
          tr '\0' '\n' </tmp/baize-index/state/index/storage-files.nul | grep -q 'ABCD-1234.*/c.txt'
          printf same >/tmp/baize-index/media/0/Download/d1.bin
          cp /tmp/baize-index/media/0/Download/d1.bin /tmp/baize-index/media/0/Download/d2.bin
          printf '%s\0%s\0' /tmp/baize-index/media/0/Download/d1.bin /tmp/baize-index/media/0/Download/d2.bin >/tmp/baize-index/state/index/storage-files.nul
          BAIZE_STATE_DIR=/tmp/baize-index/state busybox ash v2/module/storage-analyzer.sh
          BAIZE_STATE_DIR=/tmp/baize-index/state busybox ash v2/module/duplicate-scanner.sh
          BAIZE_STATE_DIR=/tmp/baize-index/state busybox ash v2/module/large-file-scanner.sh 1
          grep -q 'd2.bin' /tmp/baize-index/state/reports/duplicates.tsv
          test -s /tmp/baize-index/state/reports/storage-analysis.tsv
          BAIZE_STATE_DIR=/tmp/baize-index/state BAIZE_RULES_PATH=config/deep.rules busybox ash v2/module/rules-validator.sh

      - name: Compile strict host native engine
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror v2/native/baize_engine_42_4.c -o /tmp/baize_engine

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Release Lint and Macrobenchmark
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :app:lintRelease :macrobenchmark:assemble 2>&1 | tee android-build.log

      - name: Package and verify v2.3.0 module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2.3.0-Module.zip
          test -s "$ZIP"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=23000'
          for file in app/baize.apk supervisor.sh task-worker.sh worker-runner.sh app-installer.sh diagnostics-export.sh storage-analyzer.sh duplicate-scanner.sh large-file-scanner.sh rules-validator.sh; do unzip -Z1 "$ZIP" | grep -qx "$file"; done
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-Failure-Diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/BaiZe-v2.3.0-Materialized-Source.tar.gz
            v2/android-build.log
            v2/app/build/reports/lint-results-release.html
            v2/app/build/reports/lint-results-release.txt

      - name: Upload v2.3.0 test artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-Stabilization-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.3.0-Module.zip
            v2/dist/BaiZe-v2.3.0-Module.zip.sha256
            v2/app/build/outputs/apk/release/app-release.apk
            v2/android-build.log
            /tmp/BaiZe-v2.3.0-Materialized-Source.tar.gz
