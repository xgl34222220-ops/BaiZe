name: BaiZe v2.3.0 Lint Diagnostic

on:
  pull_request:
    branches: [fix/v2.2.5-root-worker-deep-performance]
  push:
    branches: [feat/v2.3.0-stabilization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baize-v230-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize v2.3.0 source and safety fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
          python3 /tmp/bootstrap-v230.py
          rm -f tools/bootstrap-v230.py.gz.b64
          base64 -d tools/apply-v230-native-path-safety.py.gz.b64 | gzip -d >/tmp/apply-v230-native-path-safety.py
          python3 /tmp/apply-v230-native-path-safety.py
          sed -i 's/clean|scan|cache-clean|empty-clean/clean|scan|cache-auto|cache-clean|empty-clean/' v2/module/task-worker.sh
          rm -f tools/apply-v230-native-path-safety.py.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          path = Path('v2/app/src/main/java/io/github/xgl34222220/baize/NativeNotifier.kt')
          text = path.read_text()
          if 'import android.annotation.SuppressLint' not in text:
              text = text.replace('package io.github.xgl34222220.baize\n\n', 'package io.github.xgl34222220.baize\n\nimport android.annotation.SuppressLint\n', 1)
          text = text.replace(
              '    fun showTaskResult(context: Context, title: String, summary: String, details: String) {',
              '    @SuppressLint("MissingPermission")\n    fun showTaskResult(context: Context, title: String, summary: String, details: String) {'
          )
          text = text.replace(
              '        NotificationManagerCompat.from(context).notify("baize-app-task", NOTIFICATION_ID, notification)',
              '        try {\n            NotificationManagerCompat.from(context).notify("baize-app-task", NOTIFICATION_ID, notification)\n        } catch (_: SecurityException) {\n            // Permission or OEM policy changed between the check and the post.\n        }'
          )
          path.write_text(text)
          PY
          git diff --check
          tar --exclude=.git -czf /tmp/BaiZe-v2.3.0-Lint-Source.tar.gz .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run complete Release Lint
        id: lint
        continue-on-error: true
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintRelease 2>&1 | tee lint-build.log

      - name: Upload complete Lint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-Lint-Diagnostic
          if-no-files-found: warn
          path: |
            /tmp/BaiZe-v2.3.0-Lint-Source.tar.gz
            v2/lint-build.log
            v2/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
            v2/app/build/reports/lint-results-release.html
            v2/app/build/reports/lint-results-release.xml

      - name: Fail when Lint still reports errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
