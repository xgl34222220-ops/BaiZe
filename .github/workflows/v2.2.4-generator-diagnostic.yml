name: BaiZe v2.2.5 Generator Diagnostic

on:
  push:
    branches: [fix/v2.2.5-root-worker-deep-performance]
  pull_request:
    branches: [fix/v2.2.4-background-task-recovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source generators
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/.v223-plan-placeholder
            python3 tools/apply-v223-ui-records.py
            python3 tools/apply-v223-dashboard-records.py
            python3 tools/apply-v223-version.py
            python3 tools/apply-v224-background-recovery.py
            python3 tools/apply-v225-app-version.py
            python3 tools/apply-v225-root-service.py
            python3 tools/apply-v225-cleaner-performance.py
            python3 tools/apply-v225-native-budget.py
            python3 tools/apply-v225-native-wrapper.py
          } 2>&1 | tee v225-generator.log
      - name: Trace invariant checks
        continue-on-error: true
        shell: bash
        run: |
          set -uxo pipefail
          {
            git diff --check
            ACTIVITY=v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
            SERVICE=v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
            ENGINE=v2/native/baize_engine_42_4.c
            grep -q 'json.optBoolean("accepted")' "$ACTIVITY"; echo accepted=$?
            grep -q '最慢目录' "$ACTIVITY"; echo slow_ui=$?
            grep -q 'startDetachedModuleTask' "$SERVICE"; echo detached_service=$?
            grep -q 'worker_launch_timeout' "$SERVICE"; echo launch_timeout=$?
            grep -q 'run_with_watchdog' cleaner.sh; echo watchdog=$?
            grep -q 'deep_slowest_path' cleaner.sh; echo slow_path=$?
            grep -q 'stat_tree_budgeted' "$ENGINE"; echo native_budget=$?
            grep -q -- '--dir-budget-ms' v2/module/native-scan.sh; echo native_arg=$?
            grep -q '^app_task_max_minutes=20$' config/default.conf; echo app_cap=$?
            grep -q 'versionName = "2.2.5"' v2/app/build.gradle.kts; echo version=$?
            grep -qx 'version=v2.2.5' v2/module/module.prop; echo module_version=$?
            sh -n v2/module/task-worker.sh; echo worker_syntax=$?
            sh -n v2/module/native-scan.sh; echo native_syntax=$?
            sh -n v2/scripts/package-module.sh; echo package_syntax=$?
            sh -n cleaner.sh; echo cleaner_syntax=$?
          } 2>&1 | tee v225-invariants.log
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.5-generator-diagnostic
          if-no-files-found: warn
          path: |
            v225-generator.log
            v225-invariants.log
            cleaner.sh
            config/default.conf
            v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
            v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
            v2/app/build.gradle.kts
            v2/module/module.prop
            v2/module/native-scan.sh
            v2/native/baize_engine_42_4.c
            v2/scripts/package-module.sh
      - name: Fail when generation failed
        if: steps.generate.outcome == 'failure'
        run: exit 1
