name: BaiZe v2.2.5 Source Snapshot

on:
  push:
    branches: [fix/v2.2.5-root-worker-deep-performance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.2.3 and v2.2.4 generators
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.v223-plan-placeholder
          python3 tools/apply-v223-ui-records.py
          python3 tools/apply-v223-dashboard-records.py
          python3 tools/apply-v223-version.py
          python3 tools/apply-v224-background-recovery.py
      - name: Upload generated source baseline
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.2.5-source-baseline
          if-no-files-found: error
          path: |
            v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
            v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
            v2/native/baize_engine_42_4.c
            v2/module/cleaner.sh
            v2/module/config/default.conf
            v2/scripts/package-module.sh
            v2/app/build.gradle.kts
            v2/module/module.prop
