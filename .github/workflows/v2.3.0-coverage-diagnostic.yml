name: BaiZe v2.3.0 Organizer Coverage Diagnostic

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: write

jobs:
  diagnose-coverage:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2.3.0 branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2.3.0-stabilization
          fetch-depth: 0

      - name: Diagnose materialized organizer coverage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          LOG=/tmp/baize-v230-coverage.log
          {
            set -x
            if [ -f tools/prepare-v230-materialization.py ]; then python3 tools/prepare-v230-materialization.py; fi
            if [ -f tools/bootstrap-v230.py.gz.b64 ]; then
              base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
              python3 /tmp/bootstrap-v230.py
            fi
            if [ -f tools/finalize-v230.py.gz.b64 ]; then
              base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
              python3 /tmp/finalize-v230.py
            fi
            if [ -f tools/fix-v230-android-lint.py ]; then python3 tools/fix-v230-android-lint.py; fi
            if [ -f tools/apply-v230-organizer-download-coverage.py ]; then python3 tools/apply-v230-organizer-download-coverage.py; fi

            grep -n 'withContext(Dispatchers.Main.immediate)' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
            grep -n 'ROOT_BIND_ATTEMPTS = 3' v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
            grep -n 'discover_app_user_roots' v2/module/storage-index.sh
            grep -n 'QQfile_recv' v2/module/storage-index.sh
            grep -n 'attachment.*attachments' v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
            sh -n v2/module/storage-index.sh

            ROOT=/tmp/baize-organizer
            rm -rf "$ROOT"
            mkdir -p \
              "$ROOT/media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv" \
              "$ROOT/media/0/Android/data/com.example.browser/private/received" \
              "$ROOT/media/0/Android/data/com.example.mail/data/attachments" \
              "$ROOT/media/0/Android/data/com.example.browser/cache/Download" \
              "$ROOT/state"
            printf 'qq-module' > "$ROOT/media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu-Test.zip"
            printf 'browser-apk' > "$ROOT/media/0/Android/data/com.example.browser/private/received/browser-test.apk"
            printf 'mail-pdf' > "$ROOT/media/0/Android/data/com.example.mail/data/attachments/manual.pdf"
            printf 'cache-file' > "$ROOT/media/0/Android/data/com.example.browser/cache/Download/must-not-index.zip"
            BAIZE_MEDIA_ROOT="$ROOT/media" BAIZE_STATE_DIR="$ROOT/state" bash -x v2/module/storage-index.sh refresh organizer-ci
            echo '--- indexed paths ---'
            python3 - <<'PY'
            from pathlib import Path
            root = Path('/tmp/baize-organizer')
            paths = {p.decode() for p in (root/'state/index/storage-files.nul').read_bytes().split(b'\0') if p}
            for path in sorted(paths): print(path)
            required = {
                str(root/'media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu-Test.zip'),
                str(root/'media/0/Android/data/com.example.browser/private/received/browser-test.apk'),
                str(root/'media/0/Android/data/com.example.mail/data/attachments/manual.pdf'),
            }
            missing = required - paths
            print('missing=', sorted(missing))
            print('cache_leaked=', [p for p in paths if p.endswith('must-not-index.zip')])
            assert not missing
            assert not any(p.endswith('must-not-index.zip') for p in paths)
            PY
          } >"$LOG" 2>&1
          code=$?
          {
            echo '# BaiZe v2.3.0 覆盖诊断'
            echo
            echo "- 运行编号：\`$RUN_ID\`"
            echo "- 源码提交：\`$HEAD_SHA\`"
            echo "- 退出代码：\`$code\`"
            echo
            echo '```text'
            tail -n 160 "$LOG" | sed -r 's/\x1B\[[0-9;]*[mK]//g'
            echo '```'
          } >/tmp/status.md
          gh issue edit 91 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
          exit "$code"
