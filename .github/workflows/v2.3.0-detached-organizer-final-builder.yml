name: BaiZe v2.3.0 Detached Organizer Final Builder

on:
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: baize-v230-detached-organizer-final-builder
  cancel-in-progress: true

jobs:
  build-final-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization')
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 独立 Root 归类最终构建

          - 运行编号：\`$RUN_ID\`
          - 状态：**building**
          - 源码提交：\`$HEAD_SHA\`
          EOF
          gh issue edit 94 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - uses: actions/checkout@v4
        with:
          ref: feat/v2.3.0-stabilization
          fetch-depth: 0

      - name: Materialize final detached organizer source
        shell: bash
        run: |
          set -euo pipefail
          cp v2/module/task-worker.sh /tmp/baize-task-worker.detached.sh
          cp v2/scripts/package-module.sh /tmp/baize-package-module.detached.sh
          if [ -f tools/prepare-v230-materialization.py ]; then python3 tools/prepare-v230-materialization.py; fi
          if [ -f tools/bootstrap-v230.py.gz.b64 ]; then
            base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
            python3 -m py_compile /tmp/bootstrap-v230.py
            python3 /tmp/bootstrap-v230.py
          fi
          if [ -f tools/finalize-v230.py.gz.b64 ]; then
            base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
            python3 -m py_compile /tmp/finalize-v230.py
            python3 /tmp/finalize-v230.py
          fi
          if [ -f tools/fix-v230-android-lint.py ]; then python3 tools/fix-v230-android-lint.py; fi
          if [ -f tools/apply-v230-organizer-download-coverage.py ]; then python3 tools/apply-v230-organizer-download-coverage.py; fi
          cp /tmp/baize-task-worker.detached.sh v2/module/task-worker.sh
          cp /tmp/baize-package-module.detached.sh v2/scripts/package-module.sh
          python3 -m py_compile tools/apply-v230-detached-organizer.py tools/fix-v230-detached-organizer-kotlin.py
          python3 tools/apply-v230-detached-organizer.py
          python3 tools/fix-v230-detached-organizer-kotlin.py
          git diff --check

      - name: Verify independent Root ownership
        shell: bash
        run: |
          set -euo pipefail
          ACTIVITY=v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerActivity.kt
          SCHEDULE=v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
          SERVICE=v2/app/src/main/java/io/github/xgl34222220/baize/root/BaiZeProfileRootService.kt
          ENGINE=v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
          grep -q 'runModuleTask("organize")' "$ACTIVITY"
          grep -q 'startOrganizerPoll(waitForStart = true)' "$ACTIVITY"
          grep -q 'runModuleTask("organize")' "$SCHEDULE"
          grep -q 'normalized == "clean" || normalized == "organize"' "$SERVICE"
          grep -q 'organizer-result.env' "$SERVICE"
          grep -q 'Base64.decode' "$ENGINE"
          grep -q 'organizer-worker.sh' v2/module/task-worker.sh
          grep -q 'build_fallback_index' v2/module/organizer-worker.sh
          grep -q 'operation=module-organize' v2/module/organizer-worker.sh
          bash -n v2/module/storage-index.sh
          bash -n v2/module/task-worker.sh
          bash -n v2/module/organizer-worker.sh

      - name: Run real detached filesystem regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-detached-final
          MOD="$ROOT/module"
          MEDIA="$ROOT/media"
          STATE="$ROOT/state"
          rm -rf "$ROOT"
          mkdir -p "$MOD" \
            "$MEDIA/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv" \
            "$MEDIA/0/Android/data/com.example.browser/private/received" \
            "$MEDIA/0/Android/data/com.example.mail/data/attachments" \
            "$MEDIA/0/Android/data/com.example.browser/cache/Download"
          cp v2/module/storage-index.sh "$MOD/storage-index.sh"
          cp v2/module/organizer-worker.sh "$MOD/organizer-worker.sh"
          chmod 0755 "$MOD/storage-index.sh" "$MOD/organizer-worker.sh"
          sed -i 's|/system/bin/sh "$INDEXER"|/bin/bash "$INDEXER"|' "$MOD/organizer-worker.sh"
          printf 'qq-module' >"$MEDIA/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu-Test.zip"
          printf 'browser-apk' >"$MEDIA/0/Android/data/com.example.browser/private/received/browser-test.apk"
          printf 'mail-pdf' >"$MEDIA/0/Android/data/com.example.mail/data/attachments/manual.pdf"
          printf 'cache-file' >"$MEDIA/0/Android/data/com.example.browser/cache/Download/must-not-move.zip"
          BAIZE_MEDIA_ROOT="$MEDIA" BAIZE_STATE_DIR="$STATE" \
            bash "$MOD/organizer-worker.sh" organize ci final-regression
          test -f "$MEDIA/0/BaiZe归类/压缩包/LuoShu-Test.zip"
          test -f "$MEDIA/0/BaiZe归类/安装包/browser-test.apk"
          test -f "$MEDIA/0/BaiZe归类/文档/manual.pdf"
          test -f "$MEDIA/0/Android/data/com.example.browser/cache/Download/must-not-move.zip"
          test ! -f "$MEDIA/0/BaiZe归类/压缩包/must-not-move.zip"
          grep -qx 'requested=3' "$STATE/organizer-result.env"
          grep -qx 'moved=3' "$STATE/organizer-result.env"
          grep -qx 'failed=0' "$STATE/organizer-result.env"
          grep -q 'sourceB64' "$STATE/organizer-last.json"
          grep -q 'destinationB64' "$STATE/organizer-last.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build release APK
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee android-build.log

      - name: Package and verify final test files
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh
          SOURCE_ZIP=dist/BaiZe-v2.3.0-Module.zip
          SOURCE_APK=app/build/outputs/apk/release/app-release.apk
          MODULE=dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test-Module.zip
          APK=dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test.apk
          test -s "$SOURCE_ZIP"
          test -s "$SOURCE_APK"
          unzip -tq "$SOURCE_ZIP"
          unzip -p "$SOURCE_ZIP" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$SOURCE_ZIP" task-worker.sh | grep -q 'organizer-worker.sh'
          unzip -p "$SOURCE_ZIP" organizer-worker.sh | grep -q 'build_fallback_index'
          unzip -p "$SOURCE_ZIP" organizer-worker.sh | grep -q 'operation=module-organize'
          cp "$SOURCE_ZIP" "$MODULE"
          cp "$SOURCE_APK" "$APK"
          sha256sum "$MODULE" >"$MODULE.sha256"
          sha256sum "$APK" >"$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-Detached-Root-Organizer-Test-Final
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test-Module.zip
            v2/dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test-Module.zip.sha256
            v2/dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test.apk
            v2/dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test.apk.sha256
            v2/android-build.log

      - name: Publish final rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.3.0-detached-root-organizer-test
          MODULE=v2/dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test-Module.zip
          APK=v2/dist/BaiZe-v2.3.0-Detached-Root-Organizer-Test.apk
          cat >/tmp/notes.md <<'EOF'
          # 白泽 v2.3.0 独立 Root 文件归类测试版

          - App 只负责提交任务，扫描、分类和移动全部由模块内独立 Root Worker 执行。
          - 切后台、划掉最近任务、关闭页面或重新进入不会中断归类。
          - 重新进入归类页自动恢复当前阶段、文件路径、进度和最终结果。
          - 定时归类同样只提交给独立 Root Worker。
          - 共享索引为空时自动切换独立 Root 兜底发现。
          - 缓存、数据库、临时文件和缩略图目录继续排除。

          测试方式：点一键归类后立刻返回桌面或划掉 App，稍后重新进入检查进度和结果。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title '白泽 v2.3.0 独立 Root 文件归类测试版' --notes-file /tmp/notes.md --prerelease
            gh release upload "$TAG" "$MODULE" "$MODULE.sha256" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$MODULE" "$MODULE.sha256" "$APK" "$APK.sha256" \
              --target feat/v2.3.0-stabilization \
              --title '白泽 v2.3.0 独立 Root 文件归类测试版' \
              --notes-file /tmp/notes.md --prerelease
          fi

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 独立 Root 归类最终构建

          - 运行编号：\`$RUN_ID\`
          - 构建结果：**$RESULT**
          - 源码提交：\`$HEAD_SHA\`
          - 预发行标签：\`v2.3.0-detached-root-organizer-test\`
          - 文件回归：独立 Worker 移动 3 个，失败 0 个，缓存不移动
          EOF
          gh issue edit 94 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
