name: BaiZe v2.3.0 Detached Organizer Package Diagnostic

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  issues: write

concurrency:
  group: baize-v230-detached-organizer-package-diagnostic
  cancel-in-progress: true

jobs:
  diagnose-package:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.3.0-stabilization
          fetch-depth: 0

      - name: Materialize source
        shell: bash
        run: |
          set -euo pipefail
          cp v2/module/task-worker.sh /tmp/baize-task-worker.detached.sh
          cp v2/scripts/package-module.sh /tmp/baize-package-module.detached.sh
          if [ -f tools/prepare-v230-materialization.py ]; then python3 tools/prepare-v230-materialization.py; fi
          if [ -f tools/bootstrap-v230.py.gz.b64 ]; then
            base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
            python3 /tmp/bootstrap-v230.py
          fi
          if [ -f tools/finalize-v230.py.gz.b64 ]; then
            base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
            python3 /tmp/finalize-v230.py
          fi
          if [ -f tools/fix-v230-android-lint.py ]; then python3 tools/fix-v230-android-lint.py; fi
          if [ -f tools/apply-v230-organizer-download-coverage.py ]; then python3 tools/apply-v230-organizer-download-coverage.py; fi
          cp /tmp/baize-task-worker.detached.sh v2/module/task-worker.sh
          cp /tmp/baize-package-module.detached.sh v2/scripts/package-module.sh
          python3 tools/apply-v230-detached-organizer.py
          python3 tools/fix-v230-detached-organizer-kotlin.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build prerequisites
        working-directory: v2
        run: |
          sh scripts/build-native.sh
          gradle --no-daemon :app:assembleRelease

      - name: Trace package and report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set +e
          cd v2
          sh -x scripts/package-module.sh > /tmp/package-trace.log 2>&1
          code=$?
          {
            echo '# BaiZe v2.3.0 独立归类模块封包诊断'
            echo
            echo "- 运行编号：\`$RUN_ID\`"
            echo "- 源码提交：\`$HEAD_SHA\`"
            echo "- 退出代码：\`$code\`"
            echo
            echo '```text'
            tail -n 220 /tmp/package-trace.log
            echo '```'
          } >/tmp/package-diagnostic.md
          gh issue edit 95 --repo "$GITHUB_REPOSITORY" --body-file /tmp/package-diagnostic.md
          exit "$code"
