name: BaiZe v2.3.0 Device Test Builder

on:
  pull_request_target:
    types: [synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: baize-v230-device-test-builder
  cancel-in-progress: true

jobs:
  build-device-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/v2.3.0-stabilization')
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 设备测试构建

          - 运行编号：\`$RUN_ID\`
          - 状态：**building**
          - 源码提交：\`$HEAD_SHA\`
          EOF
          gh issue edit 91 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - name: Checkout v2.3.0 branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2.3.0-stabilization
          fetch-depth: 0

      - name: Materialize final source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/prepare-v230-materialization.py ]; then python3 tools/prepare-v230-materialization.py; fi
          if [ -f tools/bootstrap-v230.py.gz.b64 ]; then
            base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
            python3 -m py_compile /tmp/bootstrap-v230.py
            python3 /tmp/bootstrap-v230.py
          fi
          if [ -f tools/finalize-v230.py.gz.b64 ]; then
            base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
            python3 -m py_compile /tmp/finalize-v230.py
            python3 /tmp/finalize-v230.py
          fi
          if [ -f tools/fix-v230-android-lint.py ]; then python3 tools/fix-v230-android-lint.py; fi
          if [ -f tools/apply-v230-organizer-download-coverage.py ]; then python3 tools/apply-v230-organizer-download-coverage.py; fi
          git diff --check

      - name: Verify required fixes
        shell: bash
        run: |
          set -euo pipefail
          WORKER=v2/app/src/main/java/io/github/xgl34222220/baize/FileOrganizerWorker.kt
          ENGINE=v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
          INDEX=v2/module/storage-index.sh
          grep -q 'withContext(Dispatchers.Main.immediate)' "$WORKER"
          grep -q 'ROOT_BIND_ATTEMPTS = 3' "$WORKER"
          grep -q 'onBindingDied' "$WORKER"
          grep -q 'onNullBinding' "$WORKER"
          grep -q 'discover_app_user_roots' "$INDEX"
          grep -q 'QQfile_recv' "$INDEX"
          grep -q 'attachment' "$ENGINE"
          grep -q 'transfer' "$ENGINE"
          sh -n "$INDEX"
          grep -q 'versionName = "2.3.0"' v2/app/build.gradle.kts
          grep -qx 'version=v2.3.0' v2/module/module.prop

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 engine
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build release APK
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee android-build.log

      - name: Package and verify test module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh
          SOURCE_ZIP=dist/BaiZe-v2.3.0-Module.zip
          SOURCE_APK=app/build/outputs/apk/release/app-release.apk
          MODULE=dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip
          APK=dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk
          test -s "$SOURCE_ZIP"
          test -s "$SOURCE_APK"
          unzip -tq "$SOURCE_ZIP"
          unzip -p "$SOURCE_ZIP" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$SOURCE_ZIP" storage-index.sh | grep -q 'discover_app_user_roots'
          unzip -p "$SOURCE_ZIP" storage-index.sh | grep -q 'QQfile_recv'
          cp "$SOURCE_ZIP" "$MODULE"
          cp "$SOURCE_APK" "$APK"
          sha256sum "$MODULE" >"$MODULE.sha256"
          sha256sum "$APK" >"$APK.sha256"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.3.0-QQ-Organizer-Root-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip.sha256
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk
            v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk.sha256
            v2/android-build.log

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v2.3.0-qq-organizer-test
          MODULE=v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test-Module.zip
          APK=v2/dist/BaiZe-v2.3.0-QQ-Organizer-Root-Test.apk
          cat >/tmp/notes.md <<'EOF'
          # 白泽 v2.3.0 QQ 归类与定时 Root 测试版

          - 修复定时归类无法连接 Root。
          - Root 绑定与解绑切换到主线程，并增加三次重试。
          - 支持 QQ `Android/data/com.tencent.mobileqq/Tencent/QQfile_recv`。
          - 自动发现应用下载、接收、附件、导出、文档、传输和离线目录。
          - 排除缓存、数据库、临时文件和缩略图目录。

          测试版，请先备份重要文件；刷入模块并重启后再测试。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title '白泽 v2.3.0 QQ 归类与定时 Root 测试版' --notes-file /tmp/notes.md --prerelease
            gh release upload "$TAG" "$MODULE" "$MODULE.sha256" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$MODULE" "$MODULE.sha256" "$APK" "$APK.sha256" \
              --target feat/v2.3.0-stabilization \
              --title '白泽 v2.3.0 QQ 归类与定时 Root 测试版' \
              --notes-file /tmp/notes.md --prerelease
          fi

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 设备测试构建

          - 运行编号：\`$RUN_ID\`
          - 构建结果：**$RESULT**
          - 源码提交：\`$HEAD_SHA\`
          - 测试标签：\`v2.3.0-qq-organizer-test\`

          成功后包含模块 ZIP、APK 和 SHA-256 文件。
          EOF
          gh issue edit 91 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
