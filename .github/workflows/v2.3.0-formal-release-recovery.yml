name: BaiZe v2.3.0 Formal Release Recovery

on:
  push:
    paths:
      - '.release/v2.3.0-formal-trigger'

permissions:
  contents: write
  issues: write

concurrency:
  group: baize-v230-formal-release-recovery
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 正式发布

          - 发布任务：\`$RUN_ID\`
          - 状态：**publishing**
          - 来源构建：\`29877161401\`
          EOF
          gh issue edit 97 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: '29877161401'
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "BaiZe-v2.3.0-All-App-Download-Safe-Test") | .id' | head -n 1)
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/baize-artifact.zip
          mkdir -p /tmp/baize-release
          unzip -q /tmp/baize-artifact.zip -d /tmp/baize-release

      - name: Prepare and verify formal files
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-release
          SOURCE_MODULE=$(find "$ROOT" -type f -name 'BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip' -print -quit)
          SOURCE_APK=$(find "$ROOT" -type f -name 'BaiZe-v2.3.0-All-App-Download-Safe-Test.apk' -print -quit)
          test -s "$SOURCE_MODULE"
          test -s "$SOURCE_APK"
          cp "$SOURCE_MODULE" "$ROOT/BaiZe-v2.3.0-Module.zip"
          cp "$SOURCE_APK" "$ROOT/BaiZe-v2.3.0.apk"
          unzip -tq "$ROOT/BaiZe-v2.3.0-Module.zip"
          unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh | grep -q '白泽是 Android Root 垃圾清理与文件归类模块'
          unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh | grep -q '可整理应用下载、接收、附件与导出文件'
          if unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh | grep -Eq '已接管|本次|新增|修复|优化|测试版|稳定化版'; then
            echo '模块刷入说明仍像更新日志' >&2
            exit 1
          fi
          sha256sum "$ROOT/BaiZe-v2.3.0-Module.zip" > "$ROOT/BaiZe-v2.3.0-Module.zip.sha256"
          sha256sum "$ROOT/BaiZe-v2.3.0.apk" > "$ROOT/BaiZe-v2.3.0.apk.sha256"

      - name: Publish formal release through REST API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-release
          TAG=v2.3.0
          TARGET=feat/v2.3.0-stabilization
          cat >/tmp/release-notes.md <<'EOF'
          # 白泽 v2.3.0

          白泽是 Android Root 垃圾清理与文件归类模块，用于扫描清理应用缓存、安装包、卸载残留和深度垃圾，并整理应用下载、接收、附件与导出文件。配套 App 用于操作、白名单与定时任务设置。

          在 Magisk、KernelSU 或 APatch 中刷入 `BaiZe-v2.3.0-Module.zip` 并重启。App 未自动安装时，手动安装 `BaiZe-v2.3.0.apk`。
          EOF

          OLD_RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
          if [ -n "$OLD_RELEASE_ID" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$OLD_RELEASE_ID"
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

          jq -n \
            --arg tag "$TAG" \
            --arg target "$TARGET" \
            --arg name '白泽 v2.3.0' \
            --arg body "$(cat /tmp/release-notes.md)" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,make_latest:"true"}' \
            >/tmp/create-release.json

          RELEASE_ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            --input /tmp/create-release.json --jq '.id')
          test -n "$RELEASE_ID"

          upload_asset() {
            file=$1
            content_type=$2
            name=${file##*/}
            gh api -X POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: $content_type" \
              --input "$file" >/dev/null
          }

          upload_asset "$ROOT/BaiZe-v2.3.0-Module.zip" application/zip
          upload_asset "$ROOT/BaiZe-v2.3.0-Module.zip.sha256" text/plain
          upload_asset "$ROOT/BaiZe-v2.3.0.apk" application/vnd.android.package-archive
          upload_asset "$ROOT/BaiZe-v2.3.0.apk.sha256" text/plain

      - name: Verify and report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.3.0")
          DRAFT=$(printf '%s' "$RELEASE" | jq -r '.draft')
          PRERELEASE=$(printf '%s' "$RELEASE" | jq -r '.prerelease')
          ASSETS=$(printf '%s' "$RELEASE" | jq -r '.assets[].name')
          test "$DRAFT" = false
          test "$PRERELEASE" = false
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0-Module.zip'
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0-Module.zip.sha256'
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0.apk'
          printf '%s\n' "$ASSETS" | grep -qx 'BaiZe-v2.3.0.apk.sha256'
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 正式发布

          - 状态：**success**
          - 标签：\`v2.3.0\`
          - 类型：正式版
          - 文件：模块 ZIP、APK、两份 SHA-256
          - 模块刷入说明：仅说明用途与操作入口
          EOF
          gh issue edit 97 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat >/tmp/status.md <<EOF
          # BaiZe v2.3.0 正式发布

          - 发布任务：\`$RUN_ID\`
          - 状态：**failure**
          - 成品与刷入说明校验已通过，失败发生在 GitHub Release 写入或资源上传阶段
          EOF
          gh issue edit 97 --repo "$GITHUB_REPOSITORY" --body-file /tmp/status.md
