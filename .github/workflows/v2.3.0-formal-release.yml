name: BaiZe v2.3.0 Formal Release

on:
  workflow_run:
    workflows: ["BaiZe v2.3.0 All-App Download Safe Builder"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: baize-v230-formal-release
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feat/v2.3.0-stabilization'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "BaiZe-v2.3.0-All-App-Download-Safe-Test") | .id' | head -n 1)
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/baize-artifact.zip
          mkdir -p /tmp/baize-release
          unzip -q /tmp/baize-artifact.zip -d /tmp/baize-release
          find /tmp/baize-release -type f -maxdepth 4 -print

      - name: Prepare formal release files
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-release
          SOURCE_MODULE=$(find "$ROOT" -type f -name 'BaiZe-v2.3.0-All-App-Download-Safe-Test-Module.zip' -print -quit)
          SOURCE_APK=$(find "$ROOT" -type f -name 'BaiZe-v2.3.0-All-App-Download-Safe-Test.apk' -print -quit)
          test -s "$SOURCE_MODULE"
          test -s "$SOURCE_APK"
          cp "$SOURCE_MODULE" "$ROOT/BaiZe-v2.3.0-Module.zip"
          cp "$SOURCE_APK" "$ROOT/BaiZe-v2.3.0.apk"
          unzip -tq "$ROOT/BaiZe-v2.3.0-Module.zip"
          unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" module.prop | grep -qx 'version=v2.3.0'
          unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh | grep -q '白泽是 Android Root 垃圾清理与文件归类模块'
          unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh | grep -q '可整理应用下载、接收、附件与导出文件'
          if unzip -p "$ROOT/BaiZe-v2.3.0-Module.zip" customize.sh | grep -Eq '已接管|本次|新增|修复|优化|测试版|稳定化版'; then
            echo '模块刷入说明仍包含更新日志式文字' >&2
            exit 1
          fi
          sha256sum "$ROOT/BaiZe-v2.3.0-Module.zip" > "$ROOT/BaiZe-v2.3.0-Module.zip.sha256"
          sha256sum "$ROOT/BaiZe-v2.3.0.apk" > "$ROOT/BaiZe-v2.3.0.apk.sha256"

      - name: Publish v2.3.0 formal release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-release
          TAG=v2.3.0
          cat > /tmp/release-notes.md <<'EOF'
          # 白泽 v2.3.0

          白泽是 Android Root 垃圾清理与文件归类模块，用于扫描清理应用缓存、安装包、卸载残留和深度垃圾，并整理应用下载、接收、附件与导出文件。配套 App 用于操作、白名单与定时任务设置。

          在 Magisk、KernelSU 或 APatch 中刷入 `BaiZe-v2.3.0-Module.zip` 并重启。App 未自动安装时，手动安装 `BaiZe-v2.3.0.apk`。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
            BODY=$(cat /tmp/release-notes.md)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name='白泽 v2.3.0' \
              -f body="$BODY" \
              -f target_commitish="$HEAD_SHA" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true >/dev/null
            gh release upload "$TAG" \
              "$ROOT/BaiZe-v2.3.0-Module.zip" \
              "$ROOT/BaiZe-v2.3.0-Module.zip.sha256" \
              "$ROOT/BaiZe-v2.3.0.apk" \
              "$ROOT/BaiZe-v2.3.0.apk.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "$ROOT/BaiZe-v2.3.0-Module.zip" \
              "$ROOT/BaiZe-v2.3.0-Module.zip.sha256" \
              "$ROOT/BaiZe-v2.3.0.apk" \
              "$ROOT/BaiZe-v2.3.0.apk.sha256" \
              --target "$HEAD_SHA" \
              --title '白泽 v2.3.0' \
              --notes-file /tmp/release-notes.md
          fi

      - name: Verify formal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.3.0 --json tagName,name,isDraft,isPrerelease,isLatest,assets \
            --jq '{tag:.tagName,name:.name,draft:.isDraft,prerelease:.isPrerelease,latest:.isLatest,assets:[.assets[].name]}'
          test "$(gh release view v2.3.0 --json isDraft --jq '.isDraft')" = false
          test "$(gh release view v2.3.0 --json isPrerelease --jq '.isPrerelease')" = false
          gh release view v2.3.0 --json assets --jq '.assets[].name' | grep -qx 'BaiZe-v2.3.0-Module.zip'
          gh release view v2.3.0 --json assets --jq '.assets[].name' | grep -qx 'BaiZe-v2.3.0.apk'
