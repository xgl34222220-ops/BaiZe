name: BaiZe v2.3.0 Organizer Coverage Smoke

on:
  push:
    branches: [feat/v2.3.0-stabilization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baize-v230-organizer-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-organizer-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify final materialized source keeps organizer discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/prepare-v230-materialization.py \
            tools/apply-v230-organizer-download-coverage.py
          python3 tools/prepare-v230-materialization.py
          base64 -d tools/bootstrap-v230.py.gz.b64 | gzip -d >/tmp/bootstrap-v230.py
          python3 /tmp/bootstrap-v230.py
          base64 -d tools/finalize-v230.py.gz.b64 | gzip -d >/tmp/finalize-v230.py
          python3 /tmp/finalize-v230.py
          python3 tools/apply-v230-organizer-download-coverage.py
          grep -q 'discover_app_user_roots' v2/module/storage-index.sh
          grep -q 'QQ接收:$package' v2/module/storage-index.sh || grep -q 'QQ接收.*QQfile_recv' v2/module/storage-index.sh
          grep -q '"attachment", "attachments"' v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
          grep -q '"document", "documents", "transfer", "transfers", "offline"' v2/app/src/main/java/io/github/xgl34222220/baize/root/FileOrganizerEngine.kt
          sh -n v2/module/storage-index.sh

      - name: Test QQ and generic application download directories
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/baize-organizer
          rm -rf "$ROOT"
          mkdir -p \
            "$ROOT/media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv" \
            "$ROOT/media/0/Android/data/com.example.browser/private/received" \
            "$ROOT/media/0/Android/data/com.example.mail/data/attachments" \
            "$ROOT/media/0/Android/data/com.example.browser/cache/Download" \
            "$ROOT/state"

          printf 'qq-module' >"$ROOT/media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu Test 模块.zip"
          printf 'browser-apk' >"$ROOT/media/0/Android/data/com.example.browser/private/received/browser-test.apk"
          printf 'mail-pdf' >"$ROOT/media/0/Android/data/com.example.mail/data/attachments/manual.pdf"
          printf 'cache-file' >"$ROOT/media/0/Android/data/com.example.browser/cache/Download/must-not-index.zip"

          BAIZE_MEDIA_ROOT="$ROOT/media" \
          BAIZE_STATE_DIR="$ROOT/state" \
          bash v2/module/storage-index.sh refresh organizer-ci

          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/baize-organizer')
          paths = {
              item.decode('utf-8')
              for item in (root / 'state/index/storage-files.nul').read_bytes().split(b'\0')
              if item
          }
          required = {
              str(root / 'media/0/Android/data/com.tencent.mobileqq/Tencent/QQfile_recv/LuoShu Test 模块.zip'),
              str(root / 'media/0/Android/data/com.example.browser/private/received/browser-test.apk'),
              str(root / 'media/0/Android/data/com.example.mail/data/attachments/manual.pdf'),
          }
          missing = required - paths
          assert not missing, f'missing organizer files: {sorted(missing)}'
          assert not any(path.endswith('must-not-index.zip') for path in paths), 'cache download was indexed'

          coverage = (root / 'state/index/coverage.tsv').read_text()
          assert 'com.tencent.mobileqq' in coverage
          assert 'QQfile_recv' in coverage
          assert 'com.example.browser' in coverage
          PY
