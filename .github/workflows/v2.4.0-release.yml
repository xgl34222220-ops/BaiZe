name: BaiZe v2.4.1 Beta 1 Verify and Release

on:
  push:
    branches: [agent/builtin-rule-expansion]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baize-v241-beta1-${{ github.ref }}
  cancel-in-progress: true

env:
  BAIZE_VERSION: v2.4.1
  BAIZE_VERSION_NAME: 2.4.1
  BAIZE_VERSION_CODE: '24001'
  BAIZE_PRERELEASE_TAG: v2.4.1-beta.1
  BAIZE_CERT_SHA256: 9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f

jobs:
  verify-build-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest beta source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v2.4.1 beta metadata
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cmp module.prop v2/module/module.prop
          grep -q 'versionName = "2.4.1"' v2/app/build.gradle.kts
          grep -q 'versionCode = 24001' v2/app/build.gradle.kts
          grep -q '禁止回退到 Debug 签名' v2/app/build.gradle.kts
          grep -qx 'version=v2.4.1' module.prop
          grep -qx 'versionCode=24001' module.prop
          grep -q 'OUTPUT="$OUT/BaiZe-v2.4.1-Module.zip"' v2/scripts/package-module.sh
          grep -Fqx 'ui_print "- 正在安装白泽 v2.4.1"' v2/module/customize.sh
          grep -q 'v2.4.1-beta.1' RELEASE_NOTES_v2.4.1.md

      - name: Install shell compatibility tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static toybox

      - name: Verify Root scripts and complete regressions
        shell: bash
        run: |
          set -euo pipefail
          for script in v2/module/*.sh v2/scripts/*.sh service.sh cleaner.sh; do
            sh -n "$script"
            busybox ash -n "$script"
          done
          bash v2/tests/test-scheduler-fairness.sh
          bash v2/tests/test-incremental-index.sh
          bash v2/tests/test-organizer-transactions.sh
          python3 v2/tests/test-clean-plan-persistence.py
          python3 v2/tests/test-clean-plan-resume.py
          python3 v2/tests/test-clean-result-model.py
          python3 v2/tests/test-candidate-selection-plan.py
          python3 v2/tests/test-clean-result-report.py
          python3 v2/tests/test-explainable-rules-whitelist.py
          python3 v2/tests/test-rule-pack-management.py
          python3 v2/tests/test-rule-update-channel.py
          python3 v2/tests/test-rule-release-automation.py
          gcc -std=c11 -O2 -Wall -Wextra -Werror v2/native/baize_engine_42_4.c -o /tmp/baize_engine

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare formal release signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64_RAW: ${{ secrets.BAIZE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_RAW: ${{ secrets.BAIZE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.BAIZE_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.BAIZE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          normalize_secret() {
            secret_name=$1
            raw_value=$2
            value=$(printf '%s' "$raw_value" | tr -d '\r\n')
            value=$(printf '%s' "$value" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            case "$value" in "$secret_name="*) value=${value#*=} ;; esac
            case "$value" in
              \"*\") value=${value#\"}; value=${value%\"} ;;
              \'*\') value=${value#\'}; value=${value%\'} ;;
            esac
            printf '%s' "$value"
          }
          KEYSTORE_BASE64=$(normalize_secret BAIZE_KEYSTORE_BASE64 "$KEYSTORE_BASE64_RAW" | tr -d '[:space:]')
          KEYSTORE_PASSWORD=$(normalize_secret BAIZE_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD_RAW")
          KEY_ALIAS=$(normalize_secret BAIZE_KEY_ALIAS "$KEY_ALIAS_RAW")
          KEY_PASSWORD=$(normalize_secret BAIZE_KEY_PASSWORD "$KEY_PASSWORD_RAW")
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/baize-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          VERIFY_STORE="$RUNNER_TEMP/baize-key-password-check.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$KEYSTORE" \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$VERIFY_STORE" \
            -deststoretype PKCS12 \
            -deststorepass 'baize-verify-24001' \
            -destkeypass 'baize-verify-24001' >/dev/null
          ACTUAL_CERT=$(keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -rfc | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$BAIZE_CERT_SHA256"
          {
            echo "BAIZE_KEYSTORE_PATH=$KEYSTORE"
            echo "BAIZE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BAIZE_KEY_ALIAS=$KEY_ALIAS"
            echo "BAIZE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build signed Android Release and verification targets
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :app:compileDebugKotlin :app:lintRelease :macrobenchmark:assemble 2>&1 | tee android-build.log

      - name: Package beta module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh 2>&1 | tee package-module.log

      - name: Verify signed beta artifacts
        shell: bash
        run: |
          set -euo pipefail
          ZIP='v2/dist/BaiZe-v2.4.1-Module.zip'
          APK='v2/app/build/outputs/apk/release/app-release.apk'
          RELEASE_APK='v2/dist/BaiZe-v2.4.1.apk'
          MODULE_PROP="$RUNNER_TEMP/baize-module.prop"
          ZIP_LIST="$RUNNER_TEMP/baize-module-files.txt"
          CERT_FILE='v2/dist/BaiZe-v2.4.1-signing-certificate.txt'
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop > "$MODULE_PROP"
          unzip -Z1 "$ZIP" > "$ZIP_LIST"
          grep -qx 'version=v2.4.1' "$MODULE_PROP"
          grep -qx 'versionCode=24001' "$MODULE_PROP"
          grep -qx 'app/baize.apk' "$ZIP_LIST"
          if grep -Eq '^(webroot|webui|www|ksu-webui)/' "$ZIP_LIST"; then
            echo '模块包中不允许包含 WebUI 资源' >&2
            exit 1
          fi
          PACKAGED_APK_SHA=$(unzip -p "$ZIP" app/baize.apk | sha256sum | awk '{print $1}')
          BUILT_APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          test "$PACKAGED_APK_SHA" = "$BUILT_APK_SHA"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$CERT_FILE"
          APK_CERT=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($NF); exit}' "$CERT_FILE" | tr -d ':[:space:]')
          test "$APK_CERT" = "$BAIZE_CERT_SHA256"
          cp "$APK" "$RELEASE_APK"
          sha256sum "$ZIP" > "$ZIP.sha256"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

      - name: Upload verified beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.1-Beta1-Verified
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.4.1-Module.zip
            v2/dist/BaiZe-v2.4.1-Module.zip.sha256
            v2/dist/BaiZe-v2.4.1.apk
            v2/dist/BaiZe-v2.4.1.apk.sha256
            v2/dist/BaiZe-v2.4.1-signing-certificate.txt
            v2/android-build.log
            v2/package-module.log

      - name: Publish BaiZe v2.4.1 Beta 1 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$BAIZE_PRERELEASE_TAG"
          ZIP=v2/dist/BaiZe-v2.4.1-Module.zip
          ZIP_SHA=v2/dist/BaiZe-v2.4.1-Module.zip.sha256
          APK=v2/dist/BaiZe-v2.4.1.apk
          APK_SHA=v2/dist/BaiZe-v2.4.1.apk.sha256
          CERT=v2/dist/BaiZe-v2.4.1-signing-certificate.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title '白泽 v2.4.1 Beta 1' \
              --notes-file RELEASE_NOTES_v2.4.1.md \
              --prerelease
            gh release upload "$TAG" "$ZIP" "$ZIP_SHA" "$APK" "$APK_SHA" "$CERT" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP_SHA" "$APK" "$APK_SHA" "$CERT" \
              --target "$GITHUB_SHA" \
              --title '白泽 v2.4.1 Beta 1' \
              --notes-file RELEASE_NOTES_v2.4.1.md \
              --prerelease
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.1-Beta1-Diagnostics
          if-no-files-found: warn
          path: |
            v2/android-build.log
            v2/package-module.log
            v2/app/build/reports/lint-results-release.html
            v2/app/build/reports/lint-results-release.txt
