name: Apply clean plan persistence

on:
  push:
    branches: [agent/clean-plan-persistence]
    paths:
      - 'tools/apply-clean-plan-persistence.py'
      - '.github/workflows/agent-clean-plan-persistence.yml'
      - '.github/workflows/v2.4.0-source-export.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-clean-plan-persistence-trusted
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-plan-persistence
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 tools/apply-clean-plan-persistence.py

      - name: Restore trusted workflow source
        run: git checkout origin/main -- .github/workflows/v2.4.0-source-export.yml

      - name: Run clean plan regression checks
        run: python3 v2/tests/test-clean-plan-persistence.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Android sources
        working-directory: v2
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'feat(clean): persist and restore immutable clean plans'
          git push origin HEAD:agent/clean-plan-persistence
