name: BaiZe v2.4.0 Materialize and Build Test

on:
  push:
    branches: [feat/v2.4.0-complete-hardening]
    paths:
      - '.github/workflows/v2.4.0-source-export.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baize-v240-materialize-build
  cancel-in-progress: true

jobs:
  materialize-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2.4.0-complete-hardening
          fetch-depth: 0

      - name: Repair verified transfer bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p8 = Path('.v240-upload/part-08')
          d8 = p8.read_text()
          assert len(d8) == 9001 and d8[4377] == 'e'
          p8.write_text(d8[:4377] + d8[4378:])
          p9 = Path('.v240-upload/part-09')
          d9 = p9.read_text()
          assert len(d9) == 9000 and d9[2596:2598] == 'rb'
          p9.write_text(d9[:2596] + 'br' + d9[2598:])
          PY

      - name: Verify and extract reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .v240-upload -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = 12
          cat .v240-upload/part-* > /tmp/baize-v240-changes.b64
          printf '%s  %s\n' '723bb5cfca9fc9a54f2bb6e51358dc088d1813335ebe52d2f4d4de1b7296a1a9' /tmp/baize-v240-changes.b64 | sha256sum -c -
          base64 -d /tmp/baize-v240-changes.b64 > /tmp/baize-v240-changes.tar.gz
          printf '%s  %s\n' '0d6fa2a122d748c27aa01e95a21b59f72e2603d308da84a3bf3c3f6863084452' /tmp/baize-v240-changes.tar.gz | sha256sum -c -
          tar -tzf /tmp/baize-v240-changes.tar.gz > /tmp/baize-v240-files.txt
          grep -Fxq 'service.sh' /tmp/baize-v240-files.txt
          grep -Fxq 'v2/tests/test-scheduler-fairness.sh' /tmp/baize-v240-files.txt
          tar -xzf /tmp/baize-v240-changes.tar.gz

      - name: Verify shell and regression tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y busybox-static
          for script in service.sh cleaner.sh v2/module/*.sh v2/scripts/*.sh v2/tests/*.sh; do
            sh -n "$script"
            busybox ash -n "$script"
          done
          bash v2/tests/test-scheduler-fairness.sh
          bash v2/tests/test-incremental-index.sh
          bash v2/tests/test-organizer-transactions.sh
          grep -q 'versionName = "2.4.0"' v2/app/build.gradle.kts
          grep -q 'versionCode = 24000' v2/app/build.gradle.kts
          grep -qx 'version=v2.4.0' v2/module/module.prop
          grep -qx 'versionCode=24000' v2/module/module.prop
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build release app, lint and benchmark
        id: android_build
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :app:lintRelease :macrobenchmark:assemble 2>&1 | tee android-build.log

      - name: Package and verify test module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-module.sh
          ZIP=dist/BaiZe-v2.4.0-Module.zip
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.4.0'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=24000'
          cp "$APK" dist/BaiZe-v2.4.0-Test.apk
          sha256sum "$ZIP" > "$ZIP.sha256"
          sha256sum dist/BaiZe-v2.4.0-Test.apk > dist/BaiZe-v2.4.0-Test.apk.sha256

      - name: Upload v2.4.0 test package
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-Complete-Hardening-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.4.0-Module.zip
            v2/dist/BaiZe-v2.4.0-Module.zip.sha256
            v2/dist/BaiZe-v2.4.0-Test.apk
            v2/dist/BaiZe-v2.4.0-Test.apk.sha256
            v2/android-build.log
            v2/app/build/reports/lint-results-release.html
            v2/app/build/reports/lint-results-release.txt

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-Build-Diagnostics
          if-no-files-found: warn
          path: |
            v2/android-build.log
            v2/app/build/reports/lint-results-release.html
            v2/app/build/reports/lint-results-release.txt

      - name: Commit reviewed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v240-upload
          rm -f .v240-export-result .v240-export-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- config service.sh v2 .v240-upload .v240-export-result .v240-export-trigger
          git diff --cached --check
          git commit -m 'feat(v2.4.0): complete scheduler, index and organizer hardening'
          git push origin HEAD:feat/v2.4.0-complete-hardening

      - name: Collect transfer diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          if [ -d .v240-upload ]; then
            cat .v240-upload/part-* > /tmp/baize-v240-diagnostic.b64
            sha256sum /tmp/baize-v240-diagnostic.b64 > /tmp/baize-v240-transfer-diagnostics.txt
          else
            echo 'source materialized and upload fragments removed' > /tmp/baize-v240-transfer-diagnostics.txt
          fi

      - name: Upload transfer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-transfer-diagnostics
          if-no-files-found: error
          path: /tmp/baize-v240-transfer-diagnostics.txt
