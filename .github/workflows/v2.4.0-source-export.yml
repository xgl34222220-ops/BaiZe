name: BaiZe v2.4.0 Source Export

on:
  push:
    branches: [feat/v2.4.0-complete-hardening]
    paths:
      - '.github/workflows/v2.4.0-source-export.yml'
      - '.v240-export-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baize-v240-source-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/v2.4.0-complete-hardening
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/BaiZe-v2.4.0-source.tar.gz
          tar --exclude=.git --exclude=v2/build --exclude=v2/app/build --exclude=v2/.gradle \
            -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > /tmp/BaiZe-v2.4.0-source.tar.gz.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-source
          if-no-files-found: error
          path: |
            /tmp/BaiZe-v2.4.0-source.tar.gz
            /tmp/BaiZe-v2.4.0-source.tar.gz.sha256
      - name: Persist export result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\nstatus=%s\nhead=%s\n' "$GITHUB_RUN_ID" "$JOB_STATUS" "$GITHUB_SHA" > .v240-export-result
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v240-export-result
          git commit -m 'build: record v2.4.0 source export' || exit 0
          git push origin HEAD:feat/v2.4.0-complete-hardening
