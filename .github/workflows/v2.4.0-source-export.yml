name: BaiZe v2.4.0 Source Export

on:
  push:
    branches: [feat/v2.4.0-complete-hardening]
    paths:
      - '.github/workflows/v2.4.0-source-export.yml'
      - '.v240-export-trigger'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: baize-v240-source-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/v2.4.0-complete-hardening
          fetch-depth: 0
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=v2/build --exclude=v2/app/build --exclude=v2/.gradle \
            -czf BaiZe-v2.4.0-source.tar.gz .
          sha256sum BaiZe-v2.4.0-source.tar.gz > BaiZe-v2.4.0-source.tar.gz.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-source
          if-no-files-found: error
          path: |
            BaiZe-v2.4.0-source.tar.gz
            BaiZe-v2.4.0-source.tar.gz.sha256
      - name: Report export run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          gh issue comment 94 --repo "$GITHUB_REPOSITORY" \
            --body "BAIZE_V240_SOURCE_EXPORT run_id=$GITHUB_RUN_ID status=$JOB_STATUS head=$GITHUB_SHA"
