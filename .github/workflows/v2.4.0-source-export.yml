name: BaiZe v2.4.0 Chinese UI Test Build

on:
  push:
    branches: [feat/v2.4.0-complete-hardening]
    paths:
      - '.github/workflows/v2.4.0-source-export.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baize-v240-chinese-ui
  cancel-in-progress: true

jobs:
  localize-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v2.4.0-complete-hardening
          fetch-depth: 0

      - name: Localize task center and history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('v2/app/src/main/java/io/github/xgl34222220/baize')
          helper = root / 'ui/settings/SchedulerText.kt'
          helper.write_text(r'''package io.github.xgl34222220.baize.ui.settings

private val schedulerTaskNames = mapOf(
    "cache" to "应用缓存清理",
    "empty" to "空文件与空目录清理",
    "rules" to "规则垃圾清理",
    "fragment" to "残留碎片清理",
    "deep" to "深度清理",
    "organize" to "文件自动归类",
    "organizer" to "文件自动归类",
    "all" to "清理与文件归类"
)

fun schedulerTaskLabel(raw: String): String {
    val value = raw.trim()
    if (value.isBlank()) return "后台任务"
    val key = value.lowercase()
    schedulerTaskNames[key]?.let { return it }
    return when {
        key.startsWith("cache-") -> "应用缓存清理"
        key.startsWith("empty-") -> "空文件与空目录清理"
        key.startsWith("rules-") -> "规则垃圾清理"
        key.startsWith("fragment-") -> "残留碎片清理"
        key.startsWith("deep-") -> "深度清理"
        key.startsWith("organize-") || key.startsWith("organizer-") -> "文件自动归类"
        else -> value
    }
}

fun schedulerQueueLabel(raw: String): String {
    val counts = linkedMapOf<String, Int>()
    raw.split(',', ';', '\n')
        .map(String::trim)
        .filter(String::isNotBlank)
        .forEach { task ->
            val label = schedulerTaskLabel(task)
            counts[label] = (counts[label] ?: 0) + 1
        }
    return counts.entries.joinToString("、") { (label, count) ->
        if (count > 1) "$label ×$count" else label
    }
}

fun schedulerBlockedGroupsLabel(raw: String): String = raw
    .split(',', ';', '\n')
    .map(String::trim)
    .filter(String::isNotBlank)
    .joinToString("；") { item ->
        val parts = item.split(':', limit = 2)
        val task = schedulerTaskLabel(parts.firstOrNull().orEmpty())
        val reason = schedulerReasonLabel(parts.getOrNull(1).orEmpty())
            .replace(Regex("熔断\\s*(\\d+)\\s*分钟"), "连续失败，暂停 $1 分钟")
        if (reason.isBlank()) task else "$task：$reason"
    }

fun schedulerRuntimeStateLabel(raw: String): String = when (raw.trim().lowercase()) {
    "running" -> "正在执行"
    "completed" -> "最近任务已完成"
    "failed" -> "调度异常"
    "paused" -> "连续失败，暂时暂停"
    "disabled" -> "自动任务已关闭"
    "waiting" -> "等待执行"
    else -> "等待状态"
}

fun schedulerSupervisorStatusLabel(raw: String): String = when (raw.trim().lowercase()) {
    "alive", "running", "healthy" -> "后台守护正常"
    "recovering", "starting" -> "后台守护正在恢复"
    "failed", "error" -> "后台守护异常"
    "stale" -> "后台守护心跳过期"
    "stopped", "missing" -> "后台守护未运行"
    else -> "等待后台守护状态"
}

fun schedulerReasonLabel(raw: String): String {
    var text = raw.trim()
    if (text.isBlank()) return "等待下一次调度"
    text = text.replace("Supervisor", "后台守护进程", ignoreCase = true)
    text = text.replace("Worker", "后台任务", ignoreCase = true)
    val taskRegex = Regex("(?<![A-Za-z])(cache|empty|rules|fragment|deep|organize|organizer|all)(?![A-Za-z])", RegexOption.IGNORE_CASE)
    return taskRegex.replace(text) { schedulerTaskLabel(it.value) }
}
''', encoding='utf-8')

          miuix = root / 'ui/settings/miuix/SettingsScreenMiuix.kt'
          text = miuix.read_text(encoding='utf-8')
          import_anchor = 'import io.github.xgl34222220.baize.ui.settings.SettingsUiState\n'
          imports = '''import io.github.xgl34222220.baize.ui.settings.SettingsUiState
import io.github.xgl34222220.baize.ui.settings.schedulerBlockedGroupsLabel
import io.github.xgl34222220.baize.ui.settings.schedulerQueueLabel
import io.github.xgl34222220.baize.ui.settings.schedulerReasonLabel
import io.github.xgl34222220.baize.ui.settings.schedulerSupervisorStatusLabel
import io.github.xgl34222220.baize.ui.settings.schedulerTaskLabel
'''
          if 'schedulerQueueLabel' not in text:
              assert import_anchor in text
              text = text.replace(import_anchor, imports, 1)
          replacements = {
              'MiuixSectionTitle("TASK CENTER", "任务中心", "队列、等待原因与 Root 守护状态")': 'MiuixSectionTitle("任务管理", "任务中心", "待执行任务、暂缓原因与后台守护状态")',
              'MiuixSectionTitle("AUTOMATION", "自动清理", "总开关、执行条件与最低电量")': 'MiuixSectionTitle("自动执行", "自动清理", "总开关、执行条件与最低电量")',
              'MiuixSectionTitle("PROTECTION", "清理保护", "白名单、通知、安装包与单文件限制")': 'MiuixSectionTitle("安全保护", "清理保护", "白名单、通知、安装包与单文件限制")',
              'MiuixSectionTitle("SERVICE", "服务与诊断", "Root 服务恢复、清理明细与崩溃记录")': 'MiuixSectionTitle("系统服务", "服务与诊断", "后台服务恢复、清理明细与崩溃记录")',
              '"PREFERENCES"': '"设置中心"',
              '"Miuix 紧凑设置与清理保护"': '"MIUI 风格设置与清理保护"',
              '"检查计划并自动恢复 Supervisor"': '"检查计划并自动恢复后台守护进程"',
              '"条件满足后由统一 Root Worker 执行"': '"条件满足后由统一后台任务执行"',
              '"安全写入停止请求，当前 Worker 会在检查点退出"': '"安全写入停止请求，当前后台任务会在检查点退出"',
              '"15 分钟到 30 天，Root 配置为唯一真源"': '"15 分钟到 30 天，后台计划为唯一设置来源"'
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          old_block = '''                when (config.runtimeState) {
                    "running" -> "正在执行 ${config.nextTask.ifBlank { "Root 任务" }}"
                    "failed" -> "调度异常"
                    "paused" -> "任务已熔断暂停"
                    else -> "队列 ${config.queueCount} 项 · ${config.supervisorStatus}"
                },'''
          new_block = '''                when (config.runtimeState) {
                    "running" -> "正在执行 ${schedulerTaskLabel(config.nextTask)}"
                    "failed" -> "调度异常"
                    "paused" -> "连续失败，任务暂时暂停"
                    else -> "待执行 ${config.queueCount} 项 · ${schedulerSupervisorStatusLabel(config.supervisorStatus)}"
                },'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          old_detail = '''                    append(config.runtimeReason.ifBlank { "等待下一次调度" })
                    if (config.queueGroups.isNotBlank()) append("\\n队列：").append(config.queueGroups)
                    if (config.blockedGroups.isNotBlank()) append("\\n等待条件：").append(config.blockedGroups)
                    if (config.runtimeStale) append("\\n守护心跳已过期，建议唤醒")'''
          new_detail = '''                    append(schedulerReasonLabel(config.runtimeReason))
                    if (config.queueGroups.isNotBlank()) append("\\n待执行：").append(schedulerQueueLabel(config.queueGroups))
                    if (config.blockedGroups.isNotBlank()) append("\\n暂缓执行：").append(schedulerBlockedGroupsLabel(config.blockedGroups))
                    if (config.runtimeStale) append("\\n后台守护长时间没有响应，建议点击唤醒")'''
          if old_detail in text:
              text = text.replace(old_detail, new_detail, 1)
          miuix.write_text(text, encoding='utf-8')

          material = root / 'ui/settings/material/SettingsScreenMaterial.kt'
          text = material.read_text(encoding='utf-8')
          if 'schedulerQueueLabel' not in text:
              assert import_anchor in text
              material_imports = imports + 'import io.github.xgl34222220.baize.ui.settings.schedulerRuntimeStateLabel\n'
              text = text.replace(import_anchor, material_imports, 1)
          material_replacements = {
              'MaterialSectionTitle("TASK CENTER", "任务中心")': 'MaterialSectionTitle("任务管理", "任务中心")',
              'MaterialSectionTitle("AUTOMATION", "自动清理")': 'MaterialSectionTitle("自动执行", "自动清理")',
              'MaterialSectionTitle("PROTECTION", "清理保护与通知")': 'MaterialSectionTitle("安全保护", "清理保护与通知")',
              'MaterialSectionTitle("SERVICE", "服务与诊断")': 'MaterialSectionTitle("系统服务", "服务与诊断")',
              '"PREFERENCES"': '"设置中心"',
              'title = "Root 任务中心"': 'title = "后台任务中心"',
              'subtitle = "${config.runtimeState} · 队列 ${config.queueCount} 项 · ${config.supervisorStatus}"': 'subtitle = "${schedulerRuntimeStateLabel(config.runtimeState)} · 待执行 ${config.queueCount} 项 · ${schedulerSupervisorStatusLabel(config.supervisorStatus)}"',
              '"Root 配置为唯一真实计划来源"': '"后台计划为唯一真实设置来源"'
          }
          for old, new in material_replacements.items():
              text = text.replace(old, new)
          if old_detail in text:
              text = text.replace(old_detail, new_detail, 1)
          material.write_text(text, encoding='utf-8')

          dashboard = root / 'MiuixDashboardActivity.kt'
          text = dashboard.read_text(encoding='utf-8')
          anchor = '        "profile-clean" -> "分类垃圾清理"\n'
          addition = '''        "profile-clean" -> "分类垃圾清理"
        "organize", "organizer", "organize-clean" -> "文件自动归类"
        "organize-scan", "organizer-scan" -> "文件归类扫描"
'''
          if '"organize", "organizer", "organize-clean"' not in text:
              assert anchor in text
              text = text.replace(anchor, addition, 1)
          dashboard.write_text(text, encoding='utf-8')
          PY

          ! grep -R -nE '"(TASK CENTER|AUTOMATION|PROTECTION|SERVICE|PREFERENCES)"' \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings
          grep -q '文件自动归类' v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt
          grep -q 'schedulerQueueLabel' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/miuix/SettingsScreenMiuix.kt
          grep -q 'schedulerQueueLabel' v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/material/SettingsScreenMaterial.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 scanner
        working-directory: v2
        run: sh scripts/build-native.sh

      - name: Build Chinese release test app
        id: android_build
        working-directory: v2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee android-build.log

      - name: Package and verify Chinese test module
        working-directory: v2
        shell: bash
        run: |
          set -euo pipefail
          set +e
          sh scripts/package-module.sh 2>&1 | tee package-module.log
          package_status=${PIPESTATUS[0]}
          set -e
          ZIP=dist/BaiZe-v2.4.0-Module.zip
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$ZIP"
          test -s "$APK"
          unzip -tq "$ZIP"
          unzip -p "$ZIP" module.prop | grep -qx 'version=v2.4.0'
          unzip -p "$ZIP" module.prop | grep -qx 'versionCode=24000'
          unzip -Z1 "$ZIP" | grep -qx 'app/baize.apk'
          cp "$ZIP" dist/BaiZe-v2.4.0-Chinese-UI-Test-Module.zip
          cp "$APK" dist/BaiZe-v2.4.0-Chinese-UI-Test.apk
          sha256sum dist/BaiZe-v2.4.0-Chinese-UI-Test-Module.zip > dist/BaiZe-v2.4.0-Chinese-UI-Test-Module.zip.sha256
          sha256sum dist/BaiZe-v2.4.0-Chinese-UI-Test.apk > dist/BaiZe-v2.4.0-Chinese-UI-Test.apk.sha256
          echo "package-script-status=$package_status" >> package-module.log

      - name: Commit Chinese UI source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            v2/app/src/main/java/io/github/xgl34222220/baize/MiuixDashboardActivity.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/SchedulerText.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/miuix/SettingsScreenMiuix.kt \
            v2/app/src/main/java/io/github/xgl34222220/baize/ui/settings/material/SettingsScreenMaterial.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): translate scheduler and organizer text to Chinese'
            git push origin HEAD:feat/v2.4.0-complete-hardening
          fi

      - name: Upload Chinese UI test package
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-Chinese-UI-Test
          if-no-files-found: error
          path: |
            v2/dist/BaiZe-v2.4.0-Chinese-UI-Test-Module.zip
            v2/dist/BaiZe-v2.4.0-Chinese-UI-Test-Module.zip.sha256
            v2/dist/BaiZe-v2.4.0-Chinese-UI-Test.apk
            v2/dist/BaiZe-v2.4.0-Chinese-UI-Test.apk.sha256
            v2/android-build.log
            v2/package-module.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BaiZe-v2.4.0-Chinese-UI-Diagnostics
          if-no-files-found: warn
          path: |
            v2/android-build.log
            v2/package-module.log
