name: BaiZe Core Regression CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'service.sh'
      - 'cleaner.sh'
      - 'config/**'
      - 'v2/module/**'
      - 'v2/native/**'
      - 'v2/scripts/**'
      - 'v2/tests/**'
      - '.github/workflows/v2.5-concurrent-scheduler-ci.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: baize-core-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell compatibility tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static toybox

      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in service.sh cleaner.sh v2/module/*.sh v2/scripts/*.sh v2/tests/*.sh; do
            [ -f "$script" ] || continue
            sh -n "$script"
            busybox ash -n "$script"
          done

      - name: Run complete regression suite
        shell: bash
        run: bash v2/tests/run-all.sh
