name: BaiZe v2.5 Root Stability CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'service.sh'
      - 'config/**'
      - 'v2/module/**'
      - 'v2/scripts/**'
      - 'v2/tests/**'
      - '.github/workflows/v2.5-concurrent-scheduler-ci.yml'
      - '.github/workflows/v2.5.1-release.yml'
  push:
    branches: [feat/v2.5.2-stability]

permissions:
  contents: read

concurrency:
  group: baize-root-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell compatibility tools
        run: sudo apt-get update && sudo apt-get install -y busybox-static toybox
      - name: Verify shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in service.sh cleaner.sh v2/module/*.sh v2/scripts/*.sh v2/tests/*.sh; do
            sh -n "$script"
            busybox ash -n "$script"
          done
      - name: Existing scheduler regression
        run: bash v2/tests/test-scheduler-fairness.sh
      - name: Daily scheduler field regression
        run: bash v2/tests/test-scheduler-daily-fields.sh
      - name: Concurrent scheduler regression
        shell: bash
        run: |
          set +e
          bash -x v2/tests/test-concurrent-scheduler.sh > /tmp/concurrent-scheduler.log 2>&1
          code=$?
          tail -n 80 /tmp/concurrent-scheduler.log
          exit "$code"
      - name: Deep clean continuous batch regression
        shell: bash
        run: |
          set +e
          bash -x v2/tests/test-deep-clean-budget.sh > /tmp/deep-clean-stream.log 2>&1
          code=$?
          tail -n 120 /tmp/deep-clean-stream.log
          exit "$code"
      - name: Upload Root diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-regression-diagnostics
          path: |
            /tmp/concurrent-scheduler.log
            /tmp/deep-clean-stream.log
            /tmp/baize-v250-concurrent-scheduler-test
            /tmp/baize-deep-clean-stream-test
            /tmp/baize-scheduler-daily-fields-test
          if-no-files-found: warn
      - name: Incremental index regression
        run: bash v2/tests/test-incremental-index.sh
      - name: Organizer transaction regression
        run: bash v2/tests/test-organizer-transactions.sh
