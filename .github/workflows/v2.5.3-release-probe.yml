name: Probe BaiZe v2.5.3 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-v2.5.3.probe'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TRIGGER_SHA: 1426ca8f6c9eed310657ffa6746c86437862a0c6
    steps:
      - name: Monitor release and record final state
        shell: bash
        run: |
          set -euo pipefail

          write_status() {
            message=$1
            encoded=$(base64 -w0 /tmp/release-status)
            existing=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-v2.5.3.status?ref=main" --jq .sha 2>/dev/null || true)
            if [ -n "$existing" ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/release-v2.5.3.status" \
                -f message="$message" -f content="$encoded" -f branch=main -f sha="$existing" >/dev/null
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/release-v2.5.3.status" \
                -f message="$message" -f content="$encoded" -f branch=main >/dev/null
            fi
          }

          for attempt in $(seq 1 100); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v2.5.3-release.yml/runs?event=push&branch=main&per_page=20")
            run=$(printf '%s' "$runs" | jq -c --arg sha "$RELEASE_TRIGGER_SHA" '.workflow_runs[] | select(.head_sha == $sha)' | head -n 1)
            if [ -n "$run" ]; then
              run_id=$(printf '%s' "$run" | jq -r '.id')
              status=$(printf '%s' "$run" | jq -r '.status')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
              run_url=$(printf '%s' "$run" | jq -r '.html_url')

              if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
                failed=$(printf '%s' "$jobs" | jq -r '.jobs[] | select(.conclusion == "failure") | .name as $job | .steps[]? | select(.conclusion == "failure") | "failed=" + $job + " / " + .name')
                {
                  echo 'status=failed'
                  echo 'tag=v2.5.3'
                  echo "conclusion=$conclusion"
                  echo "run_id=$run_id"
                  echo "run_url=$run_url"
                  printf '%s\n' "$failed"
                } > /tmp/release-status
                write_status 'release: record failed v2.5.3 publication'
                exit 1
              fi

              if [ "$status" = completed ] && [ "$conclusion" = success ]; then
                json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.5.3")
                test "$(printf '%s' "$json" | jq -r '.draft')" = false
                test "$(printf '%s' "$json" | jq -r '.prerelease')" = false
                test "$(printf '%s' "$json" | jq -r '.assets | length')" -eq 5
                for asset in \
                  BaiZe-v2.5.3-Module.zip \
                  BaiZe-v2.5.3-Module.zip.sha256 \
                  BaiZe-v2.5.3-signing-certificate.txt \
                  BaiZe-v2.5.3.apk \
                  BaiZe-v2.5.3.apk.sha256; do
                  printf '%s' "$json" | jq -e --arg name "$asset" '.assets[] | select(.name == $name)' >/dev/null
                done
                published=$(printf '%s' "$json" | jq -r '.published_at')
                url=$(printf '%s' "$json" | jq -r '.html_url')
                digest_lines=$(printf '%s' "$json" | jq -r '.assets[] | "asset=" + .name + "|size=" + (.size|tostring) + "|digest=" + (.digest // "")' | sort)
                {
                  echo 'status=published'
                  echo 'tag=v2.5.3'
                  echo 'draft=false'
                  echo 'prerelease=false'
                  echo 'asset_count=5'
                  echo "run_id=$run_id"
                  echo "run_url=$run_url"
                  echo "published_at=$published"
                  echo "url=$url"
                  printf '%s\n' "$digest_lines"
                } > /tmp/release-status
                write_status 'release: record published v2.5.3 assets'
                exit 0
              fi
            fi
            sleep 20
          done

          {
            echo 'status=timeout'
            echo 'tag=v2.5.3'
          } > /tmp/release-status
          write_status 'release: record v2.5.3 probe timeout'
          exit 1
