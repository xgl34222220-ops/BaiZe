name: Snapshot BaiZe v2.5.5 Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2.5.5-assets-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tag and formal release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: 9829ad5d28cc33594a46d7b3325e1a85f6ee4970
        run: |
          set -euo pipefail
          mkdir -p v2/release
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.5.5" --jq .object.sha)
          test "$tag_sha" = "$RELEASE_TARGET_SHA"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.5.5")
          draft=$(printf '%s' "$release" | jq -r '.draft')
          prerelease=$(printf '%s' "$release" | jq -r '.prerelease')
          test "$draft" = false
          test "$prerelease" = false
          expected=$(printf '%s\n' \
            'BaiZe-v2.5.5-Module.zip' \
            'BaiZe-v2.5.5-Module.zip.sha256' \
            'BaiZe-v2.5.5-signing-certificate.txt' \
            'BaiZe-v2.5.5.apk' \
            'BaiZe-v2.5.5.apk.sha256' | sort)
          actual=$(printf '%s' "$release" | jq -r '.assets[].name' | sort)
          test "$actual" = "$expected"
          printf '%s' "$release" | jq \
            --arg target "$RELEASE_TARGET_SHA" \
            --arg tagSha "$tag_sha" \
            '{result:"success",target:$target,tagSha:$tagSha,tag_name,name,draft,prerelease,html_url,published_at,assets:[.assets[]|{name,size,digest}]}' \
            > v2/release/v2.5.5-assets.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/release/v2.5.5-assets.json
          git commit -m 'release: verify v2.5.5 formal assets'
          git push origin HEAD:main
