name: Probe BaiZe v2.5.5 Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2.5.5-publication-probe.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for release and record verified status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRIGGER_SHA: 6299801f795f61af1e0f1d6265dccc5397dcce0c
          RELEASE_TARGET_SHA: 9829ad5d28cc33594a46d7b3325e1a85f6ee4970
        run: |
          set -u
          mkdir -p v2/release
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          jq -n \
            --arg version 'v2.5.5' \
            --arg result 'probing' \
            --arg detail 'publication probe is running' \
            --arg target "$RELEASE_TARGET_SHA" \
            '{version:$version,result:$result,detail:$detail,target:$target}' \
            > v2/release/v2.5.5-publish-status.json
          git add v2/release/v2.5.5-publish-status.json
          git commit -m 'release: record v2.5.5 publication probe start' || true
          git push origin HEAD:main || true

          run_id=''
          status='waiting'
          conclusion=''
          result='timeout'
          detail='release workflow did not complete before probe timeout'
          assets_json='[]'
          release_url=''
          tag_sha=''

          for attempt in $(seq 1 100); do
            row=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v2.5.5-release.yml/runs?branch=main&event=push&per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"$RELEASE_TRIGGER_SHA\") | [.id,.status,(.conclusion // \"\")] | @tsv" 2>/dev/null | head -n 1 || true)
            if [ -n "$row" ]; then
              run_id=$(printf '%s' "$row" | cut -f1)
              status=$(printf '%s' "$row" | cut -f2)
              conclusion=$(printf '%s' "$row" | cut -f3)
              echo "release_run=$run_id status=$status conclusion=${conclusion:-pending}"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  result='success'
                  detail='release workflow completed successfully'
                else
                  result='failure'
                  detail="release workflow completed with conclusion: ${conclusion:-unknown}"
                fi
                break
              fi
            else
              echo 'waiting for v2.5.5 release run'
            fi
            sleep 15
          done

          if [ "$result" = success ]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.5.5" --jq .object.sha 2>/dev/null || true)
            release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.5.5" 2>/dev/null || true)
            if [ -z "$release_json" ]; then
              result='failure'
              detail='release workflow succeeded but v2.5.5 release was not readable'
            else
              release_url=$(printf '%s' "$release_json" | jq -r '.html_url // ""')
              assets_json=$(printf '%s' "$release_json" | jq -c '[.assets[] | {name,size,digest}]')
              draft=$(printf '%s' "$release_json" | jq -r '.draft')
              prerelease=$(printf '%s' "$release_json" | jq -r '.prerelease')
              expected=$(printf '%s\n' \
                'BaiZe-v2.5.5-Module.zip' \
                'BaiZe-v2.5.5-Module.zip.sha256' \
                'BaiZe-v2.5.5-signing-certificate.txt' \
                'BaiZe-v2.5.5.apk' \
                'BaiZe-v2.5.5.apk.sha256' | sort)
              actual=$(printf '%s' "$release_json" | jq -r '.assets[].name' | sort)
              if [ "$tag_sha" != "$RELEASE_TARGET_SHA" ]; then
                result='failure'
                detail="tag target mismatch: $tag_sha"
              elif [ "$draft" != false ] || [ "$prerelease" != false ]; then
                result='failure'
                detail="release flags invalid: draft=$draft prerelease=$prerelease"
              elif [ "$actual" != "$expected" ]; then
                result='failure'
                detail='release asset set mismatch'
              else
                detail='v2.5.5 workflow, immutable tag and five formal assets verified'
              fi
            fi
          fi

          jq -n \
            --arg version 'v2.5.5' \
            --arg result "$result" \
            --arg detail "$detail" \
            --arg runId "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg target "$RELEASE_TARGET_SHA" \
            --arg tagSha "$tag_sha" \
            --arg releaseUrl "$release_url" \
            --argjson assets "$assets_json" \
            '{version:$version,result:$result,detail:$detail,runId:$runId,status:$status,conclusion:$conclusion,target:$target,tagSha:$tagSha,releaseUrl:$releaseUrl,assets:$assets}' \
            > v2/release/v2.5.5-publish-status.json

          git pull --rebase origin main || true
          git add v2/release/v2.5.5-publish-status.json
          git commit -m "release: record v2.5.5 publication status ($result)" || true
          git push origin HEAD:main || true
          [ "$result" = success ]
