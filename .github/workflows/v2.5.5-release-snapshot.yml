name: Snapshot BaiZe v2.5.5 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2.5.5-release-snapshot.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record current release workflow state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TRIGGER_SHA: 6299801f795f61af1e0f1d6265dccc5397dcce0c
        run: |
          set -euo pipefail
          mkdir -p v2/release
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/v2.5.5-release.yml/runs?branch=main&event=push&per_page=20")
          run_id=$(printf '%s' "$run_json" | jq -r --arg sha "$RELEASE_TRIGGER_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n 1)
          test -n "$run_id"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs")
          jq -n \
            --argjson run "$run" \
            --argjson jobs "$jobs" \
            '{run:{id:$run.id,status:$run.status,conclusion:$run.conclusion,created_at:$run.created_at,updated_at:$run.updated_at},jobs:[$jobs.jobs[]|{name,status,conclusion,steps:[.steps[]|{name,status,conclusion}]}]}' \
            > v2/release/v2.5.5-release-snapshot.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/release/v2.5.5-release-snapshot.json
          git commit -m 'release: snapshot v2.5.5 workflow state'
          git push origin HEAD:main
