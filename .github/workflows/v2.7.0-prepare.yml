name: Prepare BaiZe v2.7.0

on:
  push:
    branches:
      - release/v2.7.0
    paths:
      - '.github/workflows/v2.7.0-prepare.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.7.0
          fetch-depth: 0

      - name: Apply v2.7.0 metadata
        shell: bash
        run: |
          set -euo pipefail
          sed -i -e 's/^version=v2\.6\.3$/version=v2.7.0/' -e 's/^versionCode=26003$/versionCode=27000/' module.prop v2/module/module.prop
          sed -i -e 's/versionCode = 26003/versionCode = 27000/' -e 's/versionName = "2\.6\.3"/versionName = "2.7.0"/' v2/app/build.gradle.kts
          sed -i 's/detached-root-worker-v2\.6\.3/detached-root-worker-v2.7.0/g' v2/module/task-worker.sh
          sed -i 's/正在安装白泽 v2\.6\.3/正在安装白泽 v2.7.0/g' v2/module/customize.sh
          cat > update.json <<'JSON'
          {
            "version": "v2.7.0",
            "versionCode": 27000,
            "zipUrl": "https://raw.githubusercontent.com/xgl34222220-ops/BaiZe/downloads/releases/v2.7.0/BaiZe-v2.7.0-Module.zip",
            "changelog": "https://raw.githubusercontent.com/xgl34222220-ops/BaiZe/main/RELEASE_NOTES_v2.7.0.md"
          }
          JSON
          cat > RELEASE_NOTES_v2.7.0.md <<'EOF'
          # 白泽 v2.7.0

          v2.7.0 以 v2.6.3 为稳定基线，合并风险归属与 CI 收口改动，重点提升用户数据保护、升级一致性与仓库可维护性。

          ## 安全与保护
          - 内置风险保护与用户自定义覆盖正式分层，升级后新版保护规则立即生效。
          - 用户精确路径覆盖优先，重复用户规则采用最后一条，避免旧状态与内置规则互相污染。
          - 蓝牙接收、回收站、Recovery/应用备份、相机与剪辑输出、录屏录音、办公文档、笔记、模拟器存档、代码工程、字体铃声、用户导出、工作数据与 MIUI 总目录等提高为 critical 保护。
          - 深度扫描继续坚持不可变快照、白名单、软链接与关键路径保护，不扩大危险删除边界。

          ## 性能与稳定性
          - 延续 v2.6.3 的原生共享存储索引、白名单预加载、fstatat/d_type 遍历与文件归类性能优化。
          - 文件归类继续使用持久媒体刷新队列、多用户路径与安全撤销逻辑。
          - notify.sh 启用未定义变量检查，进一步收紧 Root 脚本错误路径。

          ## 工程收口
          - 核心回归统一到 v2/tests/run-all.sh。
          - POSIX 生产脚本使用 sh 与 BusyBox ash 语法校验，Bash 测试独立校验。
          - 删除大量 alpha/v2.3 遗留 CI 工作流，保留当前 Android UI、核心回归与正式发布链。
          - UI 保持 v2.6.3 原版白泽界面，不引入实验性的洛书视觉或 Liquid Glass 改造。
          EOF

          cmp module.prop v2/module/module.prop
          grep -qx 'version=v2.7.0' module.prop
          grep -qx 'versionCode=27000' module.prop
          grep -q 'versionName = "2.7.0"' v2/app/build.gradle.kts
          grep -q 'versionCode = 27000' v2/app/build.gradle.kts
          grep -q 'detached-root-worker-v2.7.0' v2/module/task-worker.sh
          grep -Fqx 'ui_print "- 正在安装白泽 v2.7.0"' v2/module/customize.sh
          git diff --check

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '惜故里丶'
          git config user.email 'xgl34222220@gmail.com'
          git add module.prop v2/module/module.prop update.json v2/app/build.gradle.kts v2/module/task-worker.sh v2/module/customize.sh RELEASE_NOTES_v2.7.0.md
          git commit -m 'release: prepare BaiZe v2.7.0'
          git push origin HEAD:release/v2.7.0
