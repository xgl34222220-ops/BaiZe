name: Diagnose v2.0.3 scheduler payload

on:
  pull_request:
    branches: [v2]
    paths:
      - '.github/workflows/v203-payload-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.0.1-app-scheduler-takeover
          fetch-depth: 0
      - name: Trace exact normalized apply step
        shell: bash
        run: |
          set +e
          exec > >(tee v203-diagnostic.log) 2>&1
          set -x
          PAYLOAD=.github/v203-payload
          ROOT=v2/app/src/main/java/io/github/xgl34222220/baize
          mkdir -p "$ROOT/ui/clean/miuix" "$ROOT/ui/clean/material"

          cat "$PAYLOAD/BaiZeMiuixApp.kt.gz.b64.part1" "$PAYLOAD/BaiZeMiuixApp.kt.gz.b64.part2" | base64 --decode --ignore-garbage | gzip -d > "$ROOT/BaiZeMiuixApp.kt"
          echo "BaiZe decode rc=${PIPESTATUS[*]}"

          for spec in \
            "CleanContract.kt.gz.b64|$ROOT/ui/clean/CleanContract.kt" \
            "CleanRoute.kt.gz.b64|$ROOT/ui/clean/CleanRoute.kt" \
            "ScheduleInputDialogs.kt.gz.b64|$ROOT/ui/clean/ScheduleInputDialogs.kt" \
            "CleanScreenMiuix.kt.gz.b64|$ROOT/ui/clean/miuix/CleanScreenMiuix.kt" \
            "CleanScreenMaterial.kt.gz.b64|$ROOT/ui/clean/material/CleanScreenMaterial.kt"; do
            src=${spec%%|*}
            dst=${spec#*|}
            base64 --decode --ignore-garbage "$PAYLOAD/$src" | gzip -d > "$dst"
            echo "$src rc=${PIPESTATUS[*]}"
            wc -l -c "$dst"
          done

          python3 - <<'PY'
          from pathlib import Path

          kotlin_files = [
              'v2/app/src/main/java/io/github/xgl34222220/baize/BaiZeMiuixApp.kt',
              'v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/CleanContract.kt',
              'v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/CleanRoute.kt',
              'v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/ScheduleInputDialogs.kt',
              'v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/miuix/CleanScreenMiuix.kt',
              'v2/app/src/main/java/io/github/xgl34222220/baize/ui/clean/material/CleanScreenMaterial.kt',
          ]
          for path in kotlin_files:
              file = Path(path)
              file.write_text(file.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')

          def replace(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              print(f'REPLACE {path}: {old!r} count={actual}')
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, found {actual}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('v2/app/build.gradle.kts', 'versionCode = 22320', 'versionCode = 22330')
          replace('v2/app/build.gradle.kts', 'versionName = "2.0.2"', 'versionName = "2.0.3"')
          replace('v2/module/module.prop', 'version=v2.0.2', 'version=v2.0.3')
          replace('v2/module/module.prop', 'versionCode=22320', 'versionCode=22330')
          replace('v2/module/module.prop', 'description=白泽 v2.0.2：', 'description=白泽 v2.0.3：')
          replace('v2/module/service.sh', 'module_version=2.0.1', 'module_version=2.0.3')
          replace('v2/scripts/package-module.sh', 'BaiZe-v2.0.2-Module.zip', 'BaiZe-v2.0.3-Module.zip')
          replace('v2/scripts/package-module.sh', '^version=v2.0.2$', '^version=v2.0.3$')
          replace('v2/scripts/package-module.sh', '^versionCode=22320$', '^versionCode=22330$')
          replace('v2/scripts/package-module.sh', '白泽 v2.0.2 App 接管版模块', '白泽 v2.0.3 原生调度完整版模块')
          PY
          py_rc=$?
          echo "python rc=$py_rc"
          git diff --check
          diff_rc=$?
          echo "git diff check rc=$diff_rc"
          exit $(( py_rc != 0 || diff_rc != 0 ))
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v203-payload-diagnostic
          path: v203-diagnostic.log
