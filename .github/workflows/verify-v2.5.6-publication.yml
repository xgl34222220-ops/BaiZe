name: Verify BaiZe v2.5.6 Publication

on:
  push:
    branches:
      - main
    paths:
      - '.github/verify-v2.5.6.trigger'

permissions:
  contents: write

concurrency:
  group: verify-baize-v256-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for and verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/baize-v256-assets
          ok=0
          for attempt in $(seq 1 80); do
            if gh release view v2.5.6 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,publishedAt,url,assets > /tmp/baize-v256-release.json 2>/tmp/baize-v256-release.err; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            printf 'Release v2.5.6 did not appear after waiting.\n' > .github/release-v2.5.6.verification-failed
            cat /tmp/baize-v256-release.err >> .github/release-v2.5.6.verification-failed || true
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/release-v2.5.6.verification-failed
            git commit -m 'ci: record v2.5.6 publication verification failure'
            git push origin HEAD:main
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/baize-v256-release.json').read_text())
          assert data['tagName'] == 'v2.5.6'
          assert data['name'] == '白泽 v2.5.6'
          assert data['isDraft'] is False
          assert data['isPrerelease'] is False
          expected = {
              'BaiZe-v2.5.6-Module.zip',
              'BaiZe-v2.5.6-Module.zip.sha256',
              'BaiZe-v2.5.6.apk',
              'BaiZe-v2.5.6.apk.sha256',
              'BaiZe-v2.5.6-signing-certificate.txt',
          }
          names = {asset['name'] for asset in data['assets']}
          assert names == expected, (names, expected)
          for asset in data['assets']:
              assert asset.get('size', 0) > 0, asset
              assert asset.get('state', 'uploaded') == 'uploaded', asset
          PY

          gh release download v2.5.6 --repo "$GITHUB_REPOSITORY" --dir /tmp/baize-v256-assets
          cd /tmp/baize-v256-assets
          test -s BaiZe-v2.5.6-Module.zip
          test -s BaiZe-v2.5.6.apk
          unzip -tq BaiZe-v2.5.6-Module.zip
          unzip -p BaiZe-v2.5.6-Module.zip module.prop | grep -qx 'version=v2.5.6'
          unzip -p BaiZe-v2.5.6-Module.zip module.prop | grep -qx 'versionCode=25006'
          ZIP_EXPECTED=$(awk '{print $1}' BaiZe-v2.5.6-Module.zip.sha256)
          APK_EXPECTED=$(awk '{print $1}' BaiZe-v2.5.6.apk.sha256)
          ZIP_ACTUAL=$(sha256sum BaiZe-v2.5.6-Module.zip | awk '{print $1}')
          APK_ACTUAL=$(sha256sum BaiZe-v2.5.6.apk | awk '{print $1}')
          test "$ZIP_ACTUAL" = "$ZIP_EXPECTED"
          test "$APK_ACTUAL" = "$APK_EXPECTED"
          PACKAGED_APK=$(unzip -p BaiZe-v2.5.6-Module.zip app/baize.apk | sha256sum | awk '{print $1}')
          test "$PACKAGED_APK" = "$APK_ACTUAL"
          grep -qi '9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f' BaiZe-v2.5.6-signing-certificate.txt
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/baize-v256-release.json').read_text())
          assets = {a['name']: {'size': a['size'], 'url': a.get('url', '')} for a in data['assets']}
          Path('.github/release-v2.5.6.verified.json').write_text(json.dumps({
              'tag': data['tagName'],
              'name': data['name'],
              'publishedAt': data['publishedAt'],
              'url': data['url'],
              'assets': assets,
              'moduleSha256': Path('/tmp/baize-v256-assets/BaiZe-v2.5.6-Module.zip.sha256').read_text().split()[0],
              'apkSha256': Path('/tmp/baize-v256-assets/BaiZe-v2.5.6.apk.sha256').read_text().split()[0],
              'certificateSha256': '9efa848001ccdc168ea96753d332b1713e2668ba6a2fa22d5bfd98de65db1f0f',
              'verified': True,
          }, ensure_ascii=False, indent=2) + '\n')
          PY

          rm -f .github/release-v2.5.6.verification-failed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-v2.5.6.verified.json .github/release-v2.5.6.verification-failed
          git commit -m 'ci: verify published BaiZe v2.5.6 assets'
          git push origin HEAD:main
