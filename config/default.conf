# 只允许 key=value，不要在值中加入空格或命令。
enabled=1
screen_off_only=0
charging_only=0
device_idle_only=0
min_battery=25
max_battery_temp=0

# 根目录扫描工作进程：0=按本机历史基准自适应，1=固定串行，2=固定双工作进程。
scan_root_workers=0
# 自动模式首次使用串行；达到以下工作量后才尝试双工作进程。
scan_parallel_min_items=5000
# 双工作进程吞吐至少高于串行多少百分比才长期采用。
scan_parallel_min_gain_percent=15
# 每隔多少次成功扫描复测另一种模式，避免设备状态变化后推荐过时。
scan_parallel_reprobe_runs=6
# 双工作进程异常后暂停自动尝试的小时数。
scan_parallel_failure_cooldown_hours=24

# 清理任务与文件归类统一由 Root Supervisor 调度。
# 开启每日定时后，以固定时刻执行已启用任务组，并替代间隔定时。
schedule_cache_enabled=1
schedule_cache_hours=1
schedule_empty_enabled=1
schedule_empty_hours=1
schedule_rules_enabled=1
schedule_rules_hours=1
schedule_fragment_enabled=1
schedule_fragment_hours=1
schedule_deep_enabled=0
schedule_deep_hours=168
schedule_organize_enabled=0
schedule_organize_hours=24
organize_run_immediately=0
organizer_conflict_policy=1
organizer_undo_retention=10
organizer_media_scan=1
organize_screen_off_only=0
organize_charging_only=0
organize_device_idle_only=0

# 每日固定时刻（24 小时制），默认关闭。
# 到点后只在补做窗口内等待息屏、电量、充电或空闲条件。
daily_schedule_enabled=0
daily_schedule_hour=3
daily_schedule_minute=30
daily_grace_minutes=240

clean_app_cache=1
clean_external_cache=1
clean_system_logs=1
clean_oem_logs=0
clean_empty_files=1
clean_empty_dirs=1
clean_root_shells=1
clean_app_rules=1
clean_hidden_junk=1
clean_fragments=1
clean_custom_rules=0
clean_installer_temp=1
clean_apk_packages=1
notify_on_complete=1
notify_zero_result=0

# 深度规则全部保留。高风险/关键规则默认只扫描；手动开启后仍需先完成一次 30 分钟内的深度扫描。
# 定时任务永远不会执行高风险/关键规则。
deep_high_risk_enabled=0

app_cache_days=0
external_cache_days=0
system_logs_days=7
oem_logs_days=7
empty_file_days=0
hidden_junk_days=0
fragment_days=7
installer_temp_days=7
apk_package_days=30
apk_package_max_mb=4096
root_shell_days=14
max_file_mb=256
app_task_max_minutes=20
# 深度扫描：单目录和整个扫描阶段的安全预算。
deep_dir_timeout_seconds=8
deep_stage_limit_seconds=180
# 深度清理：每个目标最多 30 秒，整个删除阶段最多 3 分钟；超时目标只跳过，不扩大删除范围。
deep_clean_target_timeout_seconds=30
deep_clean_stage_limit_seconds=180

schedule_cache_minutes=60

schedule_empty_minutes=60

schedule_rules_minutes=360

schedule_fragment_minutes=720

schedule_deep_minutes=10080

schedule_organize_minutes=1440

quarantine_retention_days=7

shared_index_ttl_seconds=300
