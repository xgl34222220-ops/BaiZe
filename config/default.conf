# 只允许 key=value，不要在值中加入空格或命令。
enabled=1
screen_off_only=1
charging_only=0
device_idle_only=0
min_battery=25
max_battery_temp=45
max_run_minutes=45

# 根目录扫描工作进程：0=按本机历史基准自适应，1=固定串行，2=固定双工作进程。
scan_root_workers=0
# 自动模式首次使用串行；达到以下工作量后才尝试双工作进程。
scan_parallel_min_items=5000
# 双工作进程吞吐至少高于串行多少百分比才长期采用。
scan_parallel_min_gain_percent=15
# 每隔多少次成功扫描复测另一种模式，避免设备状态变化后推荐过时。
scan_parallel_reprobe_runs=6
# 双工作进程异常后暂停自动尝试的小时数。
scan_parallel_failure_cooldown_hours=24

# 五组任务独立定时，周期单位为小时（1-720）。
# 开启每日定时后，以固定时刻执行已启用任务组，并替代间隔定时。
schedule_cache_enabled=1
schedule_cache_hours=1
schedule_empty_enabled=1
schedule_empty_hours=1
schedule_rules_enabled=1
schedule_rules_hours=1
schedule_fragment_enabled=1
schedule_fragment_hours=1
schedule_deep_enabled=0
schedule_deep_hours=168

# 每日固定时刻（24 小时制），默认关闭。
# 到点后只在补做窗口内等待息屏、电量、充电或空闲条件。
daily_schedule_enabled=0
daily_schedule_hour=3
daily_schedule_minute=30
daily_grace_minutes=240

clean_app_cache=1
clean_external_cache=1
clean_system_logs=1
clean_oem_logs=0
clean_empty_files=1
clean_empty_dirs=1
clean_root_shells=1
clean_app_rules=1
clean_hidden_junk=1
clean_fragments=1
clean_custom_rules=0
clean_installer_temp=1
clean_apk_packages=1
notify_on_complete=1
notify_zero_result=0

# 深度规则全部保留。高风险/关键规则默认只扫描；手动开启后仍需先完成一次 30 分钟内的深度扫描。
# 定时任务永远不会执行高风险/关键规则。
deep_high_risk_enabled=0

app_cache_days=0
external_cache_days=0
system_logs_days=7
oem_logs_days=7
empty_file_days=0
hidden_junk_days=0
fragment_days=7
installer_temp_days=7
apk_package_days=30
apk_package_max_mb=4096
root_shell_days=14
max_file_mb=256
