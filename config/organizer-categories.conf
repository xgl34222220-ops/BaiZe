# 白泽 文件归类分类表（唯一来源）
#
# 此前这份扩展名清单同时存在于四个地方：
#   v2/module/organizer-worker.sh      category_for()
#   v2/module/storage-index.sh         organizer 桶的 case 过滤
#   v2/native/baize_engine_42_4.c      is_organizer()
#   .../root/FileOrganizerEngine.kt    categoryFor()
# 四份没有对齐：索引侧只收 31 个扩展名，而归类器认识 68 个，
# 差集里的 .m4a .aac .ogg .opus .webm .flv .3gp .epub 等文件
# 永远进不了索引，也就永远归类不到。
#
# 格式：分类名=扩展名列表（空格分隔，小写，不带点）
# 改动后运行 bash v2/tests/test-organizer-categories.sh 校验各处一致。

图片=jpg jpeg png gif webp bmp heic heif avif dng raw
视频=mp4 mkv mov avi webm flv wmv m4v 3gp ts
音频=mp3 flac wav m4a aac ogg opus ape wma amr
文档=pdf doc docx xls xlsx ppt pptx txt rtf csv md odt ods odp
安装包=apk apks xapk apkm aab
压缩包=zip rar 7z tar gz bz2 xz zst tgz tbz2
电子书=epub mobi azw azw3 fb2 cbz cbr djvu
