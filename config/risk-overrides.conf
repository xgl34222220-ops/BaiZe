# 白泽 · 用户风险等级覆盖
#
# 用途：对某个路径手动指定风险等级，覆盖规则文件里的标注和引擎的路径推断。
# 覆盖对该路径本身及其所有子路径生效，多条命中时取最长匹配的那条。
#
# 格式：绝对路径|风险等级
# 风险等级取值：low / medium / high / critical
#
#   low       定时任务会自动删除
#   medium    定时任务会自动删除（默认上限）
#   high      只扫描，需要手动确认后才删除
#   critical  只扫描，需要手动确认；且必须显式把上限调到 critical
#
# 这个文件不会被模块升级覆盖。改完不需要重启，下一次扫描即生效。
#
# 想让某个目录再也不被自动清理：
#   /storage/emulated/0/Android/data/com.example.app/files/temp|high
#
# 想让某个确认是缓存的目录参与定时清理：
#   /storage/emulated/0/Android/data/com.example.app/webcache|low
#
# 想彻底保护某个路径（连手动清理都不碰），请改用 config/whitelist.conf。

# ——— 以下为默认内置保护，可按需修改 ———

# 登录凭据与账号标识：删除后会掉登录或丢失账号绑定
/storage/emulated/0/Android/data/com.tencent.ig/files/login-identifier.txt|high
/storage/emulated/0/Android/data/cn.kuwo.player/files/KuwoMusic/login|high

# 应用资源而非日志：华为钱包 NFC 卡面
/storage/emulated/0/Android/data/com.huawei.wallet/files/nfc/logo|high

# 整个应用数据镜像目录，不是缓存
/storage/emulated/0/Cacheapps2sdcard|high

# 用户编辑中的内容
/storage/emulated/0/Android/data/com.Chovvy.CytoidEditor/files/temps|high

# 下载暂存区内的临时目录。分段匹配下它们会落到 low，
# 这里显式保持 high，确保本次风险判定修复只收紧、不放宽。
/storage/emulated/0/Android/data/com.qq.qcloud/download_files/tmp|high
/storage/emulated/0/android/data/com.waocorp.asobaby/files/library/caches/tmp/downloadcache|high
/storage/emulated/0/android/data/com.waocorp.asobabyplus/files/library/caches/tmp/downloadcache|high

