# 白泽 · 内置风险保护表
#
# 这是随模块版本更新的内置保护层，不是用户配置。
# 深度扫描时会与 /data/adb/baize-v2/risk-overrides.conf 动态合并：
#   1. 用户精确同路径覆盖内置条目；
#   2. 更具体的子路径按最长祖先匹配生效；
#   3. 用户文件升级时不会被覆盖。
#
# 格式：绝对路径|风险等级
# 风险等级：low / medium / high / critical
#
# 本文件只放需要白泽默认收紧的路径。用户想调整风险，请修改状态目录中的
# risk-overrides.conf；想彻底保护（连手动清理都不碰）请使用 whitelist.conf。

# 登录凭据与账号标识：删除后会掉登录或丢失账号绑定
